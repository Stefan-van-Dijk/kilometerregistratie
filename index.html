<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kilometers">
<title>Kilometerregistratie</title>

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --card2:#1d2430;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --line:#2a3442;
  --accent:#4da3ff;
  --good:#49d17d;
  --warn:#ffbd4a;
  --bad:#ff6767;
  --radius:18px;
  --shadow:0 10px 30px rgba(0,0,0,.22)
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{min-height:100dvh}

.shell{
  max-width:820px;
  margin:auto;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(var(--bg) 72%,rgba(13,17,23,0));
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0 20px
}

.eyebrow,.kicker{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700
}

.top h1{
  font-size:24px;
  margin:3px 0 0
}

.iconbtn,.mini,.btn,.nav button,.action{font:inherit}

.iconbtn,.mini{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px
}

.hero,.card,.metric,.action,.notice,.empty,.list-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}

.hero{
  padding:22px;
  margin-bottom:14px
}

.hero h2{
  font-size:28px;
  margin:8px 0
}

.hero p,.card p,.hint,.muted,small{
  color:var(--muted)
}

.hero .primary{margin-top:18px}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 16px;
  background:var(--accent);
  color:white;
  font-weight:750;
  min-height:48px
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--line)
}

.btn.ghost{
  background:transparent;
  border:1px solid var(--line)
}

.btn.danger{background:#4b1f24}
.btn.full{width:100%}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.button-row .btn{flex:1}

.section{margin-top:22px}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px
}

.section-title h2,.card h3{margin:0}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.metric{padding:16px}

.metric span{
  color:var(--muted);
  font-size:13px
}

.metric strong{
  display:block;
  font-size:24px;
  margin-top:5px
}

.action-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px
}

.action{
  display:flex;
  text-align:left;
  align-items:center;
  gap:14px;
  padding:18px;
  color:var(--text);
  width:100%
}

.action .ico{
  font-size:26px;
  width:36px;
  text-align:center
}

.action strong{
  display:block;
  font-size:17px
}

.action small{
  display:block;
  margin-top:3px
}

.list{
  display:grid;
  gap:10px
}

.list-item{
  padding:14px;
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center
}

.list-main{min-width:0}

.list-main strong,.trip-path strong{display:block}

.list-main small,.trip-path small{
  display:block;
  margin-top:4px
}

.list-actions{
  display:flex;
  gap:7px
}

.trip-date{
  font-size:12px;
  color:var(--muted);
  min-width:58px
}

.trip-path{
  flex:1;
  min-width:0
}

.trip-km{
  font-weight:800;
  white-space:nowrap
}

.empty{
  padding:22px;
  text-align:center;
  color:var(--muted)
}

.card{
  padding:16px;
  margin-bottom:12px
}

.notice{
  padding:14px;
  color:var(--muted);
  margin:12px 0
}

.notice.warning{
  border-color:#6b5424;
  color:#ffd98a
}

.form-group{margin:13px 0}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  font:inherit;
  color:var(--text);
  background:#0f141b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  min-height:46px
}

.form-group textarea{
  min-height:90px;
  resize:vertical
}

.hint{
  font-size:12px;
  margin-top:6px;
  line-height:1.35
}

.status{
  display:inline-flex;
  gap:7px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  color:var(--muted)
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--good)
}

.nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(13,17,23,.94);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:center;
  border-top:1px solid var(--line)
}

.nav-inner{
  width:min(820px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  border-radius:12px
}

.nav button span{
  display:block;
  font-size:20px
}

.nav button small{font-size:10px}

.nav button.active{
  background:var(--card2);
  color:var(--text)
}

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.62);
  padding:22px 12px calc(22px + env(safe-area-inset-bottom));
  overflow:auto
}

.modal[hidden]{display:none}

.modal-panel{
  max-width:620px;
  margin:4vh auto 0;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  box-shadow:0 25px 80px rgba(0,0,0,.45)
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px
}

.modal-head h2{margin:0}

.close{
  border:0;
  background:var(--card2);
  color:var(--text);
  font-size:24px;
  width:40px;
  height:40px;
  border-radius:50%
}

.toast{
  position:fixed;
  z-index:90;
  left:50%;
  bottom:105px;
  transform:translate(-50%,15px);
  background:#f4f7fb;
  color:#111;
  padding:11px 15px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:86vw;
  text-align:center;
  font-weight:700
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.week-nav{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.week-nav .center{text-align:center}
.week-nav h2{margin:0}

.week-nav small{
  display:block;
  margin-top:4px
}

.divider{
  height:1px;
  background:var(--line);
  margin:16px 0
}

.route-box{
  background:#101722;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin:12px 0
}

.route-box strong{display:block}

.route-box small{
  display:block;
  margin-top:5px
}

.print-only{display:none}

@media(max-width:460px){
  .grid2{grid-template-columns:1fr}
  .hero h2{font-size:24px}
  .button-row{flex-direction:column}
  .button-row .btn{width:100%}
}

@media print{
  body{
    background:white;
    color:black
  }

  .top,.nav,.no-print,.modal,.toast{
    display:none!important
  }

  .shell{
    max-width:none;
    padding:0
  }

  .print-only{display:block}

  .card,.list-item,.metric{
    box-shadow:none;
    border-color:#ccc;
    background:white;
    color:black
  }

  .card p,.hint,.muted,small{
    color:#555
  }
}
</style>
</head>

<body>

<div class="shell">
  <header class="top">
    <div>
      <div id="today" class="eyebrow"></div>
      <h1>Kilometerregistratie</h1>
    </div>

    <button class="iconbtn" data-action="settings">⚙︎</button>
  </header>

  <main id="app"></main>
</div>

<nav class="nav">
  <div class="nav-inner">

    <button data-view="ride" class="active">
      <span>↗</span>
      <small>Rit</small>
    </button>

    <button data-view="week">
      <span>◫</span>
      <small>Week</small>
    </button>

    <button data-view="locations">
      <span>⌖</span>
      <small>Locaties</small>
    </button>

    <button data-view="report">
      <span>↥</span>
      <small>Rapport</small>
    </button>

    <button data-view="more">
      <span>•••</span>
      <small>Meer</small>
    </button>

  </div>
</nav>

<div id="modal" class="modal" hidden>
  <div class="modal-panel" id="modalPanel"></div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {

'use strict';

const KEY = 'kmreg-v4-data';

const DEFAULT = {
  settings: {
    name: '',
    vehicleBrand: '',
    vehicleModel: '',
    plate: '',
    initialOdometer: '',
    registrationStart: new Date().toISOString().slice(0,10),
    reportEmail: '',
    recognitionRadius: 500
  },
  locations: [],
  trips: [],
  events: [],
  trackPoints: [],
  activeTrip: null,
  lastEndpoint: null
};

let data = load();
let view = 'ride';
let selectedWeek = startOfWeek(new Date());

let gpsWatch = null;
let gpsTimer = null;
let gpsLatest = null;

const app = document.getElementById('app');
const modal = document.getElementById('modal');
const modalPanel = document.getElementById('modalPanel');
const toastEl = document.getElementById('toast');

document.getElementById('today').textContent =
  new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'long',
      day:'numeric',
      month:'long'
    }
  ).format(new Date());

cleanupOldApp().finally(() => {
  attemptLegacyMigration().finally(() => {
    render();

    if(data.activeTrip){
      startTracking();
    }
  });
});

function load(){
  try{
    const raw = localStorage.getItem(KEY);

    if(raw){
      return normalize(JSON.parse(raw));
    }
  }catch(e){
    console.error(e);
  }

  return structuredCloneSafe(DEFAULT);
}

function normalize(x){

  return {
    settings:{
      ...DEFAULT.settings,
      ...(x.settings || {})
    },

    locations:
      Array.isArray(x.locations)
        ? x.locations
        : [],

    trips:
      Array.isArray(x.trips)
        ? x.trips
        : [],

    events:
      Array.isArray(x.events)
        ? x.events
        : [],

    trackPoints:
      Array.isArray(x.trackPoints)
        ? x.trackPoints
        : [],

    activeTrip:
      x.activeTrip || null,

    lastEndpoint:
      x.lastEndpoint || null
  };
}

function save(){

  try{

    const json = JSON.stringify(data);

    localStorage.setItem(KEY,json);

    const check = localStorage.getItem(KEY);

    if(!check){
      throw new Error('Opslagcontrole mislukt');
    }

    return true;

  }catch(e){

    console.error(e);

    throw new Error(
      'Opslaan op deze iPhone is mislukt. Controleer of Safari lokale websitegegevens mag bewaren.'
    );
  }
}

function uid(){

  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return (
    'id-' +
    Date.now().toString(36) +
    '-' +
    Math.random().toString(36).slice(2)
  );
}

function structuredCloneSafe(x){
  return JSON.parse(JSON.stringify(x));
}

async function cleanupOldApp(){

  try{

    if('serviceWorker' in navigator){

      const registrations =
        await navigator.serviceWorker.getRegistrations();

      for(const registration of registrations){
        await registration.unregister();
      }
    }

    if('caches' in window){

      for(const key of await caches.keys()){

        if(key.startsWith('kmreg-')){
          await caches.delete(key);
        }
      }
    }

  }catch(e){
    console.warn(e);
  }
}

async function attemptLegacyMigration(){

  if(localStorage.getItem(KEY)){
    return;
  }

  if(!('indexedDB' in window)){
    return;
  }

  try{

    const req =
      indexedDB.open('kmreg-db');

    const db =
      await new Promise((resolve,reject) => {

        req.onsuccess = () =>
          resolve(req.result);

        req.onerror = () =>
          reject(req.error);

        req.onupgradeneeded = () => {};
      });

    const names =
      [...db.objectStoreNames];

    if(!names.length){
      db.close();
      return;
    }

    const getAll =
      store =>
      new Promise(resolve => {

        if(!names.includes(store)){
          resolve([]);
          return;
        }

        const tx =
          db.transaction(store,'readonly');

        const request =
          tx.objectStore(store).getAll();

        request.onsuccess =
          () => resolve(request.result || []);

        request.onerror =
          () => resolve([]);
      });

    const getOne =
      (store,id) =>
      new Promise(resolve => {

        if(!names.includes(store)){
          resolve(null);
          return;
        }

        const tx =
          db.transaction(store,'readonly');

        const request =
          tx.objectStore(store).get(id);

        request.onsuccess =
          () => resolve(request.result || null);

        request.onerror =
          () => resolve(null);
      });

    const [
      settings,
      locations,
      trips,
      events,
      trackPoints,
      activeTrip,
      lastEndpoint
    ] =
      await Promise.all([

        getOne('settings','main'),

        getAll('locations'),

        getAll('trips'),

        getAll('events'),

        getAll('trackPoints'),

        getOne(
          'appState',
          'activeTrip'
        ),

        getOne(
          'appState',
          'lastEndpoint'
        )
      ]);

    if(
      settings ||
      locations.length ||
      trips.length ||
      events.length
    ){

      data =
        normalize({
          settings,
          locations,
          trips,
          events,
          trackPoints,
          activeTrip,
          lastEndpoint
        });

      save();

      toast(
        'Bestaande gegevens zijn overgenomen.'
      );
    }

    db.close();

  }catch(e){

    console.warn(
      'Legacy migration',
      e
    );
  }
}

document.addEventListener(
  'click',
  async e => {

    const viewButton =
      e.target.closest('[data-view]');

    if(viewButton){

      view =
        viewButton.dataset.view;

      render();

      return;
    }

    const el =
      e.target.closest('[data-action]');

    if(!el){
      return;
    }

    const action =
      el.dataset.action;

    try{

      if(action === 'settings'){

        view = 'settings';
        render();
      }

      else if(action === 'close'){
        closeModal();
      }

      else if(action === 'start'){
        await openStart();
      }

      else if(action === 'arrive'){
        await openArrival();
      }

      else if(action === 'apple-active'){

        openApple(
          data.activeTrip?.origin,
          data.activeTrip?.expectedDestination
        );
      }

      else if(action === 'apple-form'){
        openAppleFromForm();
      }

      else if(action === 'add-location'){
        openLocation();
      }

      else if(action === 'current-location'){
        await openLocation(null,true);
      }

      else if(action === 'gps-location'){
        await fillGps();
      }

      else if(action === 'edit-location'){

        openLocation(
          el.closest('[data-id]').dataset.id
        );
      }

      else if(action === 'delete-location'){

        deleteLocation(
          el.closest('[data-id]').dataset.id
        );
      }

      else if(action === 'tank'){
        await openTank();
      }

      else if(action === 'manual'){
        openManual();
      }

      else if(action === 'private'){
        openPrivate();
      }

      else if(action === 'week-prev'){

        selectedWeek =
          addDays(selectedWeek,-7);

        render();
      }

      else if(action === 'week-next'){

        selectedWeek =
          addDays(selectedWeek,7);

        render();
      }

      else if(action === 'week-now'){

        selectedWeek =
          startOfWeek(new Date());

        render();
      }

      else if(action === 'edit-trip'){

        openTripEdit(
          el.closest('[data-id]').dataset.id
        );
      }

      else if(action === 'delete-trip'){

        deleteTrip(
          el.dataset.id ||
          el.closest('[data-id]')?.dataset.id
        );
      }

      else if(action === 'export'){
        exportJson();
      }

      else if(action === 'import'){

        document
          .getElementById('importFile')
          ?.click();
      }

      else if(action === 'csv'){
        downloadCsv();
      }

      else if(action === 'email'){
        emailReport();
      }

      else if(action === 'share'){
        await shareCsv();
      }

      else if(action === 'print'){
        window.print();
      }

    }catch(err){

      console.error(err);

      toast(
        err.message ||
        'Er ging iets mis'
      );
    }
  }
);

document.addEventListener(
  'submit',
  async e => {

    if(
      !(e.target instanceof HTMLFormElement)
    ){
      return;
    }

    e.preventDefault();

    const form =
      e.target;

    const fd =
      new FormData(form);

    try{

      if(form.id === 'locationForm'){
        saveLocation(fd);
      }

      else if(form.id === 'settingsForm'){
        saveSettings(fd);
      }

      else if(form.id === 'startForm'){
        await saveStart(fd);
      }

      else if(form.id === 'arrivalForm'){
        saveArrival(fd);
      }

      else if(form.id === 'tankForm'){
        saveTank(fd);
      }

      else if(form.id === 'manualForm'){
        saveManual(fd);
      }

      else if(form.id === 'privateForm'){
        savePrivate(fd);
      }

      else if(form.id === 'tripEditForm'){
        saveTripEdit(fd);
      }

    }catch(err){

      console.error(err);

      toast(
        err.message ||
        'Opslaan mislukt'
      );
    }
  }
);

document.addEventListener(
  'change',
  async e => {

    if(
      e.target.id === 'importFile' &&
      e.target.files?.[0]
    ){
      await importJson(
        e.target.files[0]
      );
    }

    if(
      e.target.id === 'arrivalCategory'
    ){
      updatePrivateHint();
    }
  }
);

document.addEventListener(
  'input',
  e => {

    if(
      e.target.name === 'endOdometer' &&
      document.getElementById('arrivalForm')
    ){
      updateArrivalPreview();
    }
  }
);

function render(){

  document
    .querySelectorAll('[data-view]')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.view === view
      );
    });

  if(view === 'ride'){
    renderRide();
  }

  else if(view === 'week'){
    renderWeek();
  }

  else if(view === 'locations'){
    renderLocations();
  }

  else if(view === 'report'){
    renderReport();
  }

  else if(view === 'more'){
    renderMore();
  }

  else if(view === 'settings'){
    renderSettings();
  }
}

function renderRide(){

  const active =
    data.activeTrip;

  const last =
    data.lastEndpoint ||
    inferLast();

  const week =
    tripsRange(
      startOfWeek(new Date()),
      addDays(
        startOfWeek(new Date()),
        7
      )
    );

  const total =
    sum(
      week,
      'actualKm'
    );

  app.innerHTML = `

    <section class="hero">

      <div class="kicker">
        ${active ? 'Actieve rit' : 'Huidige stand'}
      </div>

      ${
        active
        ? `
          <h2>
            ${esc(labelLoc(active.origin))}
            →
            ${esc(labelLoc(active.expectedDestination))}
          </h2>

          <p>
            Startstand ${odo(active.startOdometer)} km
            ${
              active.proposedRouteKm != null
              ? ` · routevoorstel ${km(active.proposedRouteKm)} km`
              : ''
            }
          </p>

          <span class="status">
            <span class="dot"></span>
            Gestart ${time(active.departureTime)}
          </span>

          <div class="button-row primary">

            <button
              class="btn secondary"
              data-action="apple-active"
            >
              Open Apple Kaarten
            </button>

            <button
              class="btn"
              data-action="arrive"
            >
              Aankomst registreren
            </button>

          </div>
        `
        : `
          <h2>
            ${
              last
              ? odo(last.odometer) + ' km'
              : 'Nog geen beginstand'
            }
          </h2>

          <p>
            ${
              last && last.location
              ? `Laatste bestemming: ${esc(labelLoc(last.location))}`
              : 'Vul bij Instellingen je auto en beginstand in.'
            }
          </p>

          <div class="primary">

            <button
              class="btn full"
              data-action="start"
            >

function saveLocation(fd){

  const id =
    String(
      fd.get('id') ||
      uid()
    );

  const old =
    data.locations.find(
      item =>
        item.id === id
    );

  const rawName =
    String(
      fd.get('name') ||
      ''
    ).trim();

  const address =
    String(
      fd.get('address') ||
      ''
    ).trim();

  const lat =
    parseCoord(
      fd.get('lat')
    );

  const lng =
    parseCoord(
      fd.get('lng')
    );

  if(
    (lat === null) !==
    (lng === null)
  ){
    throw new Error(
      'Vul beide GPS-coördinaten in, of laat beide leeg.'
    );
  }

  if(
    lat !== null &&
    Math.abs(lat) > 90
  ){
    throw new Error(
      'Latitude is ongeldig.'
    );
  }

  if(
    lng !== null &&
    Math.abs(lng) > 180
  ){
    throw new Error(
      'Longitude is ongeldig.'
    );
  }

  if(
    !rawName &&
    !address &&
    lat === null
  ){
    throw new Error(
      'Vul minimaal een adres in of gebruik huidige GPS.'
    );
  }

  const name =
    rawName ||
    address ||
    (
      lat !== null
      ? `Locatie ${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`
      : 'Locatie'
    );

  const location = {
    id,
    name,
    address,
    lat,
    lng,

    type:
      String(
        fd.get('type') ||
        'other'
      ),

    useCount:
      old?.useCount || 0,

    createdAt:
      old?.createdAt ||
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()
  };

  const index =
    data.locations.findIndex(
      item =>
        item.id === id
    );

  if(index >= 0){

    data.locations[index] =
      location;

  }else{

    data.locations.push(
      location
    );
  }

  save();

  closeModal();

  render();

  toast(
    `Locatie opgeslagen: ${name}`
  );
}

async function saveStart(fd){

  const origin =
    JSON.parse(
      String(fd.get('origin'))
    );

  const destination =
    data.locations.find(
      item =>
        item.id ===
        fd.get('destinationId')
    );

  if(!destination){

    throw new Error(
      'Kies een bestemming.'
    );
  }

  const startOdometer =
    num(
      fd.get('startOdometer')
    );

  if(startOdometer === null){

    throw new Error(
      'Vul de startkilometerstand in.'
    );
  }

  const manualRoute =
    parseNum(
      fd.get('routeKm')
    );

  const historicRoute =
    historyDistance(
      origin,
      destination
    );

  const proposal =
    manualRoute ??
    historicRoute;

  data.activeTrip = {

    id:
      uid(),

    origin:
      snap(origin),

    expectedDestination:
      snap(destination),

    startOdometer,

    departureTime:
      new Date(
        String(
          fd.get('departureTime')
        )
      ).toISOString(),

    proposedRouteKm:
      proposal,

    routeSource:
      manualRoute !== null
      ? 'Apple Kaarten ingevuld'
      : historicRoute !== null
      ? 'historie'
      : null
  };

  incrementUse(
    destination.id
  );

  save();

  closeModal();

  render();

  await startTracking();

  toast(
    'Vertrek opgeslagen.'
  );
}

async function openArrival(){

  const active =
    data.activeTrip;

  if(!active){

    toast(
      'Er is geen actieve rit.'
    );

    return;
  }

  let gps = null;
  let nearby = [];

  try{

    gps =
      await getPosition();

    nearby =
      matches(gps);

  }catch(e){
    console.warn(e);
  }

  const expected =
    data.locations.find(
      location =>
        location.id ===

function saveArrival(fd){

  const active =
    data.activeTrip;

  if(!active){

    throw new Error(
      'Actieve rit ontbreekt.'
    );
  }

  const endOdometer =
    num(
      fd.get('endOdometer')
    );

  if(
    endOdometer === null ||
    endOdometer <
    active.startOdometer
  ){

    throw new Error(
      'Controleer de eindkilometerstand.'
    );
  }

  const actualKm =
    endOdometer -
    active.startOdometer;

  const choice =
    String(
      fd.get('destinationChoice')
    );

  const current =
    JSON.parse(
      String(
        fd.get('currentJson') ||
        'null'
      )
    );

  let destination = null;

  if(
    choice.startsWith('known:')
  ){

    destination =
      data.locations.find(
        item =>
          item.id ===
          choice.slice(6)
      );

  }else{

    destination =
      current;
  }

  if(!destination){

    throw new Error(
      'Kies een bestemming.'
    );
  }

  const category =
    String(
      fd.get('category')
    );

  const privateKm =
    category === 'private'

    ? actualKm

    : (
        num(
          fd.get('privateKm')
        ) || 0
      );

  if(
    privateKm < 0 ||
    privateKm > actualKm
  ){

    throw new Error(
      'Privékilometers moeten tussen 0 en het totaal liggen.'
    );
  }

  const distribution =
    split(
      actualKm,
      category,
      privateKm
    );

  const trip = {

    id:
      active.id,

    origin:
      active.origin,

    destination:
      snap(destination),

    departureTime:
      active.departureTime,

    arrivalTime:
      new Date(
        String(
          fd.get('arrivalTime')
        )
      ).toISOString(),

    startOdometer:
      active.startOdometer,

    endOdometer,

    actualKm,

    proposedRouteKm:
      active.proposedRouteKm ?? null,

    category,

    reason:
      String(
        fd.get('reason') ||
        ''
      ).trim(),

    privateKm:
      distribution.private,

    businessKm:
      distribution.business,

    commuteKm:
      distribution.commute
  };

  data.trips.push(trip);

  data.lastEndpoint = {

    location:
      snap(destination),

    odometer:
      endOdometer,

    time:
      trip.arrivalTime
  };

  data.activeTrip =
    null;

  if(destination.id){

    incrementUse(
      destination.id
    );
  }

  save();

  stopTracking();

  closeModal();

  render();

  toast(
    `Rit opgeslagen: ${km(actualKm)} km.`
  );
}

async function getPosition(){

  return new Promise(
    (resolve,reject) => {

      if(!navigator.geolocation){

        reject(
          new Error(
            'GPS wordt niet ondersteund.'
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy
          });
        },

        error => {

          reject(
            new Error(

              error.code === 1
              ? 'Geen locatietoestemming. Controleer de locatie-instellingen van Safari.'
              : error.code === 3
              ? 'GPS ophalen duurde te lang.'
              : 'GPS-locatie niet beschikbaar.'
            )
          );
        },

        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:15000
        }
      );
    }
  );
}

async function startTracking(){

  if(
    !data.activeTrip ||
    !navigator.geolocation ||
    gpsWatch !== null
  ){
    return;
  }

  gpsWatch =
    navigator.geolocation.watchPosition(

      position => {

        gpsLatest = {

          lat:
            position.coords.latitude,

          lng:
            position.coords.longitude,

          accuracy:
            position.coords.accuracy
        };
      },

      () => {},

      {
        enableHighAccuracy:true,
        maximumAge:15000,
        timeout:20000
      }
    );

  try{

    gpsLatest =
      await getPosition();

    persistTrack();

  }catch(e){
    console.warn(e);
  }

  gpsTimer =
    setInterval(
      persistTrack,
      60000
    );
}

function stopTracking(){

  if(gpsWatch !== null){

    navigator.geolocation.clearWatch(
      gpsWatch
    );
  }

  if(gpsTimer){

    clearInterval(
      gpsTimer
    );
  }

  gpsWatch = null;
  gpsTimer = null;
  gpsLatest = null;
}

function persistTrack(){

  if(
    !data.activeTrip ||
    !gpsLatest
  ){
    return;
  }

  const minute =
    new Date()
      .toISOString()
      .slice(0,16);

  const id =
    data.activeTrip.id +
    '_' +
    minute;

  if(
    data.trackPoints.some(
      point =>
        point.id === id
    )
  ){
    return;
  }

  data.trackPoints.push({

    id,

    tripId:
      data.activeTrip.id,

    time:
      new Date().toISOString(),

    lat:
      gpsLatest.lat,

    lng:
      gpsLatest.lng,

    accuracy:
      gpsLatest.accuracy ?? null
  });

  if(
    data.trackPoints.length >
    20000
  ){

    data.trackPoints =
      data.trackPoints.slice(
        -20000
      );
  }

  try{
    save();
  }catch(e){
    console.warn(e);
  }
}

function matches(gps){

  const radius =
    Number(
      data.settings.recognitionRadius
    ) || 500;

  return data.locations

    .filter(
      location =>
        location.lat !== null &&
        location.lat !== undefined &&
        location.lng !== null &&
        location.lng !== undefined
    )

    .map(
      location => ({
        location,
        distance:
          distance(
            gps,
            location
          )
      })
    )

    .filter(
      item =>
        item.distance <= radius
    )

    .sort(
      (a,b) =>
        a.distance -
        b.distance
    );
}

function distance(a,b){

  const earth =
    6371000;

  const rad =
    value =>
      value *
      Math.PI /
      180;

  const dLat =
    rad(
      Number(b.lat) -
      Number(a.lat)
    );

  const dLon =
    rad(
      Number(b.lng) -
      Number(a.lng)
    );

  const lat1 =
    rad(
      Number(a.lat)
    );

  const lat2 =
    rad(
      Number(b.lat)
    );

  const h =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLon/2) ** 2;

  return (
    2 *
    earth *
    Math.asin(
      Math.sqrt(h)
    )
  );
}

function currentLoc(gps){

  return {
    id:null,
    name:'Huidige locatie',
    address:'',
    lat:gps.lat,
    lng:gps.lng,
    type:'other'
  };
}

function openApple(
  origin,
  destination
){

  if(
    !origin ||
    !destination
  ){

    toast(
      'Vertrek of bestemming ontbreekt.'
    );

    return;
  }

  const mapValue =
    location => {

      if(
        location.lat !== null &&
        location.lat !== undefined &&
        location.lng !== null &&
        location.lng !== undefined
      ){

        return (
          `${location.lat},${location.lng}`
        );
      }

      return (
        location.address ||
        location.name ||
        ''
      );
    };

  const start =
    mapValue(origin);

  const end =
    mapValue(destination);

  if(
    !start ||
    !end
  ){

    toast(
      'Voor Apple Kaarten is een adres of GPS nodig.'
    );

    return;
  }

  window.location.href =
    'https://maps.apple.com/?saddr=' +
    encodeURIComponent(start) +
    '&daddr=' +
    encodeURIComponent(end) +
    '&dirflg=d';
}

function historyDistance(
  origin,
  destination
){

  const trips =
    data.trips
      .filter(
        trip =>
          sameLoc(
            trip.origin,
            origin
          ) &&
          sameLoc(
            trip.destination,
            destination
          )
      )
      .slice(-5);

  if(!trips.length){
    return null;
  }

  return (
    trips.reduce(
      (sum,trip) =>
        sum +
        Number(
          trip.actualKm ||
          0
        ),
      0
    ) /
    trips.length
  );
}

function sameLoc(a,b){

  if(
    a?.id &&
    b?.id
  ){
    return (
      a.id === b.id
    );
  }

  if(
    a?.lat !== null &&
    a?.lat !== undefined &&
    b?.lat !== null &&
    b?.lat !== undefined
  ){

    return (
      distance(a,b) <
      150
    );
  }

  const addressA =
    String(
      a?.address ||
      ''
    )
    .trim()
    .toLowerCase();

  const addressB =
    String(
      b?.address ||
      ''
    )
    .trim()
    .toLowerCase();

  return (
    !!addressA &&
    addressA === addressB
  );
}

function incrementUse(id){

  if(!id){
    return;
  }

  const location =
    data.locations.find(
      item =>
        item.id === id
    );

  if(location){

    location.useCount =
      (location.useCount || 0) +
      1;
  }
}

function inferLast(){

  const trip =
    sortedTripsByArrival()[0];

  if(trip){

    return {

      location:
        trip.destination,

      odometer:
        trip.endOdometer,

      time:
        trip.arrivalTime
    };
  }

  if(
    data.settings.initialOdometer
  ){

    return {

      location:null,

      odometer:
        num(
          data.settings.initialOdometer
        ),

      time:
        data.settings.registrationStart
    };
  }

  return null;
}

function split(
  total,
  category,
  privateKm
){

  const privateAmount =
    category === 'private'
    ? total
    : privateKm;

  return {

    private:
      privateAmount,

    business:
      category === 'business'
      ? total - privateAmount
      : 0,

    commute:
      category === 'commute'
      ? total - privateAmount
      : 0
  };
}

function exportJson(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  download(
    blob,
    `kilometerregistratie-backup-${new Date().toISOString().slice(0,10)}.json`
  );
}

async function importJson(file){

  try{

    const imported =
      JSON.parse(
        await file.text()
      );

    if(
      !confirm(
        'Bestaande gegevens vervangen door deze backup?'
      )
    ){
      return;
    }

    data =
      normalize(imported);

    save();

    render();

    toast(
      'Backup geïmporteerd.'
    );

  }catch(e){

    toast(
      'Backup kon niet worden gelezen.'
    );
  }
}

function reportTrips(){

  return tripsRange(
    startOfWeek(new Date()),
    addDays(
      startOfWeek(new Date()),
      7
    )
  );
}

function csvText(){

  const rows = [[
    'Datum',
    'Vertrek',
    'Bestemming',
    'Start km',
    'Eind km',
    'Totaal km',
    'Type',
    'Reden',
    'Zakelijk km',
    'Woon-werk km',
    'Privé km'
  ]];

  for(
    const trip of reportTrips()
  ){

    rows.push([

      dateTime(
        trip.departureTime
      ),

      labelLoc(
        trip.origin
      ),

      labelLoc(
        trip.destination
      ),

      trip.startOdometer,

      trip.endOdometer,

      trip.actualKm,

      categoryLabel(
        trip.category
      ),

      trip.reason || '',

      trip.businessKm || 0,

      trip.commuteKm || 0,

      trip.privateKm || 0
    ]);
  }

  return rows
    .map(
      row =>
        row
          .map(
            value =>
              '"' +
              String(value ?? '')
                .replaceAll(
                  '"',
                  '""'
                ) +
              '"'
          )
          .join(';')
    )
    .join('\n');
}

function downloadCsv(){

  download(

    new Blob(
      [csvText()],
      {
        type:
          'text/csv;charset=utf-8'
      }
    ),

    `kilometerregistratie-week-${isoWeek(new Date())}.csv`
  );
}

async function shareCsv(){

  const file =
    new File(
      [csvText()],
      `kilometerregistratie-week-${isoWeek(new Date())}.csv`,
      {
        type:'text/csv'
      }
    );

  if(
    navigator.canShare?.({
      files:[file]
    })
  ){

    await navigator.share({
      files:[file],
      title:
        'Kilometerregistratie'
    });

  }else{

    downloadCsv();
  }
}

function emailReport(){

  const total =
    totals(
      reportTrips()
    );

  const to =
    data.settings.reportEmail ||
    '';

  const subject =
    `Kilometerregistratie week ${isoWeek(new Date())}`;

  const body =
`Totaal: ${km(total.total)} km
Zakelijk: ${km(total.business)} km
Woon-werk: ${km(total.commute)} km
Privé: ${km(total.private)} km

Open de webapp voor ritdetails.`;

  window.location.href =
    'mailto:' +
    encodeURIComponent(to) +
    '?subject=' +
    encodeURIComponent(subject) +
    '&body=' +
    encodeURIComponent(body);
}

function download(
  blob,
  name
){

  const link =
    document.createElement('a');

  link.href =
    URL.createObjectURL(blob);

  link.download =
    name;

  document.body.appendChild(
    link
  );

  link.click();

  setTimeout(
    () => {

      URL.revokeObjectURL(
        link.href
      );

      link.remove();

    },
    1000
  );
}

function field(
  label,
  name,
  value = '',
  type = 'text',
  hint = ''
){

  return `

    <div class="form-group">

      <label>
        ${esc(label)}
      </label>

      <input
        name="${name}"
        type="${type}"
        value="${attr(value ?? '')}"
        ${
          type === 'number'
          ? 'inputmode="numeric"'
          : ''
        }
      >

      ${
        hint
        ? `
          <div class="hint">
            ${esc(hint)}
          </div>
        `
        : ''
      }

    </div>
  `;
}

function coordField(
  label,
  name,
  value = ''
){

  return `

    <div class="form-group">

      <label>
        ${esc(label)}
      </label>

      <input
        name="${name}"
        type="text"
        inputmode="decimal"
        value="${attr(value ?? '')}"
        placeholder="52.12345"
      >

    </div>
  `;
}

function locationOptions(
  selected = ''
){

  return [...data.locations]

    .sort(
      (a,b) =>
        (b.useCount || 0) -
        (a.useCount || 0) ||
        a.name.localeCompare(b.name)
    )

    .map(
      location => `

        <option
          value="${location.id}"
          ${
            location.id === selected
            ? 'selected'
            : ''
          }
        >
          ${esc(location.name)}
          ${
            location.address
            ? ' · ' + esc(location.address)
            : ''
          }
        </option>

      `
    )

    .join('');
}

function parseCoord(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ){
    return null;
  }

  const parsed =
    Number(
      String(value)
        .trim()
        .replace(',','.')
    );

  return (
    Number.isFinite(parsed)
    ? parsed
    : null
  );
}

function parseNum(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ){
    return null;
  }

  const parsed =
    Number(
      String(value)
        .trim()
        .replace(',','.')
    );

  return (
    Number.isFinite(parsed)
    ? parsed
    : null
  );
}

function num(value){

  if(
    value === '' ||
    value === null ||
    value === undefined
  ){
    return null;
  }

  const parsed =
    Number(value);

  return (
    Number.isFinite(parsed)
    ? parsed
    : null
  );
}

function snap(location){

  if(!location){
    return null;
  }

  return {

    id:
      location.id || null,

    name:
      location.name || '',

    address:
      location.address || '',

    lat:
      location.lat === null ||
      location.lat === undefined

      ? null

      : Number(location.lat),

    lng:
      location.lng === null ||
      location.lng === undefined

      ? null

      : Number(location.lng),

    type:
      location.type || 'other'
  };
}

function labelLoc(location){

  return (
    location?.name ||
    location?.address ||
    coords(location) ||
    ''
  );
}

function coords(location){

  if(
    location?.lat === null ||
    location?.lat === undefined ||
    location?.lng === null ||
    location?.lng === undefined
  ){
    return '';
  }

  return (
    Number(location.lat).toFixed(5) +
    ', ' +
    Number(location.lng).toFixed(5)
  );
}

function sortedTrips(){

  return [...data.trips]
    .sort(
      (a,b) =>
        new Date(b.departureTime) -
        new Date(a.departureTime)
    );
}

function sortedTripsByArrival(){

  return [...data.trips]
    .sort(
      (a,b) =>
        new Date(
          b.arrivalTime ||
          b.departureTime
        ) -
        new Date(
          a.arrivalTime ||
          a.departureTime
        )
    );
}

function tripsRange(
  start,
  end
){

  return sortedTrips()
    .filter(
      trip =>
        inRange(
          new Date(
            trip.departureTime
          ),
          start,
          end
        )
    );
}

function totals(trips){

  return {

    total:
      sum(
        trips,
        'actualKm'
      ),

    business:
      sum(
        trips,
        'businessKm'
      ),

    commute:
      sum(
        trips,
        'commuteKm'
      ),

    private:
      sum(
        trips,
        'privateKm'
      )
  };
}

function sum(
  items,
  key
){

  return items.reduce(
    (total,item) =>
      total +
      Number(
        item[key] ||
        0
      ),
    0
  );
}

function inRange(
  dateValue,
  start,
  end
){

  return (
    dateValue >= start &&
    dateValue < end
  );
}

function startOfWeek(dateValue){

  const date =
    new Date(dateValue);

  date.setHours(
    0,
    0,
    0,
    0
  );

  const day =
    date.getDay() || 7;

  date.setDate(
    date.getDate() -
    day +
    1
  );

  return date;
}

function addDays(
  dateValue,
  days
){

  const date =
    new Date(dateValue);

  date.setDate(
    date.getDate() +
    days
  );

  return date;
}

function isoWeek(dateValue){

  const date =
    new Date(
      Date.UTC(
        dateValue.getFullYear(),
        dateValue.getMonth(),
        dateValue.getDate()
      )
    );

  const day =
    date.getUTCDay() || 7;

  date.setUTCDate(
    date.getUTCDate() +
    4 -
    day
  );

  const first =
    new Date(
      Date.UTC(
        date.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        (
          date -
          first
        ) /
        86400000
      ) +
      1
    ) /
    7
  );
}

function date(value){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  ).format(
    new Date(value)
  );
}

function shortDate(value){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'short',
      day:'2-digit',
      month:'2-digit'
    }
  ).format(
    new Date(value)
  );
}

function dateTime(value){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  ).format(
    new Date(value)
  );
}

function time(value){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  ).format(
    new Date(value)
  );
}

function localInput(value){

  const date =
    new Date(value);

  const pad =
    number =>
      String(number)
        .padStart(
          2,
          '0'
        );

  return (
    `${date.getFullYear()}-` +
    `${pad(date.getMonth()+1)}-` +
    `${pad(date.getDate())}T` +
    `${pad(date.getHours())}:` +
    `${pad(date.getMinutes())}`
  );
}

function km(value){

  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:1
    }
  ).format(
    Number(value || 0)
  );
}

function odo(value){

  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value || 0)
  );
}

function categoryLabel(value){

  if(value === 'business'){
    return 'Zakelijk';
  }

  if(value === 'commute'){
    return 'Woon-werk';
  }

  if(value === 'private'){
    return 'Privé';
  }

  return 'Overig';
}

function typeLabel(value){

  if(value === 'home'){
    return 'Thuis';
  }

  if(value === 'work'){
    return 'Werk';
  }

  if(value === 'business'){
    return 'Zakelijk';
  }

  if(value === 'private'){
    return 'Privé';
  }

  return 'Overig';
}

function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    character => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[character])
  );
}

function attr(value){

  return esc(value)
    .replace(
      /`/g,
      '&#96;'
    );
}

})();

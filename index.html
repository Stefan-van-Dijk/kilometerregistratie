<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kilometers">
<title>Kilometerregistratie</title>

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --card2:#1d2430;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --line:#2a3442;
  --accent:#4da3ff;
  --good:#49d17d;
  --bad:#ff6767;
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100dvh;
}

button,input,select,textarea{
  font:inherit;
}

.shell{
  max-width:820px;
  margin:auto;
  min-height:100dvh;
  padding:
    env(safe-area-inset-top)
    16px
    calc(95px + env(safe-area-inset-bottom));
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0 20px;
  background:var(--bg);
}

.top h1{
  margin:3px 0 0;
  font-size:24px;
}

.eyebrow,
.kicker{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:12px;
  font-weight:700;
}

.card,
.hero,
.metric,
.list-item,
.action{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
}

.hero{
  padding:22px;
  margin-bottom:14px;
}

.hero h2{
  margin:8px 0;
  font-size:28px;
}

.hero p,
small,
.hint,
.muted{
  color:var(--muted);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.metric{
  padding:16px;
}

.metric span{
  color:var(--muted);
  font-size:13px;
}

.metric strong{
  display:block;
  margin-top:5px;
  font-size:24px;
}

.section{
  margin-top:22px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:10px;
}

.section-title h2{
  margin:0;
}

.btn,
.iconbtn,
.mini{
  border:0;
  cursor:pointer;
}

.btn{
  min-height:48px;
  padding:14px 16px;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-weight:750;
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--line);
}

.btn.full{
  width:100%;
}

.iconbtn,
.mini{
  padding:10px 12px;
  border-radius:12px;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--line);
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.button-row .btn{
  flex:1;
}

.list{
  display:grid;
  gap:10px;
}

.list-item{
  padding:14px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.list-main{
  min-width:0;
  flex:1;
}

.list-main strong,
.list-main small{
  display:block;
}

.list-main small{
  margin-top:4px;
}

.list-actions{
  display:flex;
  gap:6px;
}

.action-grid{
  display:grid;
  gap:12px;
}

.action{
  width:100%;
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  color:var(--text);
}

.action .ico{
  width:36px;
  text-align:center;
  font-size:26px;
}

.action strong,
.action small{
  display:block;
}

.action small{
  margin-top:4px;
}

.form-group{
  margin:14px 0;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  min-height:46px;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  color:var(--text);
  background:#0f141b;
}

.hint{
  margin-top:7px;
  font-size:12px;
  line-height:1.4;
}

.route-box{
  margin:12px 0;
  padding:14px;
  background:#101722;
  border:1px solid var(--line);
  border-radius:14px;
}

.route-box strong,
.route-box small{
  display:block;
}

.route-box small{
  margin-top:5px;
}

.nav{
  position:fixed;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(13,17,23,.96);
  backdrop-filter:blur(18px);
}

.nav-inner{
  width:min(820px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

.nav button{
  border:0;
  border-radius:12px;
  padding:8px 4px;
  background:transparent;
  color:var(--muted);
}

.nav button.active{
  background:var(--card2);
  color:var(--text);
}

.nav button span,
.nav button small{
  display:block;
}

.nav button span{
  font-size:20px;
}

.nav button small{
  font-size:10px;
}

.modal{
  position:fixed;
  z-index:50;
  inset:0;
  padding:22px 12px calc(22px + env(safe-area-inset-bottom));
  overflow:auto;
  background:rgba(0,0,0,.65);
}

.modal[hidden]{
  display:none;
}

.modal-panel{
  max-width:620px;
  margin:4vh auto 0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--bg);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h2{
  margin:0;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:var(--card2);
  color:var(--text);
  font-size:24px;
}

.toast{
  position:fixed;
  z-index:90;
  bottom:105px;
  left:50%;
  max-width:88vw;
  padding:12px 16px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  border-radius:999px;
  background:#f4f7fb;
  color:#111;
  text-align:center;
  font-weight:700;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.week-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.week-nav .center{
  text-align:center;
}

.week-nav h2{
  margin:0;
}

.empty{
  padding:22px;
  text-align:center;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--card);
}

@media(max-width:460px){
  .grid2{
    grid-template-columns:1fr;
  }

  .button-row{
    flex-direction:column;
  }

  .button-row .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="shell">

  <header class="top">
    <div>
      <div id="today" class="eyebrow"></div>
      <h1>Kilometerregistratie</h1>
    </div>

    <button class="iconbtn" data-action="settings">
      ⚙︎
    </button>
  </header>

  <main id="app"></main>

</div>

<nav class="nav">
  <div class="nav-inner">

    <button data-view="ride" class="active">
      <span>↗</span>
      <small>Rit</small>
    </button>

    <button data-view="week">
      <span>◫</span>
      <small>Week</small>
    </button>

    <button data-view="locations">
      <span>⌖</span>
      <small>Locaties</small>
    </button>

    <button data-view="report">
      <span>↥</span>
      <small>Rapport</small>
    </button>

    <button data-view="more">
      <span>•••</span>
      <small>Meer</small>
    </button>

  </div>
</nav>

<div id="modal" class="modal" hidden>
  <div id="modalPanel" class="modal-panel"></div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {

'use strict';

const STORAGE_KEY = 'kilometerregistratie-v6';

const DEFAULT_DATA = {
  settings:{
    name:'',
    vehicleBrand:'',
    vehicleModel:'',
    plate:'',
    initialOdometer:'',
    reportEmail:'',
    recognitionRadius:500
  },
  locations:[],
  trips:[],
  tankEvents:[],
  trackPoints:[],
  activeTrip:null,
  lastEndpoint:null
};

let data = loadData();
let currentView = 'ride';
let selectedWeek = startOfWeek(new Date());

let gpsWatch = null;
let gpsTimer = null;
let latestGps = null;

const app = document.getElementById('app');
const modal = document.getElementById('modal');
const modalPanel = document.getElementById('modalPanel');
const toastEl = document.getElementById('toast');

document.getElementById('today').textContent =
  new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'long',
      day:'numeric',
      month:'long'
    }
  ).format(new Date()) + ' · v6';

render();

if(data.activeTrip){
  startGpsTracking();
}


/* =========================
   OPSLAG
========================= */

function loadData(){

  try{

    const value =
      localStorage.getItem(STORAGE_KEY);

    if(!value){
      return clone(DEFAULT_DATA);
    }

    const parsed =
      JSON.parse(value);

    return {
      ...clone(DEFAULT_DATA),
      ...parsed,
      settings:{
        ...DEFAULT_DATA.settings,
        ...(parsed.settings || {})
      },
      locations:Array.isArray(parsed.locations) ? parsed.locations : [],
      trips:Array.isArray(parsed.trips) ? parsed.trips : [],
      tankEvents:Array.isArray(parsed.tankEvents) ? parsed.tankEvents : [],
      trackPoints:Array.isArray(parsed.trackPoints) ? parsed.trackPoints : []
    };

  }catch(error){

    console.error(
      'Laden mislukt',
      error
    );

    return clone(DEFAULT_DATA);
  }
}


function saveData(){

  const json =
    JSON.stringify(data);

  try{

    localStorage.setItem(
      STORAGE_KEY,
      json
    );

    const control =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!control){
      throw new Error(
        'De browser heeft niets opgeslagen.'
      );
    }

    JSON.parse(control);

    return true;

  }catch(error){

    console.error(
      'Opslagfout',
      error
    );

    throw new Error(
      'Lokale opslag is mislukt: ' +
      error.message
    );
  }
}


function clone(value){
  return JSON.parse(
    JSON.stringify(value)
  );
}


function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    '-' +
    Math.random().toString(36).slice(2)
  );
}


/* =========================
   ALGEMENE EVENTS
========================= */

document.addEventListener(
  'click',
  async event => {

    const viewButton =
      event.target.closest(
        '[data-view]'
      );

    if(viewButton){

      currentView =
        viewButton.dataset.view;

      render();

      return;
    }

    const button =
      event.target.closest(
        '[data-action]'
      );

    if(!button){
      return;
    }

    const action =
      button.dataset.action;

    try{

      if(action === 'settings'){

        currentView = 'settings';
        render();
      }

      else if(action === 'close-modal'){

        closeModal();
      }

      else if(action === 'add-location'){

        openLocationForm();
      }

      else if(action === 'add-current-location'){

        await openCurrentLocationForm();
      }

      else if(action === 'get-gps'){

        await fillCurrentGps();
      }

      else if(action === 'save-location'){

        saveLocationDirect();
      }

      else if(action === 'edit-location'){

        const id =
          button.closest('[data-id]')
            ?.dataset.id;

        openLocationForm(id);
      }

      else if(action === 'delete-location'){

        const id =
          button.closest('[data-id]')
            ?.dataset.id;

        deleteLocation(id);
      }

      else if(action === 'start-trip'){

        await openStartTrip();
      }

      else if(action === 'arrival'){

        await openArrival();
      }

      else if(action === 'apple-active'){

        openAppleMaps(
          data.activeTrip?.origin,
          data.activeTrip?.expectedDestination
        );
      }

      else if(action === 'apple-form'){

        openAppleMapsFromStartForm();
      }

      else if(action === 'tank'){

        await openTankForm();
      }

      else if(action === 'previous-week'){

        selectedWeek =
          addDays(
            selectedWeek,
            -7
          );

        render();
      }

      else if(action === 'next-week'){

        selectedWeek =
          addDays(
            selectedWeek,
            7
          );

        render();
      }

      else if(action === 'current-week'){

        selectedWeek =
          startOfWeek(
            new Date()
          );

        render();
      }

      else if(action === 'export'){

        exportJson();
      }

      else if(action === 'csv'){

        exportCsv();
      }

      else if(action === 'email'){

        emailReport();
      }

    }catch(error){

      console.error(error);

      showError(
        error.message ||
        'Er ging iets mis.'
      );
    }
  }
);


document.addEventListener(
  'submit',
  async event => {

    if(
      !(event.target instanceof HTMLFormElement)
    ){
      return;
    }

    event.preventDefault();

    const form =
      event.target;

    const formData =
      new FormData(form);

    try{

      if(form.id === 'settingsForm'){

        saveSettings(
          formData
        );
      }

      else if(form.id === 'startForm'){

        await saveStartTrip(
          formData
        );
      }

      else if(form.id === 'arrivalForm'){

        saveArrival(
          formData
        );
      }

      else if(form.id === 'tankForm'){

        saveTank(
          formData
        );
      }

    }catch(error){

      console.error(error);

      showError(
        error.message ||
        'Opslaan mislukt.'
      );
    }
  }
);


/* =========================
   RENDER
========================= */

function render(){

  document
    .querySelectorAll(
      '[data-view]'
    )
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.view === currentView
      );
    });

  if(currentView === 'ride'){
    renderRide();
  }

  else if(currentView === 'week'){
    renderWeek();
  }

  else if(currentView === 'locations'){
    renderLocations();
  }

  else if(currentView === 'report'){
    renderReport();
  }

  else if(currentView === 'more'){
    renderMore();
  }

  else if(currentView === 'settings'){
    renderSettings();
  }
}


/* =========================
   STARTSCHERM
========================= */

function renderRide(){

  const active =
    data.activeTrip;

  const last =
    data.lastEndpoint ||
    inferLastEndpoint();

  const thisWeek =
    tripsInRange(
      startOfWeek(new Date()),
      addDays(
        startOfWeek(new Date()),
        7
      )
    );

  const weekKm =
    sum(
      thisWeek,
      'actualKm'
    );

  app.innerHTML = `

    <section class="hero">

      <div class="kicker">
        ${
          active
          ? 'Actieve rit'
          : 'Huidige kilometerstand'
        }
      </div>

      ${
        active
        ? `
          <h2>
            ${escapeHtml(locationLabel(active.origin))}
            →
            ${escapeHtml(locationLabel(active.expectedDestination))}
          </h2>

          <p>
            Startstand:
            ${formatOdo(active.startOdometer)} km
          </p>

          <div class="button-row">

            <button
              class="btn secondary"
              data-action="apple-active"
            >
              Open Apple Kaarten
            </button>

            <button
              class="btn"
              data-action="arrival"
            >
              Aankomst
            </button>

          </div>
        `
        : `
          <h2>
            ${
              last
              ? formatOdo(last.odometer) + ' km'
              : 'Nog geen kilometerstand'
            }
          </h2>

          <p>
            ${
              last?.location
              ? 'Laatste locatie: ' +
                escapeHtml(
                  locationLabel(
                    last.location
                  )
                )
              : 'Stel eerst je auto en beginstand in.'
            }
          </p>

          <button
            class="btn full"
            data-action="start-trip"
          >
            Vertrek registreren
          </button>
        `
      }

    </section>

    <div class="grid2">

      ${metric(
        'Deze week',
        formatKm(weekKm) + ' km'
      )}

      ${metric(
        'Ritten',
        String(thisWeek.length)
      )}

    </div>
  `;
}


/* =========================
   LOCATIES
========================= */

function renderLocations(){

  const locations =
    [...data.locations]
      .sort(
        (a,b) =>
          (b.useCount || 0) -
          (a.useCount || 0)
      );

  app.innerHTML = `

    <div class="section-title">

      <div>

        <div class="kicker">
          Herkenning binnen
          ${
            Number(
              data.settings.recognitionRadius
            ) || 500
          }
          meter
        </div>

        <h2>
          Bekende locaties
        </h2>

      </div>

    </div>

    <div class="button-row">

      <button
        class="btn"
        data-action="add-current-location"
      >
        Huidige locatie
      </button>

      <button
        class="btn secondary"
        data-action="add-location"
      >
        Handmatig toevoegen
      </button>

    </div>

    <div class="section">

      ${
        locations.length
        ? `
          <div class="list">

            ${
              locations
                .map(
                  location => `

                    <div
                      class="list-item"
                      data-id="${location.id}"
                    >

                      <div class="list-main">

                        <strong>
                          ${escapeHtml(location.name)}
                        </strong>

                        <small>
                          ${
                            escapeHtml(
                              location.address ||
                              coordinatesLabel(location) ||
                              'Geen adres of GPS'
                            )
                          }
                        </small>

                        <small>
                          ${locationTypeLabel(location.type)}
                          ·
                          ${location.useCount || 0}× gebruikt
                        </small>

                      </div>

                      <div class="list-actions">

                        <button
                          class="mini"
                          data-action="edit-location"
                        >
                          Wijzig
                        </button>

                        <button
                          class="mini"
                          data-action="delete-location"
                        >
                          ×
                        </button>

                      </div>

                    </div>

                  `
                )
                .join('')
            }

          </div>
        `
        : `
          <div class="empty">
            Nog geen locaties opgeslagen.
          </div>
        `
      }

    </div>
  `;
}


function openLocationForm(
  id = null,
  gps = null
){

  const existing =
    id
    ? data.locations.find(
        item =>
          item.id === id
      )
    : null;

  openModal(`

    <div class="modal-head">

      <h2>
        ${
          existing
          ? 'Locatie wijzigen'
          : 'Locatie toevoegen'
        }
      </h2>

      <button
        class="close"
        data-action="close-modal"
      >
        ×
      </button>

    </div>

    <form
      id="locationForm"
      onsubmit="return false;"
    >

      <input
        type="hidden"
        name="id"
        value="${
          escapeAttribute(
            existing?.id || ''
          )
        }"
      >

      ${field(
        'Naam',
        'name',
        existing?.name || ''
      )}

      ${field(
        'Adres',
        'address',
        existing?.address || ''
      )}

      <div class="button-row">

        <button
          type="button"
          class="btn secondary"
          data-action="get-gps"
        >
          Gebruik huidige GPS
        </button>

      </div>

      <div class="grid2">

        ${coordinateField(
          'Latitude',
          'latitude',
          existing?.latitude ??
          existing?.lat ??
          gps?.latitude ??
          ''
        )}

        ${coordinateField(
          'Longitude',
          'longitude',
          existing?.longitude ??
          existing?.lng ??
          gps?.longitude ??
          ''
        )}

      </div>

      <div class="form-group">

        <label>
          Type
        </label>

        <select name="type">

          <option
            value="home"
            ${
              existing?.type === 'home'
              ? 'selected'
              : ''
            }
          >
            Thuis
          </option>

          <option
            value="work"
            ${
              existing?.type === 'work'
              ? 'selected'
              : ''
            }
          >
            Werk
          </option>

          <option
            value="business"
            ${
              existing?.type === 'business'
              ? 'selected'
              : ''
            }
          >
            Zakelijk
          </option>

          <option
            value="private"
            ${
              existing?.type === 'private'
              ? 'selected'
              : ''
            }
          >
            Privé
          </option>

          <option
            value="other"
            ${
              !existing ||
              existing?.type === 'other'
              ? 'selected'
              : ''
            }
          >
            Overig
          </option>

        </select>

      </div>

      <div class="hint">
        Vul minimaal een naam, adres of GPS-locatie in.
      </div>

      <div
        id="locationStatus"
        class="hint"
      ></div>

      <button
        type="button"
        class="btn full"
        data-action="save-location"
      >
        Locatie opslaan
      </button>

    </form>
  `);
}


async function openCurrentLocationForm(){

  showToast(
    'GPS-locatie ophalen…'
  );

  try{

    const gps =
      await getCurrentGps();

function saveLocationDirect(){

  const form =
    document.getElementById(
      'locationForm'
    );

  if(!form){

    showError(
      'Locatieformulier niet gevonden.'
    );

    return;
  }

  const status =
    document.getElementById(
      'locationStatus'
    );

  if(status){
    status.textContent =
      'Bezig met opslaan…';
  }

  try{

    const fd =
      new FormData(form);

    const existingId =
      String(
        fd.get('id') || ''
      );

    const existing =
      existingId
      ? data.locations.find(
          item =>
            item.id === existingId
        )
      : null;

    const address =
      String(
        fd.get('address') || ''
      ).trim();

    const enteredName =
      String(
        fd.get('name') || ''
      ).trim();

    const latitude =
      parseDecimal(
        fd.get('latitude')
      );

    const longitude =
      parseDecimal(
        fd.get('longitude')
      );

    if(
      latitude === null &&
      longitude !== null
    ){
      throw new Error(
        'Latitude ontbreekt.'
      );
    }

    if(
      longitude === null &&
      latitude !== null
    ){
      throw new Error(
        'Longitude ontbreekt.'
      );
    }

    if(
      latitude !== null &&
      (
        latitude < -90 ||
        latitude > 90
      )
    ){
      throw new Error(
        'Latitude is ongeldig.'
      );
    }

    if(
      longitude !== null &&
      (
        longitude < -180 ||
        longitude > 180
      )
    ){
      throw new Error(
        'Longitude is ongeldig.'
      );
    }

    if(
      !enteredName &&
      !address &&
      latitude === null
    ){
      throw new Error(
        'Vul minimaal een naam, adres of GPS-locatie in.'
      );
    }

    const name =
      enteredName ||
      address ||
      `Locatie ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

    const location = {
      id:
        existing?.id ||
        uid(),

      name,

      address,

      latitude,

      longitude,

      type:
        String(
          fd.get('type') ||
          'other'
        ),

      useCount:
        existing?.useCount ||
        0,

      createdAt:
        existing?.createdAt ||
        new Date().toISOString(),

      updatedAt:
        new Date().toISOString()
    };

    if(existing){

      const index =
        data.locations.findIndex(
          item =>
            item.id === existing.id
        );

      data.locations[index] =
        location;

    }else{

      data.locations.push(
        location
      );
    }

    saveData();

    /*
      Extra controle:
      lees de data opnieuw rechtstreeks
      uit Safari/localStorage.
    */

    const controlData =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

    const found =
      controlData.locations
        .find(
          item =>
            item.id === location.id
        );

    if(!found){

      throw new Error(
        'De locatie werd niet teruggevonden na het opslaan.'
      );
    }

    if(status){

      status.textContent =
        'Opgeslagen ✓';
    }

    showToast(
      'Locatie opgeslagen: ' +
      name
    );

    setTimeout(
      () => {
        closeModal();
        render();
      },
      350
    );

  }catch(error){

    console.error(
      'Locatie opslaan mislukt',
      error
    );

    if(status){

      status.textContent =
        'Fout: ' +
        error.message;
    }

    showError(
      error.message ||
      'Locatie opslaan is mislukt.'
    );
  }
}

function saveArrival(fd){

  const active =
    data.activeTrip;

  if(!active){

    throw new Error(
      'Actieve rit ontbreekt.'
    );
  }

  const endOdometer =
    numberOrNull(
      fd.get('endOdometer')
    );

  if(
    endOdometer === null ||
    endOdometer <
    active.startOdometer
  ){

    throw new Error(
      'Controleer de eindkilometerstand.'
    );
  }

  const actualKm =
    endOdometer -
    active.startOdometer;

  const choice =
    String(
      fd.get('destinationChoice') ||
      ''
    );

  let destination =
    null;

  if(
    choice.startsWith(
      'known:'
    )
  ){

    destination =
      data.locations.find(
        item =>
          item.id ===
          choice.substring(6)
      );

  }else if(
    choice === 'current'
  ){

    destination =
      JSON.parse(
        String(
          fd.get('currentLocation') ||
          'null'
        )
      );
  }

  if(!destination){

    throw new Error(
      'Kies een bestemming.'
    );
  }

  const category =
    String(
      fd.get('category')
    );

  let privateKm =
    numberOrNull(
      fd.get('privateKm')
    ) || 0;

  if(category === 'private'){

    privateKm =
      actualKm;
  }

  if(
    privateKm < 0 ||
    privateKm > actualKm
  ){

    throw new Error(
      'Privékilometers zijn ongeldig.'
    );
  }

  let businessKm = 0;
  let commuteKm = 0;

  if(category === 'business'){

    businessKm =
      actualKm -
      privateKm;
  }

  if(category === 'commute'){

    commuteKm =
      actualKm -
      privateKm;
  }

  const trip = {
    id:active.id,
    origin:active.origin,
    destination:snapshotLocation(destination),
    departureTime:active.departureTime,
    arrivalTime:
      new Date(
        String(
          fd.get('arrivalTime')
        )
      ).toISOString(),
    startOdometer:active.startOdometer,
    endOdometer,
    actualKm,
    proposedRouteKm:
      active.proposedRouteKm ?? null,
    category,
    reason:
      String(
        fd.get('reason') ||
        ''
      ).trim(),
    privateKm,
    businessKm,
    commuteKm
  };

  data.trips.push(
    trip
  );

  data.lastEndpoint = {
    location:snapshotLocation(destination),
    odometer:endOdometer,
    time:trip.arrivalTime
  };

  data.activeTrip =
    null;

  incrementLocationUse(
    destination.id
  );

  saveData();

  stopGpsTracking();

  closeModal();
  render();

  showToast(
    `Rit opgeslagen: ${formatKm(actualKm)} km`
  );
}

========================= */

function getCurrentGps(){

  return new Promise(
    (resolve,reject) => {

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            'GPS wordt niet ondersteund.'
          )
        );

        return;
      }

      navigator.geolocation
        .getCurrentPosition(

          position => {

            resolve({
              latitude:
                position.coords.latitude,

              longitude:
                position.coords.longitude,

              accuracy:
                position.coords.accuracy
            });
          },

          error => {

            if(error.code === 1){

              reject(
                new Error(
                  'Geen toestemming voor locatie. Controleer Safari > Locatie.'
                )
              );

              return;
            }

            reject(
              new Error(
                'GPS-locatie kon niet worden opgehaald.'
              )
            );
          },

          {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:10000
          }
        );
    }
  );
}


function findNearbyLocations(gps){

  const radius =
    Number(
      data.settings.recognitionRadius
    ) || 500;

  return data.locations

    .filter(
      location =>
        location.latitude !== null &&
        location.latitude !== undefined &&
        location.longitude !== null &&
        location.longitude !== undefined
    )

    .map(
      location => ({
        location,
        distance:
          distanceMeters(
            gps,
            location
          )
      })
    )

    .filter(
      item =>
        item.distance <= radius
    )

    .sort(
      (a,b) =>
        a.distance -
        b.distance
    );
}


function distanceMeters(a,b){

  const latA =
    a.latitude ?? a.lat;

  const lonA =
    a.longitude ?? a.lng;

  const latB =
    b.latitude ?? b.lat;

  const lonB =
    b.longitude ?? b.lng;

  const R =
    6371000;

  const rad =
    value =>
      value *
      Math.PI /
      180;

  const dLat =
    rad(
      latB -
      latA
    );

  const dLon =
    rad(
      lonB -
      lonA
    );

  const la1 =
    rad(latA);

  const la2 =
    rad(latB);

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(la1) *
    Math.cos(la2) *
    Math.sin(dLon / 2) ** 2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(h)
    )
  );
}


function currentGpsLocation(gps){

async function startGpsTracking(){

  if(
    !data.activeTrip ||
    gpsWatch !== null
  ){
    return;
  }

  if(
    !navigator.geolocation
  ){
    return;
  }

  gpsWatch =
    navigator.geolocation
      .watchPosition(

        position => {

          latestGps = {
            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy
          };
        },

        () => {},

        {
          enableHighAccuracy:true,
          maximumAge:10000,
          timeout:20000
        }
      );

  try{

    latestGps =
      await getCurrentGps();

    saveGpsPoint();

  }catch(error){

    console.warn(error);
  }

  gpsTimer =
    setInterval(
      saveGpsPoint,
      60000
    );
}


function stopGpsTracking(){

  if(
    gpsWatch !== null
  ){

    navigator.geolocation
      .clearWatch(
        gpsWatch
      );
  }

  if(gpsTimer){

    clearInterval(
      gpsTimer
    );
  }

  gpsWatch =
    null;

  gpsTimer =
    null;

  latestGps =
    null;
}


function saveGpsPoint(){

  if(
    !data.activeTrip ||
    !latestGps
  ){
    return;
  }

  const minute =
    new Date()
      .toISOString()
      .slice(0,16);

  const id =
    data.activeTrip.id +
    '-' +
    minute;

  if(
    data.trackPoints.some(
      point =>
        point.id === id
    )
  ){
    return;
  }

  data.trackPoints.push({
    id,
    tripId:data.activeTrip.id,
    time:new Date().toISOString(),
    latitude:latestGps.latitude,
    longitude:latestGps.longitude,
    accuracy:latestGps.accuracy
  });

  try{
    saveData();
  }catch(error){
    console.warn(error);
  }
}

function openAppleMaps(
  origin,
  destination
){

  if(
    !origin ||
    !destination
  ){

    showError(
      'Vertrek of bestemming ontbreekt.'
    );

    return;
  }

  const start =
    appleLocationValue(
      origin
    );

  const finish =
    appleLocationValue(
      destination
    );

  if(
    !start ||
    !finish
  ){

    showError(
      'Voor Apple Kaarten is een adres of GPS-locatie nodig.'
    );

    return;
  }

  window.location.href =
    'https://maps.apple.com/?saddr=' +
    encodeURIComponent(start) +
    '&daddr=' +
    encodeURIComponent(finish) +
    '&dirflg=d';
}


function appleLocationValue(
  location
){

  const latitude =
    location?.latitude ??
    location?.lat;

  const longitude =
    location?.longitude ??
    location?.lng;

  if(
    latitude !== null &&
    latitude !== undefined &&
    longitude !== null &&
    longitude !== undefined
  ){

    return (
      latitude +
      ',' +
      longitude
    );
  }

  return (
    location?.address ||
    location?.name ||
    ''
  );
}

    trip => {

function downloadFile(
  blob,
  filename
){

  const link =
    document.createElement('a');

  link.href =
    URL.createObjectURL(blob);

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  setTimeout(
    () => {

      URL.revokeObjectURL(
        link.href
      );

      link.remove();

    },
    1000
  );
}

      <input

    .sort(

    )

    .map(

function snapshotLocation(
  location
){

  if(!location){
    return null;
  }

  return {
    id:
      location.id || null,

    name:
      location.name || '',

    address:
      location.address || '',

    latitude:
      location.latitude ??
      location.lat ??
      null,

    longitude:
      location.longitude ??
      location.lng ??
      null,

    type:
      location.type ||
      'other'
  };
}


function locationLabel(
  location
){

  if(!location){
    return '';
  }

  return (
    location.name ||
    location.address ||
    coordinatesLabel(location) ||
    'Locatie'
  );
}


function coordinatesLabel(
  location
){

  const latitude =
    location?.latitude ??
    location?.lat;

  const longitude =
    location?.longitude ??
    location?.lng;

  if(
    latitude === null ||
    latitude === undefined ||
    longitude === null ||
    longitude === undefined
  ){
    return '';
  }

  return (
    Number(latitude)
      .toFixed(5) +
    ', ' +
    Number(longitude)
      .toFixed(5)
  );
}


function incrementLocationUse(
  id
){

  if(!id){
    return;
  }

  const location =
    data.locations.find(
      item =>
        item.id === id
    );

  if(location){

    location.useCount =
      (location.useCount || 0) +
      1;
  }
}


function findHistoricalDistance(
  origin,
  destination
){

  const matching =
    data.trips
      .filter(
        trip =>
          sameLocation(
            trip.origin,
            origin
          ) &&
          sameLocation(
            trip.destination,
            destination
          )
      )
      .slice(-5);

  if(!matching.length){

    return null;
  }

  return (
    matching.reduce(
      (total,trip) =>
        total +
        Number(
          trip.actualKm ||
          0
        ),
      0
    ) /
    matching.length
  );
}


function sameLocation(
  a,
  b
){

  if(
    a?.id &&
    b?.id
  ){

    return (
      a.id === b.id
    );
  }

  const addressA =
    String(
      a?.address ||
      ''
    )
    .trim()
    .toLowerCase();

  const addressB =
    String(
      b?.address ||
      ''
    )
    .trim()
    .toLowerCase();

  return (
    addressA &&
    addressA === addressB
  );
}


function inferLastEndpoint(){

  if(!data.trips.length){

    if(
      data.settings.initialOdometer !== ''
    ){

      return {
        location:null,
        odometer:
          numberOrNull(
            data.settings.initialOdometer
          )
      };
    }

    return null;
  }

  const latest =
    [...data.trips]
      .sort(
        (a,b) =>
          new Date(b.arrivalTime) -
          new Date(a.arrivalTime)
      )[0];

  return {
    location:
      latest.destination,

    odometer:
      latest.endOdometer,

    time:
      latest.arrivalTime
  };
}


function tripsInRange(
  start,
  end
){

  return [...data.trips]

    .filter(
      trip => {

        const date =
          new Date(
            trip.departureTime
          );

        return (
          date >= start &&
          date < end
        );
      }
    )

    .sort(
      (a,b) =>
        new Date(b.departureTime) -
        new Date(a.departureTime)
    );
}


function calculateTotals(
  trips
){

  return {
    total:
      sum(
        trips,
        'actualKm'
      ),

    business:
      sum(
        trips,
        'businessKm'
      ),

    commute:
      sum(
        trips,
        'commuteKm'
      ),

    private:
      sum(
        trips,
        'privateKm'
      )
  };
}


function sum(
  array,
  fieldName
){

  return array.reduce(
    (total,item) =>
      total +
      Number(
        item[fieldName] ||
        0
      ),
    0
  );
}


function parseDecimal(
  value
){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ){
    return null;
  }

  const parsed =
    Number(
      String(value)
        .trim()
        .replace(',','.')
    );

  return Number.isFinite(parsed)
    ? parsed
    : null;
}


function numberOrNull(
  value
){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ){
    return null;
  }

  const parsed =
    Number(value);

  return Number.isFinite(parsed)
    ? parsed
    : null;
}


function startOfWeek(
  value
){

  const date =
    new Date(value);

  date.setHours(
    0,
    0,
    0,
    0
  );

  const day =
    date.getDay() ||
    7;

  date.setDate(
    date.getDate() -
    day +
    1
  );

  return date;
}


function addDays(
  value,
  days
){

  const date =
    new Date(value);

  date.setDate(
    date.getDate() +
    days
  );

  return date;
}


function isoWeek(
  value
){

  const date =
    new Date(
      Date.UTC(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      )
    );

  const day =
    date.getUTCDay() ||
    7;

  date.setUTCDate(
    date.getUTCDate() +
    4 -
    day
  );

  const firstDay =
    new Date(
      Date.UTC(
        date.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        date -
        firstDay
      ) /
      86400000 +
      1
    ) /
    7
  );
}


function formatDate(
  value
){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  ).format(
    new Date(value)
  );
}


function formatDateTime(
  value
){

  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  ).format(
    new Date(value)
  );
}


function localDateTime(
  value
){

  const date =
    new Date(value);

  const pad =
    number =>
      String(number)
        .padStart(
          2,
          '0'
        );

  return (
    date.getFullYear() +
    '-' +
    pad(date.getMonth()+1) +
    '-' +
    pad(date.getDate()) +
    'T' +
    pad(date.getHours()) +
    ':' +
    pad(date.getMinutes())
  );
}


function formatKm(
  value
){

  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:1
    }
  ).format(
    Number(value || 0)
  );
}


function formatOdo(
  value
){

  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(value || 0)
  );
}


function categoryLabel(
  category
){

  if(category === 'business'){
    return 'Zakelijk';
  }

  if(category === 'commute'){
    return 'Woon-werk';
  }

  if(category === 'private'){
    return 'Privé';
  }

  return 'Overig';
}


function locationTypeLabel(
  type
){

  if(type === 'home'){
    return 'Thuis';
  }

  if(type === 'work'){
    return 'Werk';
  }

  if(type === 'business'){
    return 'Zakelijk';
  }

  if(type === 'private'){
    return 'Privé';
  }

  return 'Overig';
}

function showToast(
  message
){

  toastEl.textContent =
    message;

  toastEl.classList.add(
    'show'
  );

  clearTimeout(
    toastEl._timer
  );

  toastEl._timer =
    setTimeout(
      () =>
        toastEl.classList.remove(
          'show'
        ),
      3500
    );
}


function showError(
  message
){

  showToast(
    'Fout: ' +
    message
  );

  /*
    Een alert is hier bewust toegevoegd.
    Daardoor krijg je óók op iPhone altijd
    feedback als de toast niet zichtbaar is.
  */

  setTimeout(
    () => {
      alert(
        'Fout:\n\n' +
        message
      );
    },
    50
  );
}


function escapeHtml(
  value
){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,
    character => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[character])
  );
}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );
}

})();

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kilometers">
<title>Kilometerregistratie</title>

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --card2:#1d2430;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --line:#2a3442;
  --accent:#4da3ff;
  --good:#49d17d;
  --warn:#ffbd4a;
  --bad:#ff6767;
  --radius:18px
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{
  min-height:100dvh
}

button,
input,
select,
textarea{
  font:inherit
}

.shell{
  max-width:820px;
  margin:auto;
  min-height:100dvh;
  padding:
    env(safe-area-inset-top)
    16px
    calc(94px + env(safe-area-inset-bottom))
}

.top{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--bg);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0 20px
}

.eyebrow,
.kicker{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700
}

.top h1{
  font-size:24px;
  margin:3px 0 0
}

.hero,
.card,
.metric,
.list-item,
.action,
.detail-box,
.notice,
.empty{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius)
}

.hero{
  padding:22px;
  margin-bottom:14px
}

.hero h2{
  font-size:28px;
  margin:8px 0
}

.hero p,
.hint,
.muted,
small{
  color:var(--muted)
}

.btn,
.mini,
.iconbtn{
  border:0;
  cursor:pointer
}

.btn{
  border-radius:14px;
  padding:14px 16px;
  min-height:48px;
  background:var(--accent);
  color:#fff;
  font-weight:750
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--line)
}

.btn.danger{
  background:#4b1f24
}

.btn.full{
  width:100%
}

.mini,
.iconbtn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.button-row .btn{
  flex:1
}

.section{
  margin-top:22px
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:12px;
  margin-bottom:10px
}

.section-title h2,
.card h3{
  margin:0
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.metric{
  padding:16px
}

.metric span{
  display:block;
  color:var(--muted);
  font-size:13px
}

.metric strong{
  display:block;
  font-size:24px;
  margin-top:5px
}

.list{
  display:grid;
  gap:10px
}

.list-item{
  padding:14px;
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center
}

.trip-row{
  cursor:pointer;
  transition:transform .12s ease
}

.trip-row:active{
  transform:scale(.99)
}

.trip-date{
  font-size:12px;
  color:var(--muted);
  min-width:58px
}

.trip-path{
  flex:1;
  min-width:0
}

.trip-path strong,
.trip-path small,
.list-main strong,
.list-main small{
  display:block
}

.trip-path small,
.list-main small{
  margin-top:4px
}

.trip-km{
  font-weight:800;
  white-space:nowrap
}

.trip-chevron{
  font-size:28px;
  color:var(--muted);
  line-height:1
}

.list-main{
  min-width:0;
  flex:1
}

.list-actions{
  display:flex;
  gap:7px
}

.action-grid{
  display:grid;
  gap:12px
}

.action{
  display:flex;
  align-items:center;
  gap:14px;
  padding:18px;
  text-align:left;
  color:var(--text);
  width:100%
}

.action .ico{
  font-size:26px;
  width:36px;
  text-align:center
}

.action strong,
.action small{
  display:block
}

.action small{
  margin-top:3px
}

.card{
  padding:16px;
  margin-bottom:12px
}

.form-group{
  margin:13px 0
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  color:var(--text);
  background:#0f141b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  min-height:46px
}

.form-group textarea{
  min-height:90px;
  resize:vertical
}

.hint{
  font-size:12px;
  margin-top:6px;
  line-height:1.4
}

.notice{
  padding:14px;
  color:var(--muted);
  margin:12px 0
}

.notice.warning{
  border-color:#6b5424;
  color:#ffd98a
}

.empty{
  padding:22px;
  text-align:center;
  color:var(--muted)
}

.route-box,
.detail-box{
  background:#101722;
  padding:14px;
  margin:12px 0
}

.route-box strong,
.route-box small{
  display:block
}

.route-box small{
  margin-top:5px
}

.detail-hero{
  padding:18px;
  background:linear-gradient(180deg,#182230,#121820);
  border:1px solid var(--line);
  border-radius:18px;
  margin:10px 0 14px
}

.detail-date{
  color:var(--muted);
  font-size:13px;
  margin-bottom:9px
}

.detail-route{
  font-size:23px;
  font-weight:800;
  line-height:1.2
}

.detail-route .arrow{
  color:var(--accent);
  padding:0 6px
}

.detail-address{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0
}

.detail-item{
  padding:13px;
  background:#101722;
  border:1px solid var(--line);
  border-radius:14px
}

.detail-item span{
  display:block;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em
}

.detail-item strong{
  display:block;
  margin-top:5px;
  font-size:17px
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 10px;
  border:1px solid var(--line);
  background:var(--card2);
  border-radius:999px;
  font-size:12px;
  font-weight:700
}

.detail-note{
  padding:14px;
  background:#101722;
  border:1px solid var(--line);
  border-radius:14px;
  line-height:1.45
}

.detail-actions{
  display:flex;
  gap:10px;
  margin-top:16px
}

.detail-actions .btn{
  flex:1
}

.divider{
  height:1px;
  background:var(--line);
  margin:16px 0
}

.status{
  display:inline-flex;
  gap:7px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  color:var(--muted)
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--good)
}

.week-nav{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.week-nav .center{
  text-align:center
}

.week-nav h2{
  margin:0
}

.week-nav small{
  display:block;
  margin-top:4px
}

.nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(13,17,23,.95);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:center;
  border-top:1px solid var(--line)
}

.nav-inner{
  width:min(820px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 4px;
  border-radius:12px
}

.nav button span,
.nav button small{
  display:block
}

.nav button span{
  font-size:20px
}

.nav button small{
  font-size:10px
}

.nav button.active{
  background:var(--card2);
  color:var(--text)
}

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.62);
  padding:22px 12px calc(22px + env(safe-area-inset-bottom));
  overflow:auto
}

.modal[hidden]{
  display:none
}

.modal-panel{
  max-width:620px;
  margin:4vh auto 0;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px
}

.modal-head h2{
  margin:0
}

.close{
  border:0;
  background:var(--card2);
  color:var(--text);
  font-size:24px;
  width:40px;
  height:40px;
  border-radius:50%
}

.toast{
  position:fixed;
  z-index:90;
  left:50%;
  bottom:105px;
  transform:translate(-50%,15px);
  background:#f4f7fb;
  color:#111;
  padding:11px 15px;
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:86vw;
  text-align:center;
  font-weight:700
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.print-only{
  display:none
}

@media(max-width:460px){
  .grid2,
  .detail-grid{
    grid-template-columns:1fr
  }

  .hero h2{
    font-size:24px
  }

  .button-row,
  .detail-actions{
    flex-direction:column
  }

  .button-row .btn,
  .detail-actions .btn{
    width:100%
  }
}

@media print{
  body{
    background:#fff;
    color:#000
  }

  .top,
  .nav,
  .no-print,
  .modal,
  .toast{
    display:none!important
  }

  .shell{
    max-width:none;
    padding:0
  }

  .print-only{
    display:block
  }

  .card,
  .list-item,
  .metric{
    background:#fff;
    color:#000;
    border-color:#ccc
  }

  .muted,
  small,
  .hint{
    color:#555
  }
}
</style>
</head>

<body>

<div class="shell">
  <header class="top">
    <div>
      <div id="today" class="eyebrow"></div>
      <h1>Kilometerregistratie</h1>
    </div>

    <button class="iconbtn" data-action="settings">
      ⚙︎
    </button>
  </header>

  <main id="app"></main>
</div>

<nav class="nav">
  <div class="nav-inner">

    <button data-view="ride" class="active">
      <span>↗</span>
      <small>Rit</small>
    </button>

    <button data-view="week">
      <span>◫</span>
      <small>Week</small>
    </button>

    <button data-view="locations">
      <span>⌖</span>
      <small>Locaties</small>
    </button>

    <button data-view="report">
      <span>↥</span>
      <small>Rapport</small>
    </button>

    <button data-view="more">
      <span>•••</span>
      <small>Meer</small>
    </button>

  </div>
</nav>

<div id="modal" class="modal" hidden>
  <div class="modal-panel" id="modalPanel"></div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {

'use strict';

const KEY='kmreg-v4-data';

const DEFAULT={
  settings:{
    name:'',
    vehicleBrand:'',
    vehicleModel:'',
    plate:'',
    initialOdometer:'',
    registrationStart:new Date().toISOString().slice(0,10),
    reportEmail:'',
    recognitionRadius:500
  },
  locations:[],
  trips:[],
  events:[],
  trackPoints:[],
  activeTrip:null,
  lastEndpoint:null
};

let data=load();
let view='ride';
let selectedWeek=startOfWeek(new Date());

let gpsWatch=null;
let gpsTimer=null;
let gpsLatest=null;

const app=document.getElementById('app');
const modal=document.getElementById('modal');
const modalPanel=document.getElementById('modalPanel');
const toastEl=document.getElementById('toast');

document.getElementById('today').textContent=
  new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'long',
      day:'numeric',
      month:'long'
    }
  ).format(new Date())+' · v8';

render();

if(data.activeTrip){
  startTracking();
}


/* =========================
   OPSLAG
========================= */

function load(){

  try{

    const raw=
      localStorage.getItem(KEY);

    if(raw){
      return normalize(
        JSON.parse(raw)
      );
    }

  }catch(e){

    console.error(e);
  }

  return clone(DEFAULT);
}


function normalize(x){

  return {
    settings:{
      ...DEFAULT.settings,
      ...(x.settings||{})
    },

    locations:
      Array.isArray(x.locations)
      ?x.locations
      :[],

    trips:
      Array.isArray(x.trips)
      ?x.trips
      :[],

    events:
      Array.isArray(x.events)
      ?x.events
      :[],

    trackPoints:
      Array.isArray(x.trackPoints)
      ?x.trackPoints
      :[],

    activeTrip:
      x.activeTrip||null,

    lastEndpoint:
      x.lastEndpoint||null
  };
}


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  const check=
    localStorage.getItem(KEY);

  if(!check){
    throw new Error(
      'Lokale opslag is mislukt.'
    );
  }

  JSON.parse(check);

  return true;
}


function clone(v){

  return JSON.parse(
    JSON.stringify(v)
  );
}


function uid(){

  return crypto?.randomUUID
    ?crypto.randomUUID()
    :'id-'+
      Date.now().toString(36)+
      '-'+
      Math.random().toString(36).slice(2);
}


/* =========================
   EVENTS
========================= */

document.addEventListener(
  'click',
  async e=>{

    const vb=
      e.target.closest(
        '[data-view]'
      );

    if(vb){

      view=
        vb.dataset.view;

      render();

      return;
    }


    const el=
      e.target.closest(
        '[data-action]'
      );

    if(!el){
      return;
    }


    const action=
      el.dataset.action;


    try{

      if(action==='settings'){

        view='settings';
        render();
      }


      else if(action==='close'){

        closeModal();
      }


      else if(action==='start'){

        await openStart();
      }


      else if(action==='arrive'){

        await openArrival();
      }


      else if(action==='apple-active'){

        openApple(
          data.activeTrip?.origin,
          data.activeTrip?.expectedDestination
        );
      }


      else if(action==='apple-form'){

        openAppleFromForm();
      }


      else if(action==='trip-detail'){

        openTripDetail(
          el.dataset.id||
          el.closest('[data-id]')?.dataset.id
        );
      }


      else if(action==='edit-trip'){

        openTripEdit(
          el.dataset.id||
          el.closest('[data-id]')?.dataset.id
        );
      }


      else if(action==='back-trip-detail'){

        openTripDetail(
          el.dataset.id
        );
      }


      else if(action==='save-trip-edit'){

        saveTripEditDirect();
      }


      else if(action==='delete-trip'){

        deleteTrip(
          el.dataset.id
        );
      }


      else if(action==='add-location'){

        openLocation();
      }


      else if(action==='current-location'){

        await openLocation(
          null,
          true
        );
      }


      else if(action==='gps-location'){

        await fillGps();
      }


      else if(action==='save-location'){

        saveLocationDirect();
      }


      else if(action==='edit-location'){

        openLocation(
          el.closest('[data-id]')
            .dataset.id
        );
      }


      else if(action==='delete-location'){

        deleteLocation(
          el.closest('[data-id]')
            .dataset.id
        );
      }


      else if(action==='tank'){

        await openTank();
      }


      else if(action==='manual'){

        openManual();
      }


      else if(action==='private'){

        openPrivate();
      }


      else if(action==='week-prev'){

        selectedWeek=
          addDays(
            selectedWeek,
            -7
          );

        render();
      }


      else if(action==='week-next'){

        selectedWeek=
          addDays(
            selectedWeek,
            7
          );

        render();
      }


      else if(action==='week-now'){

        selectedWeek=
          startOfWeek(
            new Date()
          );

        render();
      }


      else if(action==='export'){

        exportJson();
      }


      else if(action==='import'){

        document
          .getElementById(
            'importFile'
          )
          ?.click();
      }


      else if(action==='csv'){

        downloadCsv();
      }


      else if(action==='email'){

        emailReport();
      }


      else if(action==='share'){

        await shareCsv();
      }


      else if(action==='print'){

        window.print();
      }

    }catch(err){

      console.error(err);

      showError(
        err.message||
        'Er ging iets mis.'
      );
    }
  }
);


document.addEventListener(
  'submit',
  async e=>{

    if(
      !(e.target instanceof HTMLFormElement)
    ){
      return;
    }

    e.preventDefault();

    const form=
      e.target;

    const fd=
      new FormData(form);


    try{

      if(form.id==='settingsForm'){

        saveSettings(fd);
      }


      else if(form.id==='startForm'){

        await saveStart(fd);
      }


      else if(form.id==='arrivalForm'){

        saveArrival(fd);
      }


      else if(form.id==='tankForm'){

        saveTank(fd);
      }


      else if(form.id==='manualForm'){

        saveManual(fd);
      }


      else if(form.id==='privateForm'){

        savePrivate(fd);
      }

    }catch(err){

      console.error(err);

      showError(
        err.message||
        'Opslaan mislukt.'
      );
    }
  }
);


document.addEventListener(
  'change',
  async e=>{

    if(
      e.target.id==='importFile'&&
      e.target.files?.[0]
    ){

      await importJson(
        e.target.files[0]
      );
    }
  }
);


/* =========================
   RENDER
========================= */

function render(){

  document
    .querySelectorAll(
      '[data-view]'
    )
    .forEach(
      button=>
        button.classList.toggle(
          'active',
          button.dataset.view===view
        )
    );


  if(view==='ride'){

    renderRide();
  }


  else if(view==='week'){

    renderWeek();
  }


  else if(view==='locations'){

    renderLocations();
  }


  else if(view==='report'){

    renderReport();
  }


  else if(view==='more'){

    renderMore();
  }


  else if(view==='settings'){

    renderSettings();
  }
}


/* =========================
   HOOFDSCHERM
========================= */

function renderRide(){

  const active=
    data.activeTrip;

  const last=
    data.lastEndpoint||
    inferLast();

  const startWeek=
    startOfWeek(
      new Date()
    );

  const week=
    tripsRange(
      startWeek,
      addDays(
        startWeek,
        7
      )
    );


  app.innerHTML=`

    <section class="hero">

      <div class="kicker">
        ${
          active
          ?'Actieve rit'
          :'Huidige stand'
        }
      </div>


      ${
        active

        ?`

          <h2>
            ${esc(labelLoc(active.origin))}
            →
            ${esc(labelLoc(active.expectedDestination))}
          </h2>

          <p>
            Startstand
            ${odo(active.startOdometer)}
            km

            ${
              active.proposedRouteKm!=null

              ?`
                · routevoorstel
                ${km(active.proposedRouteKm)}
                km
              `

              :''
            }
          </p>

          <span class="status">
            <span class="dot"></span>
            Gestart
            ${time(active.departureTime)}
          </span>

          <div
            class="button-row"
            style="margin-top:18px"
          >

            <button
              class="btn secondary"
              data-action="apple-active"
            >
              Open Apple Kaarten
            </button>

            <button
              class="btn"
              data-action="arrive"
            >
              Aankomst registreren
            </button>

          </div>
        `

        :`

          <h2>
            ${
              last
              ?odo(last.odometer)+' km'
              :'Nog geen beginstand'
            }
          </h2>

          <p>
            ${
              last?.location

              ?`
                Laatste bestemming:
                ${esc(labelLoc(last.location))}
              `

              :`
                Vul bij Instellingen
                je auto en beginstand in.
              `
            }
          </p>

          <button
            class="btn full"
            data-action="start"
          >
            Vertrek registreren
          </button>
        `
      }

    </section>


    <div class="grid2">

      ${
        metric(
          'Deze week',

function saveTripEditDirect(){

  const form=
    document.getElementById(
      'tripEditForm'
    );


  if(!form){

    throw new Error(
      'Ritformulier niet gevonden.'
    );
  }


  const status=
    document.getElementById(
      'tripEditStatus'
    );


  if(status){

    status.textContent=
      'Bezig met opslaan…';
  }


  const fd=
    new FormData(form);


  const id=
    String(
      fd.get('id')||
      ''
    );


  const oldTrip=
    data.trips.find(
      item=>
        item.id===id
    );


  if(!oldTrip){

    throw new Error(
      'Rit niet gevonden.'
    );
  }


  const start=
    num(
      fd.get('startOdometer')
    );


  const end=
    num(
      fd.get('endOdometer')
    );


  if(
    start==null||
    end==null||
    end<start
  ){

    throw new Error(
      'Controleer kilometerstanden.'
    );
  }


  const departure=
    new Date(
      String(
        fd.get('departureTime')
      )
    );


  const arrival=
    new Date(
      String(
        fd.get('arrivalTime')
      )
    );


  if(
    Number.isNaN(
      departure.getTime()
    )||
    Number.isNaN(
      arrival.getTime()
    )
  ){

    throw new Error(
      'Controleer vertrek- en aankomsttijd.'
    );
  }


  if(arrival<departure){

    throw new Error(
      'Aankomsttijd kan niet vóór vertrektijd liggen.'
    );
  }


  const originChoice=
    String(
      fd.get('originId')||
      '__current__'
    );


  const destinationChoice=
    String(
      fd.get('destinationId')||
      '__current__'
    );


  const origin=
    originChoice==='__current__'

    ?oldTrip.origin

    :data.locations.find(
      location=>
        location.id===originChoice
    );


  const destination=
    destinationChoice==='__current__'

    ?oldTrip.destination

    :data.locations.find(
      location=>
        location.id===destinationChoice
    );


  if(
    !origin||
    !destination
  ){

    throw new Error(
      'Controleer vertrek en bestemming.'
    );
  }


  const actual=
    end-start;


  const category=
    String(
      fd.get('category')||
      'commute'
    );


  const privateKm=
    category==='private'

    ?actual

    :(
      num(
        fd.get('privateKm')
      )||
      0
    );


  if(
    privateKm<0||
    privateKm>actual
  ){

    throw new Error(
      'Privédeel is ongeldig.'
    );
  }


  const distribution=
    split(
      actual,
      category,
      privateKm
    );


  const updated={

    ...oldTrip,

    origin:
      snap(origin),

    destination:
      snap(destination),

    departureTime:
      departure.toISOString(),

    arrivalTime:
      arrival.toISOString(),

    startOdometer:
      start,

    endOdometer:
      end,

    actualKm:
      actual,

    category,

    reason:
      String(
        fd.get('reason')||
        ''
      ).trim(),

    privateKm:
      distribution.private,

    businessKm:
      distribution.business,

    commuteKm:
      distribution.commute,

    updatedAt:
      new Date().toISOString()
  };


  const index=
    data.trips.findIndex(
      trip=>
        trip.id===id
    );


  data.trips[index]=
    updated;


  rebuildLast();


  save();


  const stored=
    JSON.parse(
      localStorage.getItem(KEY)||
      '{}'
    );


  const verify=
    stored.trips?.find(
      trip=>
        trip.id===id
    );


  if(
    !verify||
    Number(verify.startOdometer)!==start||
    Number(verify.endOdometer)!==end
  ){

    throw new Error(
      'De wijziging kon niet worden gecontroleerd in de opslag.'
    );
  }


  if(status){

    status.textContent=
      'Opgeslagen ✓';
  }


  toast(
    'Rit bijgewerkt.'
  );


  setTimeout(
    ()=>{
      openTripDetail(id);
    },
    250
  );
}

function saveLocationDirect(){

  const form=
    document.getElementById(
      'locationForm'
    );


  if(!form){

    throw new Error(
      'Locatieformulier niet gevonden.'
    );
  }


  const status=
    document.getElementById(
      'locationStatus'
    );


  if(status){

    status.textContent=
      'Bezig met opslaan…';
  }


  const fd=
    new FormData(form);


  const id=
    String(
      fd.get('id')||
      uid()
    );


  const oldLocation=
    data.locations.find(
      item=>
        item.id===id
    );


  const rawName=
    String(
      fd.get('name')||
      ''
    ).trim();


  const address=
    String(
      fd.get('address')||
      ''
    ).trim();


  const lat=
    parseCoord(
      fd.get('lat')
    );


  const lng=
    parseCoord(
      fd.get('lng')
    );


  if(
    (lat==null)!==
    (lng==null)
  ){

    throw new Error(
      'Vul beide GPS-coördinaten in of laat beide leeg.'
    );
  }


  if(
    lat!=null&&
    Math.abs(lat)>90
  ){

    throw new Error(
      'Latitude is ongeldig.'
    );
  }


  if(
    lng!=null&&
    Math.abs(lng)>180
  ){

    throw new Error(
      'Longitude is ongeldig.'
    );
  }


  if(
    !rawName&&
    !address&&
    lat==null
  ){

    throw new Error(
      'Vul minimaal naam, adres of GPS in.'
    );
  }


  const name=
    rawName||
    address||
    `Locatie ${lat.toFixed(5)}, ${lng.toFixed(5)}`;


  const location={

    id,

    name,

    address,

    lat,

    lng,

    type:
      String(
        fd.get('type')||
        'other'
      ),

    useCount:
      oldLocation?.useCount||
      0,

    createdAt:
      oldLocation?.createdAt||
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()
  };


  const index=
    data.locations.findIndex(
      item=>
        item.id===id
    );


  if(index>=0){

    data.locations[index]=
      location;

  }else{

    data.locations.push(
      location
    );
  }


  save();


  const stored=
    JSON.parse(
      localStorage.getItem(KEY)||
      '{}'
    );


  if(
    !stored.locations?.some(
      item=>
        item.id===id
    )
  ){

    throw new Error(
      'Locatie niet teruggevonden in opslag.'
    );
  }


  closeModal();

  render();

  toast(
    'Locatie opgeslagen: '+
    name
  );
}

async function saveStart(fd){

    );

    data.locations.find(

        location.id===

  const manual=
    parseNum(

    );


  const historic=
    historyDistance(
      origin,
      destination
    );


  data.activeTrip={

    id:
      uid(),

    origin:
      snap(origin),

    expectedDestination:
      snap(destination),

    startOdometer:
      start,

    departureTime:

        String(

      ).toISOString(),

    proposedRouteKm:
      manual??
      historic,

    routeSource:
      manual!=null

      ?'Apple Kaarten ingevuld'

      :historic!=null

      ?'historie'

      :null
  };


  incrementUse(
    destination.id

  save();

  closeModal();

  render();

function saveArrival(fd){

  const active=
    data.activeTrip;


  if(!active){

    throw new Error(
      'Actieve rit ontbreekt.'
    );
  }


  const end=
    num(
      fd.get('endOdometer')
    );


  if(
    end==null||
    end<active.startOdometer
  ){

    throw new Error(
      'Controleer de eindkilometerstand.'
    );
  }


  const actual=
    end-
    active.startOdometer;


  const choice=
    String(
      fd.get('destinationChoice')||
      ''
    );


  const current=
    JSON.parse(
      String(
        fd.get('currentJson')||
        'null'
      )
    );


  let destination;


  if(
    choice.startsWith(
      'known:'
    )
  ){

    destination=
      data.locations.find(
        location=>
          location.id===
          choice.slice(6)
      );

  }else{

    destination=
      current;
  }


  if(!destination){

    throw new Error(
      'Kies een bestemming.'
    );
  }


  const category=
    String(
      fd.get('category')
    );


  const privateKm=
    category==='private'

    ?actual

    :(
      num(
        fd.get('privateKm')
      )||
      0
    );


  if(
    privateKm<0||
    privateKm>actual
  ){

    throw new Error(
      'Privékilometers zijn ongeldig.'
    );
  }


  const distribution=
    split(
      actual,
      category,
      privateKm
    );


  const trip={

    id:
      active.id,

    origin:
      active.origin,

    destination:
      snap(destination),

    departureTime:
      active.departureTime,

    arrivalTime:
      new Date(
        String(
          fd.get('arrivalTime')
        )
      ).toISOString(),

    startOdometer:
      active.startOdometer,

    endOdometer:
      end,

    actualKm:
      actual,

    proposedRouteKm:
      active.proposedRouteKm??
      null,

    category,

    reason:
      String(
        fd.get('reason')||
        ''
      ).trim(),

    privateKm:
      distribution.private,

    businessKm:
      distribution.business,

    commuteKm:
      distribution.commute
  };


  data.trips.push(
    trip
  );


  data.lastEndpoint={

    location:
      snap(destination),

    odometer:
      end,

    time:
      trip.arrivalTime
  };


  data.activeTrip=
    null;


  if(destination.id){

    incrementUse(
      destination.id
    );
  }


  save();

  stopTracking();

  closeModal();

  render();

  toast(
    `Rit opgeslagen: ${km(actual)} km.`
  );
}

/* =========================
   GPS
========================= */

function getPosition(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            'GPS wordt niet ondersteund.'
          )
        );

        return;
      }


      navigator.geolocation
        .getCurrentPosition(

          position=>{

            resolve({
              lat:
                position.coords.latitude,

              lng:
                position.coords.longitude,

              accuracy:
                position.coords.accuracy
            });
          },


          error=>{

            reject(
              new Error(

                error.code===1

                ?`
                  Geen locatietoestemming.
                  Controleer Safari > Locatie.
                `

                :error.code===3

                ?`
                  GPS ophalen duurde te lang.
                `

                :`
                  GPS-locatie niet beschikbaar.
                `
              )
            );
          },


          {
            enableHighAccuracy:true,
            timeout:12000,
            maximumAge:15000
          }
        );
    }
  );
}


async function startTracking(){

  if(
    !data.activeTrip||
    !navigator.geolocation||
    gpsWatch!=null
  ){

    return;
  }


  gpsWatch=
    navigator.geolocation
      .watchPosition(

        position=>{

          gpsLatest={

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy
          };
        },


        ()=>{},


        {
          enableHighAccuracy:true,
          maximumAge:15000,
          timeout:20000
        }
      );


  try{

    gpsLatest=
      await getPosition();


    persistTrack();

  }catch(e){

    console.warn(e);
  }


  gpsTimer=
    setInterval(
      persistTrack,
      60000
    );
}


function stopTracking(){

  if(
    gpsWatch!=null
  ){

    navigator.geolocation
      .clearWatch(
        gpsWatch
      );
  }


  if(gpsTimer){

    clearInterval(
      gpsTimer
    );
  }


  gpsWatch=null;

  gpsTimer=null;

  gpsLatest=null;
}


function persistTrack(){

  if(
    !data.activeTrip||
    !gpsLatest
  ){

    return;
  }


  const minute=
    new Date()
      .toISOString()
      .slice(0,16);


  const id=
    data.activeTrip.id+
    '_'+
    minute;


  if(
    data.trackPoints.some(
      point=>
        point.id===id
    )
  ){

    return;
  }


  data.trackPoints.push({

    id,

    tripId:
      data.activeTrip.id,

    time:
      new Date().toISOString(),

    lat:
      gpsLatest.lat,

    lng:
      gpsLatest.lng,

    accuracy:
      gpsLatest.accuracy??
      null
  });


  if(
    data.trackPoints.length>
    20000
  ){

    data.trackPoints=
      data.trackPoints.slice(
        -20000
      );
  }


  try{

    save();

  }catch(e){

    console.warn(e);
  }
}


/* =========================
   LOCATIEHERKENNING
========================= */

function matches(gps){

  const radius=
    Number(
      data.settings.recognitionRadius
    )||
    500;


  return data.locations

    .filter(
      location=>
        location.lat!=null&&
        location.lng!=null
    )

    .map(
      location=>({

        location,

        distance:
          distance(
            gps,
            location
          )
      })
    )

    .filter(
      item=>
        item.distance<=radius
    )

    .sort(
      (a,b)=>
        a.distance-
        b.distance
    );
}


function distance(a,b){

  const R=
    6371000;


  const rad=
    value=>
      value*
      Math.PI/
      180;


  const dLat=
    rad(
      Number(b.lat)-
      Number(a.lat)
    );


  const dLon=
    rad(
      Number(b.lng)-
      Number(a.lng)
    );


  const lat1=
    rad(
      Number(a.lat)
    );


  const lat2=
    rad(
      Number(b.lat)
    );


  const h=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*
    Math.cos(lat2)*
    Math.sin(dLon/2)**2;


  return 2*
    R*
    Math.asin(
      Math.sqrt(h)
    );
}

function historyDistance(
  origin,
  destination
){

  const matching=
    data.trips

      .filter(
        trip=>
          sameLoc(
            trip.origin,
            origin
          )&&
          sameLoc(
            trip.destination,
            destination
          )
      )

      .slice(-5);


  if(!matching.length){

    return null;
  }


  return matching.reduce(
    (total,trip)=>

      total+
      Number(
        trip.actualKm||
        0
      ),

    0

  )/
  matching.length;
}


function sameLoc(a,b){

  if(
    a?.id&&
    b?.id
  ){

    return a.id===b.id;
  }


  if(
    a?.lat!=null&&
    b?.lat!=null
  ){

    return (
      distance(a,b)<150
    );
  }


  return (
    String(a?.address||'')
      .trim()
      .toLowerCase()
    ===
    String(b?.address||'')
      .trim()
      .toLowerCase()
    &&
    !!a?.address
  );
}

  const location=

function sum(
  array,
  fieldName
){

  return array.reduce(
    (total,item)=>

      total+
      Number(
        item[fieldName]||
        0
      ),

    0
  );
}


function inRange(
  value,
  start,
  end
){

  return (
    value>=start&&
    value<end
  );
}


function startOfWeek(value){

  const date=
    new Date(value);


  date.setHours(
    0,
    0,
    0,
    0
  );


  const day=
    date.getDay()||
    7;


  date.setDate(
    date.getDate()-
    day+
    1
  );


  return date;
}


function addDays(
  value,
  days
){

  const date=
    new Date(value);


  date.setDate(
    date.getDate()+
    days
  );


  return date;
}


function isoWeek(value){

  const date=
    new Date(
      Date.UTC(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      )
    );


  const day=
    date.getUTCDay()||
    7;


  date.setUTCDate(
    date.getUTCDate()+
    4-
    day
  );


  const firstDay=
    new Date(
      Date.UTC(
        date.getUTCFullYear(),
        0,
        1
      )
    );


  return Math.ceil(
    (
      (
        (
          date-
          firstDay
        )/
        86400000
      )+
      1
    )/
    7
  );
}

      }
    ),

    `kilometerregistratie-backup-${new Date().toISOString().slice(0,10)}.json`
  );
}


async function importJson(file){

  try{

    const imported=
      JSON.parse(
        await file.text()
      );


    if(
      !confirm(
        'Bestaande gegevens vervangen door deze backup?'
      )
    ){

      return;
    }


    data=
      normalize(imported);


    save();

    render();

    toast(
      'Backup geïmporteerd.'
    );

  }catch(e){

    showError(
      'Backup kon niet worden gelezen.'
    );
  }
}


function reportTrips(){

  const start=
    startOfWeek(
      new Date()
    );


  return tripsRange(
    start,
    addDays(
      start,
      7
    )
  );
}


function csvText(){

  const rows=[[
    'Datum',
    'Vertrek',
    'Bestemming',
    'Start km',
    'Eind km',
    'Totaal km',
    'Type',
    'Reden',
    'Zakelijk km',
    'Woon-werk km',
    'Privé km'
  ]];


  for(
    const trip of reportTrips()
  ){

    rows.push([

      dateTime(
        trip.departureTime
      ),

      labelLoc(
        trip.origin
      ),

      labelLoc(
        trip.destination
      ),

      trip.startOdometer,

      trip.endOdometer,

      trip.actualKm,

      categoryLabel(
        trip.category
      ),

      trip.reason||'',

      trip.businessKm||0,

      trip.commuteKm||0,

      trip.privateKm||0
    ]);
  }


  return rows

    .map(
      row=>

        row.map(
          value=>

            '"'+
            String(value??'')
              .replaceAll(
                '"',
                '""'
              )+
            '"'
        )
        .join(';')
    )

    .join('\n');
}


function downloadCsv(){

  download(

    new Blob(
      [csvText()],
      {
        type:
          'text/csv;charset=utf-8'
      }
    ),

    `kilometerregistratie-week-${isoWeek(new Date())}.csv`
  );
}


async function shareCsv(){

  const file=
    new File(

      [csvText()],

      `kilometerregistratie-week-${isoWeek(new Date())}.csv`,

      {
        type:
          'text/csv'
      }
    );


  if(
    navigator.canShare?.({
      files:[file]
    })
  ){

    await navigator.share({

      files:[file],

      title:
        'Kilometerregistratie'
    });

  }else{

    downloadCsv();
  }
}


function emailReport(){

  const total=
    totals(
      reportTrips()
    );


  const to=
    data.settings.reportEmail||
    '';


  const subject=
    `Kilometerregistratie week ${isoWeek(new Date())}`;


  const body=

`Totaal: ${km(total.total)} km
Zakelijk: ${km(total.business)} km
Woon-werk: ${km(total.commute)} km
Privé: ${km(total.private)} km`;


  location.href=

    `mailto:${encodeURIComponent(to)}`+

    `?subject=${encodeURIComponent(subject)}`+

    `&body=${encodeURIComponent(body)}`;
}


function download(
  blob,
  name
){

  const link=
    document.createElement(
      'a'
    );


  link.href=
    URL.createObjectURL(
      blob
    );


  link.download=
    name;


  document.body.appendChild(
    link
  );


  link.click();


  setTimeout(
    ()=>{

      URL.revokeObjectURL(
        link.href
      );

      link.remove();
    },
    1000
  );
}

})();

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kilometers" />
  <title>Kilometerregistratie</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="todayLabel"></div>
        <h1>Kilometerregistratie</h1>
      </div>
      <button class="icon-btn" data-action="go-settings" aria-label="Instellingen">⚙︎</button>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button data-view="home" class="nav-btn is-active"><span>⌂</span><small>Rit</small></button>
      <button data-view="week" class="nav-btn"><span>◫</span><small>Week</small></button>
      <button data-view="locations" class="nav-btn"><span>⌖</span><small>Locaties</small></button>
      <button data-view="reports" class="nav-btn"><span>↥</span><small>Rapport</small></button>
      <button data-view="settings" class="nav-btn"><span>⚙︎</span><small>Instellingen</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

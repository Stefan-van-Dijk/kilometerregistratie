<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kilometers">
<title>Kilometerregistratie</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1d2430;--text:#f4f7fb;--muted:#9aa7b7;--line:#2a3442;--accent:#4da3ff;--good:#49d17d;--warn:#ffbd4a;--bad:#ff6767;--radius:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
button,input,select,textarea{font:inherit}
.shell{max-width:820px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:16px 0 20px}
.eyebrow,.kicker{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.top h1{font-size:24px;margin:3px 0 0}
.hero,.card,.list-item,.action,.detail-box,.notice,.empty,.km-summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.hero{padding:22px;margin-bottom:14px}
.hero h2{font-size:28px;margin:8px 0}
.hero p,.hint,.muted,small{color:var(--muted)}
.btn,.mini,.iconbtn{border:0;cursor:pointer}
.btn{border-radius:14px;padding:14px 16px;min-height:48px;background:var(--accent);color:#fff;font-weight:750}
.btn.secondary{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:#4b1f24}
.btn.full{width:100%}
.mini,.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}
.button-row{display:flex;gap:10px;flex-wrap:wrap}
.button-row .btn{flex:1}
.section{margin-top:22px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
.section-title h2,.card h3{margin:0}
.list{display:grid;gap:10px}
.list-item{padding:14px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.trip-row{cursor:pointer;transition:transform .12s ease}
.trip-row:active{transform:scale(.99)}
.trip-date{font-size:12px;color:var(--muted);min-width:58px}
.trip-path{flex:1;min-width:0}
.trip-path strong,.trip-path small,.list-main strong,.list-main small{display:block}
.trip-path small,.list-main small{margin-top:4px}
.trip-km{font-weight:800;white-space:nowrap}
.trip-chevron{font-size:28px;color:var(--muted);line-height:1}
.list-main{min-width:0;flex:1}
.list-actions{display:flex;gap:7px}
.action-grid{display:grid;gap:12px}
.action{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;color:var(--text);width:100%}
.action .ico{font-size:26px;width:36px;text-align:center}
.action strong,.action small{display:block}
.action small{margin-top:3px}
.card{padding:16px;margin-bottom:12px}
.form-group{margin:13px 0}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.form-group input,.form-group select,.form-group textarea{width:100%;color:var(--text);background:#0f141b;border:1px solid var(--line);border-radius:12px;padding:13px;min-height:46px}
.form-group textarea{min-height:90px;resize:vertical}
.hint{font-size:12px;margin-top:6px;line-height:1.4}
.notice{padding:14px;color:var(--muted);margin:12px 0}
.notice.warning{border-color:#6b5424;color:#ffd98a}
.empty{padding:22px;text-align:center;color:var(--muted)}
.route-box,.detail-box{background:#101722;padding:14px;margin:12px 0}
.route-box{border:1px solid var(--line);border-radius:14px}
.route-box strong,.route-box small{display:block}
.route-box small{margin-top:5px}

.km-summary{overflow:hidden}
.km-summary-head{padding:17px 18px 15px}
.km-summary-caption{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.km-summary-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px}
.km-summary-main strong{display:block;font-size:31px;line-height:1}
.km-summary-main small{white-space:nowrap}
.km-summary-breakdown{display:flex;border-top:1px solid var(--line)}
.km-part{flex:1;min-width:0;padding:13px 14px 14px}
.km-part+.km-part{border-left:1px solid var(--line)}
.km-part span{display:block;color:var(--muted);font-size:11px}
.km-part strong{display:block;margin-top:4px;font-size:17px}

.detail-hero{padding:18px;background:linear-gradient(180deg,#182230,#121820);border:1px solid var(--line);border-radius:18px;margin:10px 0 14px}
.detail-date{color:var(--muted);font-size:13px;margin-bottom:9px}
.detail-route{font-size:23px;font-weight:800;line-height:1.2}
.detail-route .arrow{color:var(--accent);padding:0 6px}
.detail-address{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.45}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.detail-item{padding:13px;background:#101722;border:1px solid var(--line);border-radius:14px}
.detail-item span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.detail-item strong{display:block;margin-top:5px;font-size:17px}
.pill{display:inline-flex;align-items:center;padding:7px 10px;border:1px solid var(--line);background:var(--card2);border-radius:999px;font-size:12px;font-weight:700}
.detail-note{padding:14px;background:#101722;border:1px solid var(--line);border-radius:14px;line-height:1.45}
.detail-actions{display:flex;gap:10px;margin-top:16px}
.detail-actions .btn{flex:1}
.divider{height:1px;background:var(--line);margin:16px 0}
.status{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);padding:22px 12px calc(22px + env(safe-area-inset-bottom));overflow:auto}
.modal[hidden]{display:none}
.modal-panel{max-width:620px;margin:4vh auto 0;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h2{margin:0}
.close{border:0;background:var(--card2);color:var(--text);font-size:24px;width:40px;height:40px;border-radius:50%}

.toast{position:fixed;z-index:90;left:50%;bottom:32px;transform:translate(-50%,15px);background:#f4f7fb;color:#111;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;max-width:86vw;text-align:center;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}

.week-panel{margin-top:18px}
.week-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.week-panel-center{text-align:center;min-width:0}
.week-panel-center strong{display:block;font-size:18px}
.week-panel-center small{display:block;margin-top:3px}
.current-week-link{margin-top:10px;text-align:center}
.current-week-link button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:8px}

.settings-block{margin-top:18px}
.settings-card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.settings-card-title h3{margin:0}
.settings-card-title small{text-align:right}

.settings-action-list{display:grid;gap:8px;margin-top:12px}
.settings-action{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:13px 14px;background:#101722;border:1px solid var(--line);border-radius:13px;color:var(--text)}
.settings-action-main{min-width:0}
.settings-action strong,.settings-action small{display:block}
.settings-action small{margin-top:3px}
.settings-action-arrow{color:var(--muted);font-size:22px}

.settings-location-list{display:grid;gap:8px;margin-top:12px}
.settings-location{display:flex;align-items:center;gap:10px;padding:12px;background:#101722;border:1px solid var(--line);border-radius:13px}
.settings-location-main{flex:1;min-width:0}
.settings-location-main strong,.settings-location-main small{display:block}
.settings-location-main small{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings-location-actions{display:flex;gap:6px}

.subtle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.subtle-row .btn{flex:1;min-width:130px}

.report-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.report-buttons .btn{width:100%}

.settings-save{position:sticky;bottom:12px;z-index:5;margin-top:18px;padding-top:10px;background:linear-gradient(180deg,rgba(13,17,23,0),var(--bg) 35%)}

.print-only{display:none}

@media(max-width:460px){
  .detail-grid{grid-template-columns:1fr}
  .hero h2{font-size:24px}
  .button-row,.detail-actions{flex-direction:column}
  .button-row .btn,.detail-actions .btn{width:100%}
  .km-summary-breakdown{flex-wrap:wrap}
  .km-part{flex:1 1 33%}
  .report-buttons{grid-template-columns:1fr}
  .settings-location{align-items:flex-start}
}

@media print{
  body{background:#fff;color:#000}
  .shell,.top,.no-print,.modal,.toast{display:none!important}
  .print-only{display:block;padding:0;color:#000}
  .print-only .card,.print-only .list-item,.print-only .km-summary{background:#fff;color:#000;border-color:#ccc}
  .print-only .muted,.print-only small,.print-only .hint{color:#555}
}
</style>
</head>

<body>

<div class="shell">

  <header class="top">

    <div>
      <div id="today" class="eyebrow"></div>
      <h1>Kilometerregistratie</h1>
    </div>

    <button
      id="topAction"
      class="iconbtn"
      data-action="settings"
    >
      ⚙︎
    </button>

  </header>

  <main id="app"></main>

</div>

<div id="modal" class="modal" hidden>
  <div class="modal-panel" id="modalPanel"></div>
</div>

<div id="toast" class="toast"></div>

<div id="printReport" class="print-only"></div>

<script>
(() => {

'use strict';

const KEY='kmreg-v4-data';

const DEFAULT={
  settings:{
    name:'',
    vehicleBrand:'',
    vehicleModel:'',
    plate:'',
    initialOdometer:'',
    registrationStart:new Date().toISOString().slice(0,10),
    reportEmail:'',
    recognitionRadius:500
  },
  locations:[],
  trips:[],
  events:[],
  trackPoints:[],
  activeTrip:null,
  lastEndpoint:null
};

let data=load();
let view='ride';
let selectedWeek=startOfWeek(new Date());

let gpsWatch=null;
let gpsTimer=null;
let gpsLatest=null;

const app=document.getElementById('app');
const modal=document.getElementById('modal');
const modalPanel=document.getElementById('modalPanel');
const toastEl=document.getElementById('toast');
const topAction=document.getElementById('topAction');
const printReportEl=document.getElementById('printReport');

document.getElementById('today').textContent=
  new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'long',
      day:'numeric',
      month:'long'
    }
  ).format(new Date())+
  ' · v11';

render();

if(data.activeTrip){
  startTracking();
}


/* =========================
   OPSLAG
========================= */

function load(){

  try{

    const raw=
      localStorage.getItem(KEY);

    if(raw){

      return normalize(
        JSON.parse(raw)
      );
    }

  }catch(error){

    console.error(error);
  }

  return clone(DEFAULT);
}


function normalize(value){

  return {

    settings:{
      ...DEFAULT.settings,
      ...(value.settings||{})
    },

    locations:
      Array.isArray(value.locations)
      ?value.locations
      :[],

    trips:
      Array.isArray(value.trips)
      ?value.trips
      :[],

    events:
      Array.isArray(value.events)
      ?value.events
      :[],

    trackPoints:
      Array.isArray(value.trackPoints)
      ?value.trackPoints
      :[],

    activeTrip:
      value.activeTrip||
      null,

    lastEndpoint:
      value.lastEndpoint||
      null
  };
}


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  const check=
    localStorage.getItem(KEY);

  if(!check){

    throw new Error(
      'Lokale opslag is mislukt.'
    );
  }

  JSON.parse(check);

  return true;
}


function clone(value){

  return JSON.parse(
    JSON.stringify(value)
  );
}


function uid(){

  if(
    window.crypto&&
    window.crypto.randomUUID
  ){

    return window.crypto.randomUUID();
  }

  return (
    'id-'+
    Date.now().toString(36)+
    '-'+
    Math.random().toString(36).slice(2)
  );
}


/* =========================
   EVENTS
========================= */

document.addEventListener(
  'click',
  async event=>{

    const element=
      event.target.closest(
        '[data-action]'
      );

    if(!element){
      return;
    }

    const action=
      element.dataset.action;

    try{

      if(action==='settings'){

        view='settings';
        render();
      }


      else if(action==='home'){

        view='ride';
        render();
      }


      else if(action==='close'){

        closeModal();
      }


      else if(action==='start'){

        await openStart();
      }


      else if(action==='arrive'){

        await openArrival();
      }


      else if(action==='apple-active'){

        openApple(
          data.activeTrip?.origin,
          data.activeTrip?.expectedDestination
        );
      }


      else if(action==='apple-form'){

        openAppleFromForm();
      }


      else if(action==='trip-detail'){

        openTripDetail(
          element.dataset.id||
          element.closest('[data-id]')?.dataset.id
        );
      }


      else if(action==='edit-trip'){

        openTripEdit(
          element.dataset.id||
          element.closest('[data-id]')?.dataset.id
        );
      }


      else if(action==='back-trip-detail'){

        openTripDetail(
          element.dataset.id
        );
      }


      else if(action==='save-trip-edit'){

        saveTripEditDirect();
      }


      else if(action==='delete-trip'){

        deleteTrip(
          element.dataset.id
        );
      }


      else if(action==='add-location'){

        openLocation();
      }


      else if(action==='current-location'){

        await openLocation(
          null,
          true
        );
      }


      else if(action==='gps-location'){

        await fillGps();
      }


      else if(action==='save-location'){

        saveLocationDirect();
      }


      else if(action==='edit-location'){

        openLocation(
          element
            .closest('[data-id]')
            .dataset.id
        );
      }


      else if(action==='delete-location'){

        deleteLocation(
          element
            .closest('[data-id]')
            .dataset.id
        );
      }


      else if(action==='tank'){

        await openTank();
      }


      else if(action==='manual'){

        openManual();
      }


      else if(action==='private'){

        openPrivate();
      }


      else if(action==='week-prev'){

        selectedWeek=
          addDays(
            selectedWeek,
            -7
          );

        render();
      }


      else if(action==='week-next'){

        selectedWeek=
          addDays(
            selectedWeek,
            7
          );

        render();
      }


      else if(action==='week-now'){

        selectedWeek=
          startOfWeek(
            new Date()
          );

        render();
      }


      else if(action==='export'){

        exportJson();
      }


      else if(action==='import'){

        document
          .getElementById(
            'importFile'
          )
          ?.click();
      }


      else if(action==='csv'){

        downloadCsv();
      }


      else if(action==='email'){

        emailReport();
      }


      else if(action==='share'){

        await shareCsv();
      }


      else if(action==='print'){

        printSelectedWeek();
      }

    }catch(error){

      console.error(error);

      showError(
        error.message||
        'Er ging iets mis.'
      );
    }
  }
);


document.addEventListener(
  'submit',
  async event=>{

    if(
      !(event.target instanceof HTMLFormElement)
    ){

      return;
    }

    event.preventDefault();

    const form=
      event.target;

    const formData=
      new FormData(form);

    try{

      if(form.id==='settingsForm'){

        saveSettings(
          formData
        );
      }


      else if(form.id==='startForm'){

        await saveStart(
          formData
        );
      }


      else if(form.id==='arrivalForm'){

        saveArrival(
          formData
        );
      }


      else if(form.id==='tankForm'){

        saveTank(
          formData
        );
      }


      else if(form.id==='manualForm'){

        saveManual(
          formData
        );
      }


      else if(form.id==='privateForm'){

        savePrivate(
          formData
        );
      }

    }catch(error){

      console.error(error);

      showError(
        error.message||
        'Opslaan mislukt.'
      );
    }
  }
);


document.addEventListener(
  'change',
  async event=>{

    if(
      event.target.id==='importFile'&&
      event.target.files?.[0]
    ){

      await importJson(
        event.target.files[0]
      );
    }
  }
);


/* =========================
   RENDER
========================= */

function render(){

  if(view==='settings'){

    topAction.dataset.action=
      'home';

    topAction.textContent=
      '←';

    topAction.setAttribute(
      'aria-label',
      'Terug naar overzicht'
    );

    renderSettings();

  }else{

    view=
      'ride';

    topAction.dataset.action=
      'settings';

    topAction.textContent=
      '⚙︎';

    topAction.setAttribute(
      'aria-label',
      'Instellingen'
    );

    renderRide();
  }
}


/* =========================
   KM SAMENVATTING
========================= */

function kmSummary(
  total,
  title='Kilometers',
  tripCount=null
){

  const parts=[];


  if(
    Number(
      total.business||
      0
    )>0
  ){

    parts.push([
      'Zakelijk',
      total.business
    ]);
  }


  if(
    Number(
      total.commute||
      0
    )>0
  ){

    parts.push([
      'Woon-werk',
      total.commute
    ]);
  }


  if(
    Number(
      total.private||
      0
    )>0
  ){

    parts.push([
      'Privé',
      total.private
    ]);
  }


  return `

    <div class="km-summary">

      <div class="km-summary-head">

        <div class="km-summary-caption">
          ${esc(title)}
        </div>


        <div class="km-summary-main">

          <strong>
            ${km(total.total)} km
          </strong>


          ${
            tripCount!==null

            ?`

              <small>

                ${tripCount}

                ${
                  tripCount===1
                  ?'rit'
                  :'ritten'
                }

              </small>
            `

            :''
          }

        </div>

      </div>


      ${
        parts.length

        ?`

          <div class="km-summary-breakdown">

            ${
              parts.map(
                ([label,value])=>`

                  <div class="km-part">

                    <span>
                      ${esc(label)}
                    </span>

                    <strong>
                      ${km(value)} km
                    </strong>

                  </div>
                `
              )
              .join('')
            }

          </div>
        `

        :''
      }

    </div>
  `;
}


/* =========================
   HOOFDSCHERM
========================= */

function renderRide(){

  const active=
    data.activeTrip;

  const last=
    data.lastEndpoint||
    inferLast();

  const start=
    selectedWeek;

  const end=
    addDays(
      start,
      7
    );

  const week=
    tripsRange(
      start,
      end
    );

  const total=
    totals(
      week
    );

  const tanks=
    data.events.filter(
      event=>

        event.type==='tank'&&

        inRange(
          new Date(
            event.time
          ),
          start,
          end
        )
    );

  const current=
    isCurrentWeek(
      start
    );


  app.innerHTML=`

    <section class="hero">

      <div class="kicker">

        ${
          active
          ?'Actieve rit'
          :'Huidige stand'
        }

      </div>


      ${
        active

        ?`

          <h2>

            ${esc(labelLoc(active.origin))}

            →

            ${esc(labelLoc(active.expectedDestination))}

          </h2>


          <p>

            Startstand

            ${odo(active.startOdometer)}

            km

            ${
              active.proposedRouteKm!=null

              ?`

                · routevoorstel

                ${km(active.proposedRouteKm)}

                km
              `

              :''
            }

          </p>


          <span class="status">

            <span class="dot"></span>

            Gestart

            ${time(active.departureTime)}

          </span>


          <div
            class="button-row"
            style="margin-top:18px"
          >

            <button
              class="btn secondary"
              data-action="apple-active"
            >
              Open Apple Kaarten
            </button>


            <button
              class="btn"
              data-action="arrive"
            >
              Aankomst registreren
            </button>

          </div>
        `

        :`

          <h2>

            ${
              last

              ?odo(last.odometer)+' km'

              :'Nog geen beginstand'
            }

          </h2>


          <p>

            ${
              last?.location

              ?`

                Laatste bestemming:

                ${esc(
                  labelLoc(
                    last.location
                  )
                )}
              `

              :`

                Vul bij Instellingen

                je auto en beginstand in.
              `
            }

          </p>


          <button
            class="btn full"
            data-action="start"
          >
            Vertrek registreren
          </button>
        `
      }

    </section>

function editLocationOptions(current){

  const id=
    current?.id||
    '';


  const exists=
    id&&
    data.locations.some(
      location=>
        location.id===id
    );


  let html='';


  if(!exists){

    html+=`

      <option
        value="__current__"
        selected
      >

        Huidig:

        ${
          esc(
            labelLoc(current)||
            'Onbekende locatie'
          )
        }

      </option>
    `;
  }


  html+=
    [...data.locations]

      .sort(
        (a,b)=>
          (b.useCount||0)-
          (a.useCount||0)||
          a.name.localeCompare(b.name)
      )

      .map(
        location=>`

          <option
            value="${location.id}"

              location.id===id

            ${
              location.address

              ?`
                ·
                ${esc(location.address)}
              `

              :''
            }

          </option>
        `
      )

      .join('');


  return html;
}

function saveTripEditDirect(){

  const form=
    document.getElementById(
      'tripEditForm'
    );


  if(!form){

    throw new Error(
      'Ritformulier niet gevonden.'
    );
  }


  const status=
    document.getElementById(
      'tripEditStatus'
    );


  if(status){

    status.textContent=
      'Bezig met opslaan…';
  }


  const formData=
    new FormData(form);


  const id=
    String(
      formData.get('id')||
      ''
    );


  const oldTrip=
    data.trips.find(
      item=>
        item.id===id
    );


  if(!oldTrip){

    throw new Error(
      'Rit niet gevonden.'
    );
  }


  const start=
    num(
      formData.get(
        'startOdometer'
      )
    );


  const end=
    num(
      formData.get(
        'endOdometer'
      )
    );


  if(
    start==null||
    end==null||
    end<start
  ){

    throw new Error(
      'Controleer kilometerstanden.'
    );
  }


  const departure=
    new Date(
      String(
        formData.get(
          'departureTime'
        )
      )
    );


  const arrival=
    new Date(
      String(
        formData.get(
          'arrivalTime'
        )
      )
    );


  if(
    Number.isNaN(
      departure.getTime()
    )||
    Number.isNaN(
      arrival.getTime()
    )
  ){

    throw new Error(
      'Controleer vertrek- en aankomsttijd.'
    );
  }


  if(arrival<departure){

    throw new Error(
      'Aankomsttijd kan niet vóór vertrektijd liggen.'
    );
  }


  const originChoice=
    String(
      formData.get(
        'originId'
      )||
      '__current__'
    );


  const destinationChoice=
    String(
      formData.get(
        'destinationId'
      )||
      '__current__'
    );


  const origin=
    originChoice==='__current__'

    ?oldTrip.origin

    :data.locations.find(
      location=>
        location.id===originChoice
    );


  const destination=
    destinationChoice==='__current__'

    ?oldTrip.destination

    :data.locations.find(
      location=>
        location.id===destinationChoice
    );


  if(
    !origin||
    !destination
  ){

    throw new Error(
      'Controleer vertrek en bestemming.'
    );
  }


  const actual=
    end-
    start;


  const category=
    String(
      formData.get(
        'category'
      )||
      'commute'
    );


  const privateKm=
    category==='private'

    ?actual

    :(
      num(
        formData.get(
          'privateKm'
        )
      )||
      0
    );


  if(
    privateKm<0||
    privateKm>actual
  ){

    throw new Error(
      'Privédeel is ongeldig.'
    );
  }


  const distribution=
    split(
      actual,
      category,
      privateKm
    );


  const updated={

    ...oldTrip,

    origin:
      snap(origin),

    destination:
      snap(destination),

    departureTime:
      departure.toISOString(),

    arrivalTime:
      arrival.toISOString(),

    startOdometer:
      start,

    endOdometer:
      end,

    actualKm:
      actual,

    category,

    reason:
      String(
        formData.get(
          'reason'
        )||
        ''
      ).trim(),

    privateKm:
      distribution.private,

    businessKm:
      distribution.business,

    commuteKm:
      distribution.commute,

    updatedAt:
      new Date().toISOString()
  };


  const index=
    data.trips.findIndex(
      trip=>
        trip.id===id
    );


  data.trips[index]=
    updated;


  rebuildLast();

  save();


  const stored=
    JSON.parse(
      localStorage.getItem(KEY)||
      '{}'
    );


  const verify=
    stored.trips?.find(
      trip=>
        trip.id===id
    );


  if(
    !verify||
    Number(
      verify.startOdometer
    )!==start||
    Number(
      verify.endOdometer
    )!==end
  ){

    throw new Error(
      'De wijziging kon niet worden gecontroleerd in de opslag.'
    );
  }


  if(status){

    status.textContent=
      'Opgeslagen ✓';
  }


  toast(
    'Rit bijgewerkt.'
  );


  setTimeout(
    ()=>{

      openTripDetail(id);

    },
    250
  );
}

        trip.arrivalTime
    }

    :null;
}

function saveLocationDirect(){

  const form=
    document.getElementById(
      'locationForm'
    );


  if(!form){

    throw new Error(
      'Locatieformulier niet gevonden.'
    );
  }


  const status=
    document.getElementById(
      'locationStatus'
    );


  if(status){

    status.textContent=
      'Bezig met opslaan…';
  }


  const formData=
    new FormData(form);


  const id=
    String(
      formData.get('id')||
      uid()
    );


  const oldLocation=
    data.locations.find(
      item=>
        item.id===id
    );


  const rawName=
    String(
      formData.get('name')||
      ''
    ).trim();


  const address=
    String(
      formData.get('address')||
      ''
    ).trim();


  const lat=
    parseCoord(
      formData.get('lat')
    );


  const lng=
    parseCoord(
      formData.get('lng')
    );


  if(
    (lat==null)!==
    (lng==null)
  ){

    throw new Error(
      'Vul beide GPS-coördinaten in of laat beide leeg.'
    );
  }


  if(
    lat!=null&&
    Math.abs(lat)>90
  ){

    throw new Error(
      'Latitude is ongeldig.'
    );
  }


  if(
    lng!=null&&
    Math.abs(lng)>180
  ){

    throw new Error(
      'Longitude is ongeldig.'
    );
  }


  if(
    !rawName&&
    !address&&
    lat==null
  ){

    throw new Error(
      'Vul minimaal naam, adres of GPS in.'
    );
  }


  const name=
    rawName||
    address||
    `Locatie ${lat.toFixed(5)}, ${lng.toFixed(5)}`;


  const newLocation={

    id,

    name,

    address,

    lat,

    lng,

    type:
      String(
        formData.get('type')||
        'other'
      ),

    useCount:
      oldLocation?.useCount||
      0,

    createdAt:
      oldLocation?.createdAt||
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()
  };


  const index=
    data.locations.findIndex(
      item=>
        item.id===id
    );


  if(index>=0){

    data.locations[index]=
      newLocation;

  }else{

    data.locations.push(
      newLocation
    );
  }


  save();


  const stored=
    JSON.parse(
      localStorage.getItem(KEY)||
      '{}'
    );


  if(
    !stored.locations?.some(
      item=>
        item.id===id
    )
  ){

    throw new Error(
      'Locatie niet teruggevonden in opslag.'
    );
  }


  closeModal();

  render();

  toast(
    'Locatie opgeslagen: '+
    name
  );
}

function saveArrival(formData){

  const active=
    data.activeTrip;


  if(!active){

    throw new Error(
      'Actieve rit ontbreekt.'
    );
  }


  const end=
    num(
      formData.get(
        'endOdometer'
      )
    );


  if(
    end==null||
    end<active.startOdometer
  ){

    throw new Error(
      'Controleer de eindkilometerstand.'
    );
  }


  const actual=
    end-
    active.startOdometer;


  const choice=
    String(
      formData.get(
        'destinationChoice'
      )||
      ''
    );


  const current=
    JSON.parse(
      String(
        formData.get(
          'currentJson'
        )||
        'null'
      )
    );


  let destination;


  if(
    choice.startsWith(
      'known:'
    )
  ){

    destination=
      data.locations.find(
        location=>
          location.id===
          choice.slice(6)
      );

  }else{

    destination=
      current;
  }


  if(!destination){

    throw new Error(
      'Kies een bestemming.'
    );
  }


  const category=
    String(
      formData.get(
        'category'
      )
    );


  const privateKm=
    category==='private'

    ?actual

    :(
      num(
        formData.get(
          'privateKm'
        )
      )||
      0
    );


  if(
    privateKm<0||
    privateKm>actual
  ){

    throw new Error(
      'Privékilometers zijn ongeldig.'
    );
  }


  const distribution=
    split(
      actual,
      category,
      privateKm
    );


  const trip={

    id:
      active.id,

    origin:
      active.origin,

    destination:
      snap(destination),

    departureTime:
      active.departureTime,

    arrivalTime:
      new Date(
        String(
          formData.get(
            'arrivalTime'
          )
        )
      ).toISOString(),

    startOdometer:
      active.startOdometer,

    endOdometer:
      end,

    actualKm:
      actual,

    proposedRouteKm:
      active.proposedRouteKm??
      null,

    category,

    reason:
      String(
        formData.get(
          'reason'
        )||
        ''
      ).trim(),

    privateKm:
      distribution.private,

    businessKm:
      distribution.business,

    commuteKm:
      distribution.commute
  };


  data.trips.push(
    trip
  );


  data.lastEndpoint={

    location:
      snap(destination),

    odometer:
      end,

    time:
      trip.arrivalTime
  };


  data.activeTrip=
    null;


  if(destination.id){

    incrementUse(
      destination.id
    );
  }


  save();

  stopTracking();

  closeModal();

  render();

  toast(
    `Rit opgeslagen: ${km(actual)} km.`
  );
}

/* =========================
   GPS
========================= */

function getPosition(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            'GPS wordt niet ondersteund.'
          )
        );

        return;
      }


      navigator.geolocation
        .getCurrentPosition(

          position=>{

            resolve({

              lat:
                position.coords.latitude,

              lng:
                position.coords.longitude,

              accuracy:
                position.coords.accuracy
            });
          },


          error=>{

            reject(
              new Error(

                error.code===1

                ?'Geen locatietoestemming. Controleer Safari > Locatie.'

                :error.code===3

                ?'GPS ophalen duurde te lang.'

                :'GPS-locatie niet beschikbaar.'
              )
            );
          },


          {
            enableHighAccuracy:true,
            timeout:12000,
            maximumAge:15000
          }
        );
    }
  );
}


async function startTracking(){

  if(
    !data.activeTrip||
    !navigator.geolocation||
    gpsWatch!=null
  ){

    return;
  }


  gpsWatch=
    navigator.geolocation
      .watchPosition(

        position=>{

          gpsLatest={

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy
          };
        },


        ()=>{},


        {
          enableHighAccuracy:true,
          maximumAge:15000,
          timeout:20000
        }
      );


  try{

    gpsLatest=
      await getPosition();


    persistTrack();

  }catch(error){

    console.warn(error);
  }


  gpsTimer=
    setInterval(
      persistTrack,
      60000
    );
}


function stopTracking(){

  if(
    gpsWatch!=null
  ){

    navigator.geolocation
      .clearWatch(
        gpsWatch
      );
  }


  if(gpsTimer){

    clearInterval(
      gpsTimer
    );
  }


  gpsWatch=null;

  gpsTimer=null;

  gpsLatest=null;
}


function persistTrack(){

  if(
    !data.activeTrip||
    !gpsLatest
  ){

    return;
  }


  const minute=
    new Date()
      .toISOString()
      .slice(0,16);


  const id=
    data.activeTrip.id+
    '_'+
    minute;


  if(
    data.trackPoints.some(
      point=>
        point.id===id
    )
  ){

    return;
  }


  data.trackPoints.push({

    id,

    tripId:
      data.activeTrip.id,

    time:
      new Date().toISOString(),

    lat:
      gpsLatest.lat,

    lng:
      gpsLatest.lng,

    accuracy:
      gpsLatest.accuracy??
      null
  });


  if(
    data.trackPoints.length>
    20000
  ){

    data.trackPoints=
      data.trackPoints.slice(
        -20000
      );
  }


  try{

    save();

  }catch(error){

    console.warn(error);
  }
}

function matches(gps){

  const radius=
    Number(
      data.settings.recognitionRadius
    )||
    500;


  return data.locations

    .filter(
      location=>
        location.lat!=null&&
        location.lng!=null
    )

    .map(
      location=>({

        location,

        distance:
          distance(
            gps,
            location
          )
      })
    )

    .filter(
      item=>
        item.distance<=radius
    )

    .sort(
      (a,b)=>
        a.distance-
        b.distance
    );
}


function distance(a,b){

  const earth=
    6371000;


  const rad=
    value=>
      value*
      Math.PI/
      180;


  const dLat=
    rad(
      Number(b.lat)-
      Number(a.lat)
    );


  const dLon=
    rad(
      Number(b.lng)-
      Number(a.lng)
    );


  const lat1=
    rad(
      Number(a.lat)
    );


  const lat2=
    rad(
      Number(b.lat)
    );


  const h=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*
    Math.cos(lat2)*
    Math.sin(dLon/2)**2;


  return (
    2*
    earth*
    Math.asin(
      Math.sqrt(h)
    )
  );
}

function historyDistance(
  origin,
  destination
){

  const matching=
    data.trips

      .filter(
        trip=>
          sameLoc(
            trip.origin,
            origin
          )&&
          sameLoc(
            trip.destination,
            destination
          )
      )

      .slice(-5);


  if(!matching.length){

    return null;
  }


  return (

    matching.reduce(
      (total,trip)=>

        total+
        Number(
          trip.actualKm||
          0
        ),

      0
    )

    /

    matching.length
  );
}


function sameLoc(a,b){

  if(
    a?.id&&
    b?.id
  ){

    return (
      a.id===b.id
    );
  }


  if(
    a?.lat!=null&&
    b?.lat!=null
  ){

    return (
      distance(a,b)<150
    );
  }


  return (

    String(
      a?.address||
      ''
    )
      .trim()
      .toLowerCase()

    ===

    String(
      b?.address||
      ''
    )
      .trim()
      .toLowerCase()

    &&

    !!a?.address
  );
}


function incrementUse(id){

  if(!id){

    return;
  }


  const location=
    data.locations.find(
      item=>
        item.id===id
    );


  if(location){

    location.useCount=
      (location.useCount||0)+
      1;
  }
}


function inferLast(){

  const trip=
    sortedTripsByArrival()[0];


  if(trip){

    return {

      location:
        trip.destination,

      odometer:
        trip.endOdometer,

      time:
        trip.arrivalTime
    };
  }


  if(
    data.settings.initialOdometer
  ){

    return {

      location:null,

      odometer:
        num(
          data.settings.initialOdometer
        ),

      time:
        data.settings.registrationStart
    };
  }


  return null;
}

    business:

  const number=

        .replace(
          ',',
          '.'
        )
    );


  return Number.isFinite(number)

    ?number

    :null;
}

){

  return array.reduce(

  end
){

function startOfWeek(value){

  const date=
    new Date(value);


  date.setHours(
    0,
    0,
    0,
    0
  );


  const day=
    date.getDay()||
    7;


  date.setDate(
    date.getDate()-
    day+
    1
  );


  return date;
}


function addDays(
  value,
  days
){

  const date=
    new Date(value);


  date.setDate(
    date.getDate()+
    days
  );


  return date;
}


function isoWeek(value){

  const date=
    new Date(
      Date.UTC(
        value.getFullYear(),
        value.getMonth(),
        value.getDate()
      )
    );


  const day=
    date.getUTCDay()||
    7;


  date.setUTCDate(
    date.getUTCDate()+
    4-
    day
  );


  const firstDay=
    new Date(
      Date.UTC(
        date.getUTCFullYear(),
        0,
        1
      )
    );


  return Math.ceil(
    (
      (
        (
          date-
          firstDay
        )/
        86400000
      )+
      1
    )/
    7
  );
}

            )
              .replaceAll(
                '"',
                '""'
              )

            +'"'
        )

        .join(';')
    )

    .join('\n');
}


function downloadCsv(){

  download(

    new Blob(
      [
        csvText()
      ],
      {
        type:
          'text/csv;charset=utf-8'
      }
    ),

    `kilometerregistratie-week-${isoWeek(selectedWeek)}.csv`
  );
}


async function shareCsv(){

  const file=
    new File(

      [
        csvText()
      ],

      `kilometerregistratie-week-${isoWeek(selectedWeek)}.csv`,

      {
        type:
          'text/csv'
      }
    );


  if(
    navigator.canShare?.({
      files:[
        file
      ]
    })
  ){

    await navigator.share({

      files:[
        file
      ],

      title:
        'Kilometerregistratie'
    });

  }else{

    downloadCsv();
  }
}


function emailReport(){

  const total=
    totals(
      reportTrips()
    );


  const emailField=
    document.querySelector(
      '#settingsForm [name="reportEmail"]'
    );


  const to=
    (
      emailField
      ?emailField.value
      :data.settings.reportEmail
    )||
    '';


  const subject=
    `Kilometerregistratie week ${isoWeek(selectedWeek)}`;


  const lines=[
    `Totaal: ${km(total.total)} km`
  ];


  if(total.business>0){

    lines.push(
      `Zakelijk: ${km(total.business)} km`
    );
  }


  if(total.commute>0){

    lines.push(
      `Woon-werk: ${km(total.commute)} km`
    );
  }


  if(total.private>0){

    lines.push(
      `Privé: ${km(total.private)} km`
    );
  }


  window.location.href=

    `mailto:${encodeURIComponent(to)}`+

    `?subject=${encodeURIComponent(subject)}`+

    `&body=${encodeURIComponent(lines.join('\n'))}`;
}


function printSelectedWeek(){

  const trips=
    reportTrips();


  const total=
    totals(
      trips
    );


  printReportEl.innerHTML=`

    <h1>

      Kilometerregistratie

      – week

      ${isoWeek(selectedWeek)}

    </h1>


    <p>

      ${esc(data.settings.name||'')}

      ${
        data.settings.plate

        ?`
          ·
          ${esc(data.settings.plate)}
        `

        :''
      }

    </p>


    <p>

      ${date(selectedWeek)}

      –

      ${date(addDays(selectedWeek,6))}

    </p>


    ${
      kmSummary(
        total,
        'Weekoverzicht',
        trips.length
      )
    }


    <div style="margin-top:20px">

      ${tripList(trips)}

    </div>
  `;


  window.print();


  setTimeout(
    ()=>{

      printReportEl.innerHTML=
        '';

    },
    1000
  );
}


function isCurrentWeek(value){

  return (
    startOfWeek(value).getTime()
    ===
    startOfWeek(new Date()).getTime()
  );
}


function download(
  blob,
  name
){

  const link=
    document.createElement(
      'a'
    );


  link.href=
    URL.createObjectURL(
      blob
    );


  link.download=
    name;


  document.body.appendChild(
    link
  );


  link.click();


  setTimeout(
    ()=>{

      URL.revokeObjectURL(
        link.href
      );

      link.remove();

    },
    1000
  );
}

})();
</script>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">

<title>Kilometerregistratie</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1d2430;--text:#f4f7fb;--muted:#9aa7b7;--line:#2a3442;--accent:#4da3ff;--good:#49d17d;--warn:#ffbd4a;--bad:#ff6767;--r:18px}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,input,select,textarea{font:inherit}.shell{width:100%;max-width:820px;margin:auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 0 20px;background:var(--bg)}.eyebrow,.kicker{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.top h1{margin:3px 0 0;font-size:24px}.hero,.box,.list-item,.summary,.notice,.empty,.accordion{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}.hero{padding:20px;margin-bottom:16px}.hero h2{margin:7px 0;font-size:27px;line-height:1.15}.muted,small,.hint{color:var(--muted)}.btn,.mini,.iconbtn,.action{border:0;cursor:pointer}.btn{min-height:47px;padding:13px 15px;border-radius:13px;background:var(--accent);color:#fff;font-weight:750}.btn.secondary{background:var(--card2);border:1px solid var(--line)}.btn.danger{background:#4b1f24}.btn.full{width:100%}.mini,.iconbtn{padding:9px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--text)}.row{display:flex;gap:9px;flex-wrap:wrap}.row>.btn{flex:1 1 150px}.section{margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:9px}.section-title h2{margin:0;font-size:20px}.week-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-bottom:10px}.week-center{text-align:center}.week-center strong,.week-center small{display:block}.period-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:5px;margin-bottom:10px;border:1px solid var(--line);border-radius:13px;background:#101722}.period-tabs button{min-width:0;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:750;cursor:pointer}.period-tabs button.active{background:var(--card2);color:var(--text)}.ride-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.ride-tool{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#101722;color:var(--text);font-weight:700;text-align:center;cursor:pointer}.route-points{display:grid;gap:7px;margin-top:10px}.route-point{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#101722}.route-point-icon{flex:0 0 26px;font-size:18px;text-align:center}.route-point-main{flex:1}.route-point-main strong,.route-point-main small{display:block}.route-point-main small{margin-top:2px}.route-point-km{white-space:nowrap;font-size:12px;color:var(--muted)}.summary{overflow:hidden}.summary-head{padding:16px}.summary-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.summary-total{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:6px}.summary-total strong{font-size:30px;line-height:1}.summary-parts{display:flex;border-top:1px solid var(--line)}.summary-part{flex:1;padding:12px 13px}.summary-part+.summary-part{border-left:1px solid var(--line)}.summary-part span,.summary-part strong{display:block}.summary-part span{font-size:11px;color:var(--muted)}.summary-part strong{margin-top:3px;font-size:16px}.list{display:grid;gap:9px}.list-item{display:flex;align-items:center;gap:11px;padding:13px}.trip{cursor:pointer}.trip-date{flex:0 0 58px;font-size:12px;color:var(--muted)}.trip-main{flex:1;overflow:hidden}.trip-main strong,.trip-main small{display:block}.trip-main small{margin-top:3px}.trip-km{font-weight:800;white-space:nowrap}.chev{font-size:24px;color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted)}.form-group{margin:13px 0;width:100%;overflow:hidden}.form-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.form-group input,.form-group select,.form-group textarea{display:block;width:100%;max-width:100%;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0f141b;color:var(--text)}.form-group input[type=date],.form-group input[type=datetime-local]{width:100%;min-width:0;max-width:100%}.form-group textarea{min-height:86px;resize:vertical}.hint{font-size:12px;line-height:1.4}.notice{padding:13px;color:var(--muted);margin:12px 0}.notice.warning{border-color:#6b5424;color:#ffd98a}.route{padding:13px;margin:10px 0;border:1px solid var(--line);border-radius:13px;background:#101722}.route strong,.route small{display:block}.route small{margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.accordion{width:100%;margin-bottom:9px;overflow:hidden}.accordion summary{display:flex;align-items:center;gap:10px;padding:15px;list-style:none;cursor:pointer;user-select:none}.accordion summary::-webkit-details-marker{display:none}.accordion-title{flex:1}.accordion-title strong,.accordion-title small{display:block}.accordion-title small{margin-top:3px;white-space:normal;overflow-wrap:anywhere}.accordion-arrow{color:var(--muted);font-size:20px;transition:.18s}.accordion[open] .accordion-arrow{transform:rotate(90deg)}.accordion-body{padding:0 15px 15px;border-top:1px solid var(--line);overflow:hidden}.accordion-body>.form-group:first-child{margin-top:15px}.action-list{display:grid;gap:8px;margin-top:14px}.action{display:flex;align-items:center;gap:10px;width:100%;padding:13px;background:#101722;border:1px solid var(--line);border-radius:12px;color:var(--text);text-align:left}.action-main{flex:1}.action-main strong,.action-main small{display:block}.action-main small{margin-top:3px;white-space:normal;overflow-wrap:anywhere}.location-list{display:grid;gap:8px;margin-top:12px}.location-item{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#101722}.location-main{flex:1;overflow:hidden}.location-main strong,.location-main small{display:block}.location-main small{margin-top:3px;white-space:normal;overflow-wrap:anywhere}.location-actions{display:flex;gap:5px;margin-left:auto}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sticky-save{position:sticky;bottom:10px;padding-top:10px;background:linear-gradient(transparent,var(--bg) 40%)}
.modal{position:fixed;inset:0;z-index:50;overflow:auto;padding:20px 12px calc(20px + env(safe-area-inset-bottom));background:rgba(0,0,0,.65)}.modal[hidden]{display:none}.modal-panel{width:100%;max-width:620px;margin:3vh auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:15px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0;font-size:21px}.close{width:39px;height:39px;border:0;border-radius:50%;background:var(--card2);color:var(--text);font-size:23px}.detail-hero{padding:16px;margin:10px 0 12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#182230,#121820)}.detail-date{font-size:12px;color:var(--muted);margin-bottom:8px}.detail-route{font-size:22px;font-weight:800;line-height:1.2}.detail-route .arrow{color:var(--accent);padding:0 4px}.detail-address{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.4}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.detail-item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#101722}.detail-item span,.detail-item strong{display:block}.detail-item span{font-size:10px;color:var(--muted);text-transform:uppercase}.detail-item strong{margin-top:4px}.pill{display:inline-flex;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card2);font-size:12px;font-weight:700}.detail-note{padding:12px;border:1px solid var(--line);border-radius:12px;background:#101722;line-height:1.4}.divider{height:1px;background:var(--line);margin:15px 0}.toast{position:fixed;z-index:90;left:50%;bottom:26px;max-width:88vw;padding:11px 14px;border-radius:999px;background:#f4f7fb;color:#111;font-weight:700;text-align:center;opacity:0;transform:translate(-50%,12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.print-only{display:none}

.trip-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 16px}.trip-type-option{position:relative}.trip-type-option input{position:absolute;opacity:0;pointer-events:none}.trip-type-option span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:#101722;color:var(--muted);font-size:12px;font-weight:750;text-align:center;cursor:pointer}.trip-type-option.suggested span::after{content:'Voorstel';display:block;margin-top:3px;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}.trip-type-option input:checked+span{border-color:var(--accent);background:rgba(77,163,255,.13);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}.trip-type-hint{margin:-8px 0 14px;text-align:center;font-size:11px;color:var(--muted)}.odo-card{padding:18px 14px 14px;border:1px solid #313b49;border-radius:17px;background:linear-gradient(180deg,#111820,#05080c);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.22);text-align:center}.odo-caption{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8390a0;font-weight:800}.odo-display{display:flex;justify-content:center;gap:3px;margin:11px auto 7px;max-width:100%;overflow:hidden}.odo-digit{display:flex;align-items:center;justify-content:center;width:min(46px,13vw);height:58px;border:1px solid #313947;border-radius:7px;background:linear-gradient(180deg,#242b34,#0a0d11 52%,#1a2027);box-shadow:inset 0 1px 1px rgba(255,255,255,.08),inset 0 -1px 1px rgba(0,0,0,.8);color:#f8fafc;font-family:"SFMono-Regular",Consolas,monospace;font-size:32px;font-weight:750;line-height:1}.odo-digit.swipeable{touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;position:relative}.odo-digit.swipeable::before{content:'⌃';position:absolute;top:1px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:8px;color:#647181}.odo-digit.swipeable::after{content:'⌄';position:absolute;bottom:1px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:8px;color:#647181}.odo-digit.swipe-flash{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 1px 1px rgba(255,255,255,.08)}.odo-unit{font-size:11px;color:#8390a0;font-weight:800;letter-spacing:.08em}.odo-source{margin-top:8px;color:var(--muted);font-size:12px}.estimate-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.estimate-choice{padding:11px 8px;border:1px solid var(--line);border-radius:11px;background:#101722;color:var(--text);text-align:left;cursor:pointer}.estimate-choice strong,.estimate-choice small{display:block}.estimate-choice strong{font-size:15px}.estimate-choice small{margin-top:2px;font-size:10px}.estimate-choice.active{border-color:var(--accent);background:rgba(77,163,255,.12)}.odo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.odo-edit{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#101722}.odo-edit[hidden]{display:none}.arrival-note{margin:10px 0 0;text-align:center;font-size:11px;color:var(--muted)}.odo-swipe-hint{margin:8px 0 0;text-align:center;font-size:10px;color:#7f8b99}
@media(max-width:480px){.odo-digit{height:52px;font-size:28px}.estimate-list{grid-template-columns:1fr}.odo-actions{grid-template-columns:1fr}.shell{padding-left:12px;padding-right:12px}.period-tabs{gap:3px;padding:4px}.period-tabs button{font-size:11px;padding:8px 4px}.ride-tools{grid-template-columns:1fr 1fr}.grid2,.detail-grid{grid-template-columns:1fr}.summary-parts{flex-wrap:wrap}.summary-part{flex:1 1 33%}.row{flex-direction:column}.row>.btn{flex:auto;width:100%}.location-item{align-items:flex-start;flex-wrap:wrap}.location-main{flex:1 1 180px}.grid2.buttons{grid-template-columns:1fr}.accordion-body{padding:0 13px 13px}.accordion summary{padding:14px}}
@media print{body{background:#fff;color:#000}.shell,.modal,.toast{display:none!important}.print-only{display:block;padding:20px}.print-only .summary,.print-only .list-item{background:#fff;color:#000;border-color:#ccc}.print-only small,.print-only .muted{color:#555}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><div id="today" class="eyebrow"></div><h1>Kilometerregistratie</h1></div>
    <button id="topAction" class="iconbtn" data-action="settings" aria-label="Instellingen">⚙︎</button>
  </header>
  <main id="app"></main>
</div>
<div id="modal" class="modal" hidden><div id="modalPanel" class="modal-panel"></div></div>
<div id="toast" class="toast"></div>
<div id="printReport" class="print-only"></div>
<script>
(()=>{
'use strict';
const KEY='kmreg-v4-data';
const DEFAULT={settings:{name:'',vehicleBrand:'',vehicleModel:'',plate:'',initialOdometer:'',registrationStart:new Date().toISOString().slice(0,10),reportEmail:'',recognitionRadius:500},locations:[],trips:[],events:[],trackPoints:[],activeTrip:null,lastEndpoint:null};
let data=load(),view='ride',selectedWeek=startOfWeek(new Date()),periodMode='week',gpsWatch=null,gpsTimer=null,gpsLatest=null,odoSwipe=null;
const app=document.getElementById('app'),modal=document.getElementById('modal'),modalPanel=document.getElementById('modalPanel'),toastEl=document.getElementById('toast'),topAction=document.getElementById('topAction'),printReportEl=document.getElementById('printReport');
document.getElementById('today').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date())+' · v15';
render();if(data.activeTrip)startTracking();

function clone(v){return JSON.parse(JSON.stringify(v))}
function normalize(x){return{settings:{...DEFAULT.settings,...(x.settings||{})},locations:Array.isArray(x.locations)?x.locations:[],trips:Array.isArray(x.trips)?x.trips:[],events:Array.isArray(x.events)?x.events:[],trackPoints:Array.isArray(x.trackPoints)?x.trackPoints:[],activeTrip:x.activeTrip||null,lastEndpoint:x.lastEndpoint||null}}
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalize(JSON.parse(raw)):clone(DEFAULT)}catch(e){console.error(e);return clone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));const raw=localStorage.getItem(KEY);if(!raw)throw new Error('Lokale opslag is mislukt.');JSON.parse(raw)}
function uid(){return window.crypto?.randomUUID?window.crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}

function render(){if(view==='settings'){topAction.dataset.action='home';topAction.textContent='←';topAction.setAttribute('aria-label','Terug');renderSettings()}else{view='ride';topAction.dataset.action='settings';topAction.textContent='⚙︎';topAction.setAttribute('aria-label','Instellingen');renderHome()}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;try{
if(a==='settings'){view='settings';render()}else if(a==='home'){view='ride';render()}else if(a==='close')closeModal();else if(a==='start')await openStart();else if(a==='arrive')await openArrival();else if(a==='apple-active')openApple(data.activeTrip?.origin,data.activeTrip?.expectedDestination);else if(a==='apple-form')openAppleFromForm();else if(a==='trip-detail')openTripDetail(el.dataset.id||el.closest('[data-id]')?.dataset.id);else if(a==='edit-trip')openTripEdit(el.dataset.id);else if(a==='back-detail')openTripDetail(el.dataset.id);else if(a==='save-trip-edit')saveTripEdit();else if(a==='delete-trip')deleteTrip(el.dataset.id);else if(a==='select-odometer')selectOdometerProposal(el);else if(a==='toggle-odometer-edit')toggleOdometerEdit();else if(a==='period-mode'){periodMode=el.dataset.mode||'week';selectedWeek=periodStart(selectedWeek,periodMode);render()}else if(a==='period-prev'){shiftPeriod(-1);render()}else if(a==='period-next'){shiftPeriod(1);render()}else if(a==='period-now'){selectedWeek=periodStart(new Date(),periodMode);render()}else if(a==='add-location')openLocation();else if(a==='current-location')await openLocation(null,true);else if(a==='gps-location')await fillGps();else if(a==='save-location')saveLocation();else if(a==='edit-location')openLocation(el.closest('[data-id]').dataset.id);else if(a==='delete-location')deleteLocation(el.closest('[data-id]').dataset.id);else if(a==='tank')await openTank();else if(a==='detour')await openDetour();else if(a==='manual')openManual();else if(a==='private')openPrivate();else if(a==='export')exportJson();else if(a==='import')document.getElementById('importFile')?.click();else if(a==='csv')downloadCsv();else if(a==='share')await shareCsv();else if(a==='email')emailReport();else if(a==='print')printPeriod();
}catch(err){console.error(err);showError(err.message||'Er ging iets mis.')}});

document.addEventListener('submit',async e=>{if(!(e.target instanceof HTMLFormElement))return;e.preventDefault();const f=e.target,fd=new FormData(f);try{if(f.id==='settingsForm')saveSettings(fd);else if(f.id==='startForm')await saveStart(fd);else if(f.id==='arrivalForm')saveArrival(fd);else if(f.id==='tankForm')saveTank(fd);else if(f.id==='detourForm')saveDetour(fd);else if(f.id==='manualForm')saveManual(fd);else if(f.id==='privateForm')savePrivate(fd)}catch(err){console.error(err);showError(err.message||'Opslaan mislukt.')}});
document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files?.[0])await importJson(e.target.files[0]);if(e.target.id==='startDestination')updateStartCategorySuggestion(e.target.value);if(e.target.name==='category'&&e.target.closest('#startForm'))e.target.closest('#startForm').dataset.categoryTouched='1'});
document.addEventListener('input',e=>{if(e.target.id==='arrivalCustomEnd'){const n=num(e.target.value);if(n!=null){document.querySelectorAll('.estimate-choice').forEach(x=>x.classList.remove('active'));updateOdometerVisual(n,'Handmatig aangepast')}}});
document.addEventListener('pointerdown',e=>{const d=e.target.closest('.odo-digit.swipeable');if(!d)return;odoSwipe={pointerId:e.pointerId,startY:e.clientY,place:+d.dataset.place,el:d};try{d.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointerup',e=>{if(!odoSwipe||odoSwipe.pointerId!==e.pointerId)return;const swipe=odoSwipe;odoSwipe=null;const dy=e.clientY-swipe.startY;if(Math.abs(dy)<16)return;adjustOdometerDigit(swipe.place,dy<0?1:-1,swipe.el)});
document.addEventListener('pointercancel',()=>{odoSwipe=null});

function summary(t,title,count){const p=[];if(+t.business>0)p.push(['Zakelijk',t.business]);if(+t.commute>0)p.push(['Woon-werk',t.commute]);if(+t.private>0)p.push(['Privé',t.private]);return`<div class="summary"><div class="summary-head"><div class="summary-label">${esc(title)}</div><div class="summary-total"><strong>${km(t.total)} km</strong><small>${count} ${count===1?'rit':'ritten'}</small></div></div>${p.length?`<div class="summary-parts">${p.map(x=>`<div class="summary-part"><span>${x[0]}</span><strong>${km(x[1])} km</strong></div>`).join('')}</div>`:''}</div>`}
function renderHome(){const a=data.activeTrip,trips=periodTrips(),t=totals(trips),points=periodEvents(),last=data.lastEndpoint||inferLast(),activePoints=a?data.events.filter(x=>x.tripId===a.id):[];app.innerHTML=`
<section class="hero"><div class="kicker">${a?'Actieve rit':'Huidige stand'}</div>${a?`<h2>${esc(labelLoc(a.origin))} → ${esc(labelLoc(a.expectedDestination))}</h2><p>Startstand ${odo(a.startOdometer)} km${a.proposedRouteKm!=null?' · voorstel '+km(a.proposedRouteKm)+' km':''}</p><span class="status"><span class="dot"></span>${categoryLabel(a.category||'business')} · gestart ${time(a.departureTime)}</span><div class="row" style="margin-top:16px"><button class="btn secondary" data-action="apple-active">Apple Kaarten</button><button class="btn" data-action="arrive">Aankomst</button></div><div class="ride-tools"><button class="ride-tool" data-action="tank">⛽ Tanken</button><button class="ride-tool" data-action="detour">↪ Omrijpunt</button></div>${activePoints.length?`<div class="hint" style="margin-top:8px">${activePoints.length} tussenpunt${activePoints.length===1?'':'en'} aan deze rit gekoppeld.</div>`:''}`:`<h2>${last?odo(last.odometer)+' km':'Nog geen beginstand'}</h2><p>${last?.location?'Laatste bestemming: '+esc(labelLoc(last.location)):'Vul bij Instellingen je auto en beginstand in.'}</p><button class="btn full" data-action="start">Vertrek registreren</button>`}</section>
<section><div class="period-tabs"><button data-action="period-mode" data-mode="week" class="${periodMode==='week'?'active':''}">Week</button><button data-action="period-mode" data-mode="month" class="${periodMode==='month'?'active':''}">Maand</button><button data-action="period-mode" data-mode="year" class="${periodMode==='year'?'active':''}">Jaar</button><button data-action="period-mode" data-mode="all" class="${periodMode==='all'?'active':''}">Alles</button></div><div class="week-head">${periodMode==='all'?'<span></span>':'<button class="mini" data-action="period-prev">‹</button>'}<div class="week-center"><strong>${esc(periodLabel())}</strong><small>${esc(periodSubLabel(trips))}</small></div>${periodMode==='all'?'<span></span>':'<button class="mini" data-action="period-next">›</button>'}</div>${summary(t,periodSummaryTitle(),trips.length)}${periodMode!=='all'&&!isCurrentPeriod()?'<div style="text-align:center;margin-top:8px"><button class="mini" data-action="period-now">Huidige '+periodModeLabel().toLowerCase()+'</button></div>':''}</section>
<div class="section"><div class="section-title"><h2>Ritten</h2><span class="muted">${trips.length}</span></div>${tripList(trips)}</div>
${points.length?`<div class="section"><div class="section-title"><h2>Onderweg geregistreerd</h2><span class="muted">${points.length}</span></div>${routePointList(points)}</div>`:''}`}
function tripList(arr){if(!arr.length)return'<div class="empty">Nog geen ritten.</div>';return`<div class="list">${arr.map(t=>`<div class="list-item trip" data-id="${t.id}" data-action="trip-detail"><div class="trip-date">${shortDate(t.departureTime)}<br>${time(t.departureTime)}</div><div class="trip-main"><strong>${esc(labelLoc(t.origin))} → ${esc(labelLoc(t.destination))}</strong><small>${categoryLabel(t.category)}${t.reason?' · '+esc(t.reason):''}</small><small>${odo(t.startOdometer)} → ${odo(t.endOdometer)} km${t.privateKm?' · '+km(t.privateKm)+' km privé':''}</small></div><div class="trip-km">${km(t.actualKm)} km</div><div class="chev">›</div></div>`).join('')}</div>`}

function openTripDetail(id){const t=data.trips.find(x=>x.id===id);if(!t)throw new Error('Rit niet gevonden.');const gps=data.trackPoints.filter(x=>x.tripId===id).length,points=data.events.filter(x=>x.tripId===id).sort((a,b)=>new Date(a.time)-new Date(b.time));openModal(`<div class="modal-head"><div><div class="kicker">Ritdetails</div><h2>Rit bekijken</h2></div><button class="close" data-action="close">×</button></div><div class="detail-hero"><div class="detail-date">${dateTime(t.departureTime)} → ${time(t.arrivalTime||t.departureTime)}</div><div class="detail-route">${esc(labelLoc(t.origin))}<span class="arrow">→</span>${esc(labelLoc(t.destination))}</div>${t.origin?.address||t.destination?.address?`<div class="detail-address">${t.origin?.address?'Vertrek: '+esc(t.origin.address)+'<br>':''}${t.destination?.address?'Bestemming: '+esc(t.destination.address):''}</div>`:''}</div><div class="row"><span class="pill">${categoryLabel(t.category)}</span>${t.privateKm?`<span class="pill">${km(t.privateKm)} km privé</span>`:''}</div><div class="detail-grid"><div class="detail-item"><span>Gereden</span><strong>${km(t.actualKm)} km</strong></div><div class="detail-item"><span>Kilometerstand</span><strong>${odo(t.startOdometer)} → ${odo(t.endOdometer)}</strong></div><div class="detail-item"><span>Routevoorstel</span><strong>${t.proposedRouteKm!=null?km(t.proposedRouteKm)+' km':'—'}</strong></div><div class="detail-item"><span>GPS-punten</span><strong>${gps}</strong></div></div><div class="detail-note"><div class="kicker" style="margin-bottom:5px">Reden / omschrijving</div>${t.reason?esc(t.reason):'<span class="muted">Geen omschrijving ingevuld.</span>'}</div>${points.length?`<div class="section"><div class="kicker">Onderweg</div>${routePointList(points)}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn secondary" data-action="close">Sluiten</button><button class="btn" data-action="edit-trip" data-id="${id}">Aanpassen</button></div>`)}
function editOptions(cur){const id=cur?.id||'';let s='';if(!id||!data.locations.some(x=>x.id===id))s+=`<option value="__current__" selected>Huidig: ${esc(labelLoc(cur)||'Onbekend')}</option>`;return s+locationOptions(id)}
function openTripEdit(id){const t=data.trips.find(x=>x.id===id);if(!t)throw new Error('Rit niet gevonden.');openModal(`<div class="modal-head"><div><div class="kicker">Wijzigen</div><h2>Rit aanpassen</h2></div><button class="close" data-action="back-detail" data-id="${id}">×</button></div><form id="tripEditForm" onsubmit="return false"><input type="hidden" name="id" value="${id}"><div class="form-group"><label>Vertrek</label><select name="originId">${editOptions(t.origin)}</select></div><div class="form-group"><label>Bestemming</label><select name="destinationId">${editOptions(t.destination)}</select></div>${field('Startstand','startOdometer',t.startOdometer,'number')}${field('Eindstand','endOdometer',t.endOdometer,'number')}${field('Vertrektijd','departureTime',localInput(t.departureTime),'datetime-local')}${field('Aankomsttijd','arrivalTime',localInput(t.arrivalTime||t.departureTime),'datetime-local')}<div class="form-group"><label>Type rit</label><select name="category"><option value="commute" ${t.category==='commute'?'selected':''}>Woon-werk</option><option value="business" ${t.category==='business'?'selected':''}>Zakelijk</option><option value="private" ${t.category==='private'?'selected':''}>Privé</option></select></div>${field('Reden / omschrijving','reason',t.reason||'')}${field('Privédeel km','privateKm',t.privateKm||0,'number')}<div class="notice warning">Bij een historische wijziging worden aangrenzende ritten niet automatisch aangepast.</div><div id="tripEditStatus" class="hint"></div><button class="btn full" type="button" data-action="save-trip-edit">Wijzigingen opslaan</button><div class="divider"></div><button class="btn danger full" type="button" data-action="delete-trip" data-id="${id}">Rit verwijderen</button></form>`)}
function saveTripEdit(){const f=document.getElementById('tripEditForm');if(!f)throw new Error('Ritformulier niet gevonden.');const fd=new FormData(f),id=String(fd.get('id')),old=data.trips.find(x=>x.id===id);if(!old)throw new Error('Rit niet gevonden.');const s=num(fd.get('startOdometer')),e=num(fd.get('endOdometer'));if(s==null||e==null||e<s)throw new Error('Controleer kilometerstanden.');const dep=new Date(String(fd.get('departureTime'))),arr=new Date(String(fd.get('arrivalTime')));if(Number.isNaN(dep.getTime())||Number.isNaN(arr.getTime())||arr<dep)throw new Error('Controleer vertrek- en aankomsttijd.');const oc=String(fd.get('originId')),dc=String(fd.get('destinationId')),o=oc==='__current__'?old.origin:data.locations.find(x=>x.id===oc),d=dc==='__current__'?old.destination:data.locations.find(x=>x.id===dc);if(!o||!d)throw new Error('Controleer vertrek en bestemming.');const actual=e-s,cat=String(fd.get('category')),p=cat==='private'?actual:(num(fd.get('privateKm'))||0);if(p<0||p>actual)throw new Error('Privédeel is ongeldig.');const z=split(actual,cat,p),updated={...old,origin:snap(o),destination:snap(d),departureTime:dep.toISOString(),arrivalTime:arr.toISOString(),startOdometer:s,endOdometer:e,actualKm:actual,category:cat,reason:String(fd.get('reason')||'').trim(),privateKm:z.private,businessKm:z.business,commuteKm:z.commute,updatedAt:new Date().toISOString()};data.trips[data.trips.findIndex(x=>x.id===id)]=updated;rebuildLast();save();const stored=JSON.parse(localStorage.getItem(KEY)||'{}').trips?.find(x=>x.id===id);if(!stored||+stored.startOdometer!==s||+stored.endOdometer!==e)throw new Error('Wijziging niet teruggevonden in opslag.');document.getElementById('tripEditStatus').textContent='Opgeslagen ✓';toast('Rit bijgewerkt.');setTimeout(()=>openTripDetail(id),200)}
function deleteTrip(id){if(!confirm('Deze rit verwijderen?'))return;data.trips=data.trips.filter(x=>x.id!==id);data.events.forEach(x=>{if(x.tripId===id)x.tripId=null});rebuildLast();save();closeModal();render();toast('Rit verwijderd.')}

function settingsLocations(){const arr=[...data.locations].sort((a,b)=>(b.useCount||0)-(a.useCount||0)||a.name.localeCompare(b.name));if(!arr.length)return'<div class="hint">Nog geen locaties opgeslagen.</div>';return`<div class="location-list">${arr.map(l=>`<div class="location-item" data-id="${l.id}"><div class="location-main"><strong>${esc(l.name)}</strong><small>${esc(l.address||coords(l)||'Geen adres/GPS')}</small></div><div class="location-actions"><button type="button" class="mini" data-action="edit-location">Wijzig</button><button type="button" class="mini" data-action="delete-location">×</button></div></div>`).join('')}</div>`}
function renderSettings(){const s=data.settings,trips=reportTrips(),t=totals(trips);app.innerHTML=`<div class="section-title"><div><div class="kicker">Beheer</div><h2>Instellingen</h2></div></div><form id="settingsForm">
<details class="accordion"><summary><span class="accordion-title"><strong>Locaties</strong><small>${data.locations.length} opgeslagen · herkenning ${+s.recognitionRadius||500} m</small></span><span class="accordion-arrow">›</span></summary><div class="accordion-body">${field('Herkenningsstraal (meter)','recognitionRadius',s.recognitionRadius,'number')}<div class="grid2 buttons"><button type="button" class="btn secondary" data-action="current-location">Huidige locatie</button><button type="button" class="btn secondary" data-action="add-location">Locatie toevoegen</button></div>${settingsLocations()}</div></details>
<details class="accordion"><summary><span class="accordion-title"><strong>Bestuurder & auto</strong><small>${esc(s.name||'Persoonlijke en voertuiggegevens')}</small></span><span class="accordion-arrow">›</span></summary><div class="accordion-body">${field('Naam','name',s.name)}${field('Automerk','vehicleBrand',s.vehicleBrand)}${field('Model / type','vehicleModel',s.vehicleModel)}${field('Kenteken','plate',s.plate)}${field('Beginstand km','initialOdometer',s.initialOdometer,'number')}${field('Start registratie','registrationStart',s.registrationStart,'date')}</div></details>
<details class="accordion"><summary><span class="accordion-title"><strong>Extra registraties</strong><small>Tanken, rit achteraf en privékilometers</small></span><span class="accordion-arrow">›</span></summary><div class="accordion-body"><div class="action-list"><button type="button" class="action" data-action="tank"><span class="action-main"><strong>Tanken</strong><small>Kilometerstand en locatie vastleggen</small></span><span class="chev">›</span></button><button type="button" class="action" data-action="manual"><span class="action-main"><strong>Rit toevoegen</strong><small>Een rit achteraf registreren</small></span><span class="chev">›</span></button><button type="button" class="action" data-action="private"><span class="action-main"><strong>Privékilometers aanpassen</strong><small>Privédeel van een bestaande rit wijzigen</small></span><span class="chev">›</span></button></div></div></details>
<details class="accordion"><summary><span class="accordion-title"><strong>Rapportage</strong><small>${esc(periodLabel())} · ${trips.length} ${trips.length===1?'rit':'ritten'}</small></span><span class="accordion-arrow">›</span></summary><div class="accordion-body">${field('E-mailadres','reportEmail',s.reportEmail,'email')}${summary(t,'Te rapporteren periode',trips.length)}<div class="grid2 buttons" style="margin-top:10px"><button type="button" class="btn secondary" data-action="email">E-mail</button><button type="button" class="btn secondary" data-action="share">Deel CSV</button><button type="button" class="btn secondary" data-action="csv">Download CSV</button><button type="button" class="btn secondary" data-action="print">Print / PDF</button></div></div></details>
<details class="accordion"><summary><span class="accordion-title"><strong>Data & back-up</strong><small>JSON importeren of exporteren</small></span><span class="accordion-arrow">›</span></summary><div class="accordion-body"><div class="grid2 buttons" style="margin-top:14px"><button type="button" class="btn secondary" data-action="export">Backup exporteren</button><button type="button" class="btn secondary" data-action="import">Backup importeren</button></div><input id="importFile" type="file" accept="application/json" hidden></div></details>
<div class="sticky-save"><button class="btn full" type="submit">Instellingen opslaan</button></div></form>`}
function saveSettings(fd){data.settings={...data.settings,name:String(fd.get('name')||''),vehicleBrand:String(fd.get('vehicleBrand')||''),vehicleModel:String(fd.get('vehicleModel')||''),plate:String(fd.get('plate')||''),initialOdometer:String(fd.get('initialOdometer')||''),registrationStart:String(fd.get('registrationStart')||''),reportEmail:String(fd.get('reportEmail')||''),recognitionRadius:Math.max(25,num(fd.get('recognitionRadius'))||500)};save();render();toast('Instellingen opgeslagen.')}

function openLocation(id=null,current=false){const l=id?data.locations.find(x=>x.id===id):null,build=g=>openModal(`<div class="modal-head"><h2>${l?'Locatie wijzigen':'Locatie toevoegen'}</h2><button class="close" data-action="close">×</button></div><form id="locationForm" onsubmit="return false"><input type="hidden" name="id" value="${l?.id||''}">${field('Naam','name',l?.name||'')}${field('Adres','address',l?.address||'')}<button type="button" class="btn secondary full" data-action="gps-location">Gebruik huidige GPS</button>${field('Latitude','lat',l?.lat??g?.lat??'','text')}${field('Longitude','lng',l?.lng??g?.lng??'','text')}<div class="form-group"><label>Type</label><select name="type">${['home','work','business','private','other'].map(v=>`<option value="${v}" ${(l?.type||'other')===v?'selected':''}>${typeLabel(v)}</option>`).join('')}</select></div><div class="hint">Vul minimaal naam, adres of GPS in.</div><div id="locationStatus" class="hint"></div><button type="button" class="btn full" data-action="save-location">Locatie opslaan</button></form>`);if(current)getPosition().then(build).catch(e=>{toast(e.message);build(null)});else build(null)}
async function fillGps(){const f=document.getElementById('locationForm');if(!f)return;const g=await getPosition();f.elements.lat.value=g.lat;f.elements.lng.value=g.lng;toast('GPS ingevuld.')}
function saveLocation(){const f=document.getElementById('locationForm');if(!f)throw new Error('Locatieformulier niet gevonden.');const fd=new FormData(f),id=String(fd.get('id')||uid()),old=data.locations.find(x=>x.id===id),rawName=String(fd.get('name')||'').trim(),address=String(fd.get('address')||'').trim(),lat=parseNum(fd.get('lat')),lng=parseNum(fd.get('lng'));if((lat==null)!=(lng==null))throw new Error('Vul beide GPS-coördinaten in of laat beide leeg.');if(lat!=null&&Math.abs(lat)>90)throw new Error('Latitude is ongeldig.');if(lng!=null&&Math.abs(lng)>180)throw new Error('Longitude is ongeldig.');if(!rawName&&!address&&lat==null)throw new Error('Vul minimaal naam, adres of GPS in.');const name=rawName||address||`Locatie ${lat.toFixed(5)}, ${lng.toFixed(5)}`,loc={id,name,address,lat,lng,type:String(fd.get('type')||'other'),useCount:old?.useCount||0,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()},i=data.locations.findIndex(x=>x.id===id);if(i>=0)data.locations[i]=loc;else data.locations.push(loc);save();if(!JSON.parse(localStorage.getItem(KEY)||'{}').locations?.some(x=>x.id===id))throw new Error('Locatie niet teruggevonden in opslag.');closeModal();render();toast('Locatie opgeslagen: '+name)}
function deleteLocation(id){if(!confirm('Locatie verwijderen? Bestaande ritten blijven intact.'))return;data.locations=data.locations.filter(x=>x.id!==id);save();render();toast('Locatie verwijderd.')}

async function openStart(){
  if(data.activeTrip)throw new Error('Er is al een actieve rit.');
  if(!data.locations.length){view='settings';render();throw new Error('Voeg eerst een locatie toe.');}
  let origin=data.lastEndpoint?.location||inferLast()?.location||null;
  const start=data.lastEndpoint?.odometer??inferLast()?.odometer??num(data.settings.initialOdometer);
  if(start==null){view='settings';render();throw new Error('Vul eerst de huidige kilometerstand in bij Bestuurder & auto.');}
  if(!origin){
    try{const g=await getPosition();origin=matches(g)[0]?.location||currentLoc(g)}catch(e){}
  }
  if(!origin)throw new Error('Geen vertrekpunt bekend. Geef locatietoegang of leg eerst een locatie vast.');
  const suggestion=suggestTripCategory(origin,null);
  openModal(`<div class="modal-head"><div><div class="kicker">Vertrek</div><h2>Waar ga je naartoe?</h2></div><button class="close" data-action="close">×</button></div><form id="startForm"><input type="hidden" name="origin" value='${attr(JSON.stringify(origin))}'><div class="route"><small>Vertrek automatisch vanaf</small><strong>${esc(labelLoc(origin))}</strong><small>${odo(start)} km</small></div><div class="form-group"><label>Eindbestemming</label><select name="destinationId" id="startDestination" required><option value="">Kies locatie…</option>${locationNameOptions()}</select></div><div class="form-group"><label>Type rit</label><div class="trip-type-grid">${startCategoryOption('commute','Woon-werk',suggestion.value)}${startCategoryOption('business','Zakelijk',suggestion.value)}${startCategoryOption('private','Privé',suggestion.value)}</div><div class="trip-type-hint" id="tripTypeSuggestionText">Voorstel: ${esc(categoryLabel(suggestion.value))} · ${esc(suggestion.reason)}</div></div><button class="btn full" type="submit">Rit starten</button></form>`);
}
function openAppleFromForm(){const f=document.getElementById('startForm');if(!f)return;const d=data.locations.find(x=>x.id===f.elements.destinationId.value);if(!d)throw new Error('Kies eerst een bestemming.');openApple(JSON.parse(f.elements.origin.value),d)}
async function saveStart(fd){
  const o=JSON.parse(String(fd.get('origin'))),d=data.locations.find(x=>x.id===fd.get('destinationId'));
  const start=data.lastEndpoint?.odometer??inferLast()?.odometer??num(data.settings.initialOdometer);
  const category=String(fd.get('category')||'');
  if(!category)throw new Error('Kies het type rit.');
  if(!d)throw new Error('Kies een eindbestemming.');
  if(start==null)throw new Error('De huidige kilometerstand ontbreekt.');
  const hist=historyDistance(o,d);
  data.activeTrip={id:uid(),origin:snap(o),expectedDestination:snap(d),startOdometer:start,departureTime:new Date().toISOString(),category,proposedRouteKm:hist,routeSource:hist!=null?'historie':null};
  incrementUse(d.id);save();closeModal();render();await startTracking();toast('Rit gestart.');
}

async function openArrival(){
  const a=data.activeTrip;
  if(!a)throw new Error('Er is geen actieve rit.');
  let gps=null;
  try{gps=await getPosition()}catch(e){}
  const proposals=endOdometerProposals(a,gps);
  const first=proposals[0]||null;
  const initial=first?.value??a.startOdometer;
  openModal(`<div class="modal-head"><div><div class="kicker">Aankomst</div><h2>Controleer de kilometerstand</h2></div><button class="close" data-action="close">×</button></div><form id="arrivalForm"><input type="hidden" name="endOdometer" id="arrivalEndOdometer" value="${attr(initial)}"><div class="route"><strong>${esc(labelLoc(a.origin))} → ${esc(labelLoc(a.expectedDestination))}</strong><small>${categoryLabel(a.category||'business')} · start ${odo(a.startOdometer)} km</small></div><div class="odo-card"><div class="odo-caption">Geschatte eindstand</div><div class="odo-display" id="odoDigits">${odometerDigits(initial)}</div><div class="odo-unit">KM</div><div class="odo-source" id="odoSource">${esc(first?.label||'Nog geen betrouwbare schatting')}</div><div class="odo-swipe-hint">Swipe een cijfer omhoog of omlaag voor een snelle correctie</div></div>${proposals.length?`<div class="estimate-list" id="estimateList">${proposals.map((p,i)=>`<button type="button" class="estimate-choice ${i===0?'active':''}" data-action="select-odometer" data-value="${p.value}" data-label="${attr(p.label)}"><strong>${odo(p.value)} km</strong><small>${esc(p.label)}</small></button>`).join('')}</div>`:`<div class="notice">Er is nog geen betrouwbare schatting op basis van GPS of eerdere ritten. Pas de stand hieronder aan.</div>`}<div class="odo-actions"><button type="submit" class="btn">${proposals.length?'Deze stand goedkeuren':'Stand opslaan'}</button><button type="button" class="btn secondary" data-action="toggle-odometer-edit">Aanpassen</button></div><div class="odo-edit" id="odometerEdit" ${proposals.length?'hidden':''}><div class="form-group" style="margin:0"><label>Werkelijke eindstand</label><input id="arrivalCustomEnd" type="number" inputmode="numeric" value="${attr(initial)}"></div><div class="hint">Vul de kilometerstand van het dashboard in. De grote weergave hierboven verandert direct mee.</div></div><div class="arrival-note">Bestemming en aankomsttijd worden automatisch vastgelegd.</div></form>`);
}
function saveArrival(fd){
  const a=data.activeTrip;if(!a)throw new Error('Actieve rit ontbreekt.');
  const end=num(fd.get('endOdometer'));if(end==null||end<a.startOdometer)throw new Error('Controleer de eindkilometerstand.');
  const actual=end-a.startOdometer,d=a.expectedDestination,cat=a.category||'business',z=split(actual,cat,cat==='private'?actual:0);
  const trip={id:a.id,origin:a.origin,destination:snap(d),departureTime:a.departureTime,arrivalTime:new Date().toISOString(),startOdometer:a.startOdometer,endOdometer:end,actualKm:actual,proposedRouteKm:a.proposedRouteKm??null,category:cat,reason:'',privateKm:z.private,businessKm:z.business,commuteKm:z.commute};
  data.trips.push(trip);data.lastEndpoint={location:snap(d),odometer:end,time:trip.arrivalTime};data.activeTrip=null;if(d?.id)incrementUse(d.id);save();stopTracking();closeModal();render();toast(`Rit opgeslagen: ${km(actual)} km.`);
}

async function openTank(){let loc=null;try{const g=await getPosition();loc=matches(g)[0]?.location||currentLoc(g)}catch(e){}const active=data.activeTrip,last=active?{odometer:active.startOdometer}:data.lastEndpoint||inferLast();openModal(`<div class="modal-head"><h2>${active?'Tanken tijdens rit':'Tanken'}</h2><button class="close" data-action="close">×</button></div><form id="tankForm"><input type="hidden" name="loc" value='${attr(JSON.stringify(loc))}'>${field('Kilometerstand','odometer',last?.odometer??'','number')}<div class="route"><strong>${esc(labelLoc(loc)||'GPS-locatie niet beschikbaar')}</strong><small>${active?'Dit tankpunt wordt aan de actieve rit gekoppeld.':'Dit onderbreekt een A→B-rit niet.'}</small></div>${field('Notitie (optioneel)','note','')}${field('Tijd','time',localInput(new Date()),'datetime-local')}<button class="btn full">Tankpunt opslaan</button></form>`)}
function saveTank(fd){const o=num(fd.get('odometer'));if(o==null)throw new Error('Vul de kilometerstand in.');const tripId=data.activeTrip?.id||null;data.events.push({id:uid(),type:'tank',tripId,odometer:o,location:snap(JSON.parse(String(fd.get('loc')||'null'))),note:String(fd.get('note')||'').trim(),time:new Date(String(fd.get('time'))).toISOString()});save();closeModal();render();toast(tripId?'Tankpunt aan rit gekoppeld.':'Tankmoment opgeslagen.')}

function saveManual(fd){const o=data.locations.find(x=>x.id===fd.get('originId')),d=data.locations.find(x=>x.id===fd.get('destinationId')),s=num(fd.get('startOdometer')),e=num(fd.get('endOdometer'));if(!o||!d)throw new Error('Kies vertrek en bestemming.');if(s==null||e==null||e<s)throw new Error('Controleer kilometerstanden.');const actual=e-s,cat=String(fd.get('category')),p=cat==='private'?actual:(num(fd.get('privateKm'))||0);if(p<0||p>actual)throw new Error('Privédeel is ongeldig.');const z=split(actual,cat,p);data.trips.push({id:uid(),origin:snap(o),destination:snap(d),startOdometer:s,endOdometer:e,actualKm:actual,departureTime:new Date(String(fd.get('departureTime'))).toISOString(),arrivalTime:new Date(String(fd.get('arrivalTime'))).toISOString(),category:cat,reason:String(fd.get('reason')||'').trim(),privateKm:z.private,businessKm:z.business,commuteKm:z.commute,proposedRouteKm:null});rebuildLast();save();closeModal();render();toast('Rit opgeslagen.')}

function endOdometerProposals(active,arrivalGps){
  const routeTrips=data.trips.filter(t=>sameLoc(t.origin,active.origin)&&sameLoc(t.destination,active.expectedDestination)&&+t.actualKm>=0).sort((a,b)=>new Date(b.arrivalTime||b.departureTime)-new Date(a.arrivalTime||a.departureTime));
  const reverseTrips=data.trips.filter(t=>sameLoc(t.origin,active.expectedDestination)&&sameLoc(t.destination,active.origin)&&+t.actualKm>=0).sort((a,b)=>new Date(b.arrivalTime||b.departureTime)-new Date(a.arrivalTime||a.departureTime));
  const out=[],start=+active.startOdometer;
  const add=(distanceKm,label)=>{if(!Number.isFinite(+distanceKm)||+distanceKm<0)return;const value=Math.round(start+(+distanceKm));if(value<start||out.some(x=>x.value===value))return;out.push({value,label,distance:+distanceKm})};
  if(routeTrips.length){const vals=routeTrips.slice(0,7).map(t=>+t.actualKm).sort((a,b)=>a-b);const mid=Math.floor(vals.length/2),median=vals.length%2?vals[mid]:(vals[mid-1]+vals[mid])/2;add(median,'Meest waarschijnlijk · mediaan van eerdere ritten');add(+routeTrips[0].actualKm,'Laatste keer op deze route');}
  const gpsKm=trackedDistanceKm(active.id,active.origin,arrivalGps);if(gpsKm!=null&&gpsKm>=0.3)add(gpsKm,'GPS · gemeten tijdens deze rit');
  if(!routeTrips.length&&reverseTrips.length){const vals=reverseTrips.slice(0,7).map(t=>+t.actualKm);add(vals.reduce((a,b)=>a+b,0)/vals.length,'Historie · omgekeerde route');}
  if(active.proposedRouteKm!=null)add(+active.proposedRouteKm,'Historisch gemiddelde');
  return out.slice(0,4);
}
function trackedDistanceKm(tripId,origin,arrivalGps){
  const pts=data.trackPoints.filter(x=>x.tripId===tripId&&x.lat!=null&&x.lng!=null).sort((a,b)=>new Date(a.time)-new Date(b.time));
  const seq=[];if(origin?.lat!=null&&origin?.lng!=null)seq.push({lat:+origin.lat,lng:+origin.lng,time:data.activeTrip?.departureTime||null});for(const p of pts)seq.push({lat:+p.lat,lng:+p.lng,time:p.time});if(arrivalGps?.lat!=null&&arrivalGps?.lng!=null)seq.push({lat:+arrivalGps.lat,lng:+arrivalGps.lng,time:new Date().toISOString()});if(seq.length<2)return null;
  let meters=0;for(let i=1;i<seq.length;i++){const d=distance(seq[i-1],seq[i]);if(!Number.isFinite(d))continue;if(d<12)continue;const t1=seq[i-1].time?new Date(seq[i-1].time).getTime():null,t2=seq[i].time?new Date(seq[i].time).getTime():null,mins=t1&&t2?Math.max(.1,(t2-t1)/60000):null;if(mins&&d>30000&&mins<5)continue;meters+=d;}return meters>0?meters/1000:null;
}
function odometerDigits(value){const str=String(Math.max(0,Math.round(+value||0))).padStart(6,'0');return str.split('').map((d,i)=>`<span class="odo-digit swipeable" data-place="${str.length-1-i}" aria-label="Cijfer ${d}, swipe omhoog of omlaag">${d}</span>`).join('')}

function adjustOdometerDigit(place,direction,oldEl=null){const end=document.getElementById('arrivalEndOdometer');if(!end)return;const current=num(end.value);if(current==null)return;const step=Math.pow(10,Math.max(0,+place||0)),minimum=+data.activeTrip?.startOdometer||0,next=Math.max(minimum,Math.round(current+step*direction));document.querySelectorAll('.estimate-choice').forEach(x=>x.classList.remove('active'));updateOdometerVisual(next,'Snel gecorrigeerd · '+(direction>0?'omhoog':'omlaag')+' geswipet');const fresh=[...document.querySelectorAll('.odo-digit.swipeable')].find(x=>+x.dataset.place===+place);if(fresh){fresh.classList.add('swipe-flash');setTimeout(()=>fresh.classList.remove('swipe-flash'),180)}const edit=document.getElementById('odometerEdit');if(edit)edit.hidden=true}

function getPosition(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('GPS wordt niet ondersteund.'));navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),e=>rej(new Error(e.code===1?'Geen locatietoestemming. Controleer Safari > Locatie.':e.code===3?'GPS ophalen duurde te lang.':'GPS-locatie niet beschikbaar.')),{enableHighAccuracy:true,timeout:12000,maximumAge:15000})})}
async function startTracking(){if(!data.activeTrip||!navigator.geolocation||gpsWatch!=null)return;gpsWatch=navigator.geolocation.watchPosition(p=>gpsLatest={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy},()=>{},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});try{gpsLatest=await getPosition();persistTrack()}catch(e){}gpsTimer=setInterval(persistTrack,60000)}
function stopTracking(){if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer);gpsWatch=gpsTimer=gpsLatest=null}
function persistTrack(){if(!data.activeTrip||!gpsLatest)return;const minute=new Date().toISOString().slice(0,16),id=data.activeTrip.id+'_'+minute;if(data.trackPoints.some(x=>x.id===id))return;data.trackPoints.push({id,tripId:data.activeTrip.id,time:new Date().toISOString(),lat:gpsLatest.lat,lng:gpsLatest.lng,accuracy:gpsLatest.accuracy??null});if(data.trackPoints.length>20000)data.trackPoints=data.trackPoints.slice(-20000);try{save()}catch(e){}}
function matches(g){const r=+data.settings.recognitionRadius||500;return data.locations.filter(x=>x.lat!=null&&x.lng!=null).map(location=>({location,distance:distance(g,location)})).filter(x=>x.distance<=r).sort((a,b)=>a.distance-b.distance)}
function distance(a,b){const R=6371000,rad=x=>x*Math.PI/180,dLat=rad(+b.lat-+a.lat),dLon=rad(+b.lng-+a.lng),la1=rad(+a.lat),la2=rad(+b.lat),h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function currentLoc(g){return{id:null,name:'Huidige locatie',address:'',lat:g.lat,lng:g.lng,type:'other'}}
function openApple(o,d){const q=x=>x?.lat!=null&&x?.lng!=null?`${x.lat},${x.lng}`:x?.address||x?.name||'',s=q(o),e=q(d);if(!s||!e)throw new Error('Voor Apple Kaarten is een adres of GPS nodig.');location.href=`https://maps.apple.com/?saddr=${encodeURIComponent(s)}&daddr=${encodeURIComponent(e)}&dirflg=d`}
function historyDistance(o,d){const a=data.trips.filter(t=>sameLoc(t.origin,o)&&sameLoc(t.destination,d)).slice(-5);return a.length?a.reduce((s,t)=>s+(+t.actualKm||0),0)/a.length:null}
function sameLoc(a,b){if(a?.id&&b?.id)return a.id===b.id;if(a?.lat!=null&&b?.lat!=null)return distance(a,b)<150;return !!a?.address&&String(a.address).trim().toLowerCase()===String(b?.address||'').trim().toLowerCase()}
function incrementUse(id){const l=data.locations.find(x=>x.id===id);if(l)l.useCount=(l.useCount||0)+1}
function rebuildLast(){const t=sortedByArrival()[0];data.lastEndpoint=t?{location:snap(t.destination),odometer:t.endOdometer,time:t.arrivalTime}:null}
function inferLast(){const t=sortedByArrival()[0];if(t)return{location:t.destination,odometer:t.endOdometer,time:t.arrivalTime};return data.settings.initialOdometer?{location:null,odometer:num(data.settings.initialOdometer),time:data.settings.registrationStart}:null}
function split(total,cat,p){const priv=cat==='private'?total:p;return{private:priv,business:cat==='business'?total-priv:0,commute:cat==='commute'?total-priv:0}}

function startCategoryOption(value,label,suggested){return`<label class="trip-type-option ${value===suggested?'suggested':''}" data-category="${value}"><input type="radio" name="category" value="${value}" ${value===suggested?'checked':''} required><span>${label}</span></label>`}
function weightedCategory(trips){const score={commute:0,business:0,private:0};trips.slice(0,12).forEach((t,i)=>{if(score[t.category]!=null)score[t.category]+=Math.max(1,12-i)});return Object.entries(score).sort((a,b)=>b[1]-a[1])[0]?.[0]||null}
function suggestTripCategory(origin,destination){
  const all=sortedTrips();
  if(destination){
    const exact=all.filter(t=>sameLoc(t.origin,origin)&&sameLoc(t.destination,destination));
    if(exact.length)return{value:weightedCategory(exact)||'business',reason:'op basis van eerdere ritten op deze route'};
    const reverse=all.filter(t=>sameLoc(t.origin,destination)&&sameLoc(t.destination,origin));
    if(reverse.length)return{value:weightedCategory(reverse)||'business',reason:'op basis van eerdere ritten op de omgekeerde route'};
    const ot=origin?.type||'other',dt=destination?.type||'other';
    if((ot==='home'&&dt==='work')||(ot==='work'&&dt==='home'))return{value:'commute',reason:'thuis en werk vormen deze route'};
    if(dt==='business'||ot==='business')return{value:'business',reason:'de gekozen locatie staat als zakelijk opgeslagen'};
    if(dt==='private')return{value:'private',reason:'de gekozen locatie staat als privé opgeslagen'};
    const toDest=all.filter(t=>sameLoc(t.destination,destination));
    if(toDest.length)return{value:weightedCategory(toDest)||'business',reason:'op basis van eerdere ritten naar deze bestemming'};
  }
  const fromOrigin=all.filter(t=>sameLoc(t.origin,origin));
  if(fromOrigin.length)return{value:weightedCategory(fromOrigin)||'business',reason:'op basis van eerdere vertrekken vanaf deze locatie'};
  if(origin?.type==='home')return{value:'commute',reason:'vertrek vanaf een thuislocatie'};
  return{value:'business',reason:'standaardvoorstel; pas aan als dat nodig is'};
}
function updateStartCategorySuggestion(destinationId){const form=document.getElementById('startForm');if(!form)return;let origin=null;try{origin=JSON.parse(form.elements.origin.value)}catch(e){}const destination=data.locations.find(x=>x.id===destinationId)||null,s=suggestTripCategory(origin,destination),touched=form.dataset.categoryTouched==='1';form.querySelectorAll('.trip-type-option').forEach(label=>label.classList.toggle('suggested',label.dataset.category===s.value));if(!touched){const input=form.querySelector(`input[name="category"][value="${s.value}"]`);if(input)input.checked=true}const text=document.getElementById('tripTypeSuggestionText');if(text)text.textContent=`Voorstel: ${categoryLabel(s.value)} · ${s.reason}`}

function locationNameOptions(selected=''){return[...data.locations].sort((a,b)=>(b.useCount||0)-(a.useCount||0)||a.name.localeCompare(b.name)).map(l=>`<option value="${l.id}" ${l.id===selected?'selected':''}>${esc(l.name)}</option>`).join('')}
function locationOptions(selected=''){return[...data.locations].sort((a,b)=>(b.useCount||0)-(a.useCount||0)||a.name.localeCompare(b.name)).map(l=>`<option value="${l.id}" ${l.id===selected?'selected':''}>${esc(l.name)}${l.address?' · '+esc(l.address):''}</option>`).join('')}
function parseNum(v){if(v==null||String(v).trim()==='')return null;const n=Number(String(v).trim().replace(',','.'));return Number.isFinite(n)?n:null}
function num(v){if(v==null||String(v).trim()==='')return null;const n=Number(v);return Number.isFinite(n)?n:null}
function snap(l){return l?{id:l.id||null,name:l.name||'',address:l.address||'',lat:l.lat==null?null:+l.lat,lng:l.lng==null?null:+l.lng,type:l.type||'other'}:null}
function labelLoc(l){return l?.name||l?.address||coords(l)||''}
function coords(l){return l?.lat!=null&&l?.lng!=null?`${(+l.lat).toFixed(5)}, ${(+l.lng).toFixed(5)}`:''}
function sortedTrips(){return[...data.trips].sort((a,b)=>new Date(b.departureTime)-new Date(a.departureTime))}
function sortedByArrival(){return[...data.trips].sort((a,b)=>new Date(b.arrivalTime||b.departureTime)-new Date(a.arrivalTime||a.departureTime))}
function tripsRange(s,e){return sortedTrips().filter(t=>inRange(new Date(t.departureTime),s,e))}
function totals(a){return{total:sum(a,'actualKm'),business:sum(a,'businessKm'),commute:sum(a,'commuteKm'),private:sum(a,'privateKm')}}
function sum(a,k){return a.reduce((s,x)=>s+(+x[k]||0),0)}
function inRange(d,s,e){return d>=s&&d<e}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function date(d){return new Intl.DateTimeFormat('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d))}
function shortDate(d){return new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'2-digit',month:'2-digit'}).format(new Date(d))}
function dateTime(d){return new Intl.DateTimeFormat('nl-NL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function time(d){return new Intl.DateTimeFormat('nl-NL',{hour:'2-digit',minute:'2-digit'}).format(new Date(d))}
function localInput(d){const x=new Date(d),p=n=>String(n).padStart(2,'0');return`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:${p(x.getMinutes())}`}
function km(v){return new Intl.NumberFormat('nl-NL',{maximumFractionDigits:1}).format(+v||0)}

function startOfMonth(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(1);return x}
function startOfYear(d){const x=new Date(d);x.setHours(0,0,0,0);x.setMonth(0,1);return x}
function periodStart(d,mode=periodMode){if(mode==='week')return startOfWeek(d);if(mode==='month')return startOfMonth(d);if(mode==='year')return startOfYear(d);return new Date(d)}
function periodRange(){if(periodMode==='all')return{start:null,end:null};const start=periodStart(selectedWeek,periodMode);let end;if(periodMode==='week')end=addDays(start,7);else if(periodMode==='month'){end=new Date(start);end.setMonth(end.getMonth()+1)}else{end=new Date(start);end.setFullYear(end.getFullYear()+1)}return{start,end}}
function periodTrips(){const r=periodRange();return r.start?tripsRange(r.start,r.end):sortedTrips()}
function periodEvents(){const r=periodRange();return [...data.events].filter(x=>!r.start||inRange(new Date(x.time),r.start,r.end)).sort((a,b)=>new Date(b.time)-new Date(a.time))}
function shiftPeriod(step){if(periodMode==='all')return;if(periodMode==='week')selectedWeek=addDays(periodStart(selectedWeek,'week'),step*7);else if(periodMode==='month'){const x=periodStart(selectedWeek,'month');x.setMonth(x.getMonth()+step);selectedWeek=x}else{const x=periodStart(selectedWeek,'year');x.setFullYear(x.getFullYear()+step);selectedWeek=x}}
function periodModeLabel(){return periodMode==='week'?'Week':periodMode==='month'?'Maand':periodMode==='year'?'Jaar':'Alles'}
function periodLabel(){const r=periodRange();if(periodMode==='week')return`Week ${isoWeek(r.start)}`;if(periodMode==='month')return new Intl.DateTimeFormat('nl-NL',{month:'long',year:'numeric'}).format(r.start);if(periodMode==='year')return String(r.start.getFullYear());return'Alle tijden'}
function periodSubLabel(trips=periodTrips()){const r=periodRange();if(periodMode==='week')return`${date(r.start)} – ${date(addDays(r.end,-1))}`;if(periodMode==='month')return`${date(r.start)} – ${date(addDays(r.end,-1))}`;if(periodMode==='year')return`${date(r.start)} – ${date(addDays(r.end,-1))}`;if(!trips.length)return'Nog geen ritten';const oldest=trips[trips.length-1],newest=trips[0];return`${date(oldest.departureTime)} – ${date(newest.departureTime)}`}
function periodSummaryTitle(){return periodMode==='week'?'Weekoverzicht':periodMode==='month'?'Maandoverzicht':periodMode==='year'?'Jaaroverzicht':'Totaaloverzicht'}
function isCurrentPeriod(){if(periodMode==='all')return true;return periodStart(selectedWeek,periodMode).getTime()===periodStart(new Date(),periodMode).getTime()}
function periodSlug(){const r=periodRange();if(periodMode==='week')return`week-${isoWeek(r.start)}-${r.start.getFullYear()}`;if(periodMode==='month')return`${r.start.getFullYear()}-${String(r.start.getMonth()+1).padStart(2,'0')}`;if(periodMode==='year')return String(r.start.getFullYear());return'alle-tijden'}
function routePointList(points){return`<div class="route-points">${points.map(x=>`<div class="route-point"><div class="route-point-icon">${x.type==='tank'?'⛽':'↪'}</div><div class="route-point-main"><strong>${x.type==='tank'?'Tanken':'Omrijpunt'} · ${esc(labelLoc(x.location)||'Locatie niet vastgelegd')}</strong><small>${dateTime(x.time)}${x.note?' · '+esc(x.note):''}</small></div>${x.odometer!=null?`<div class="route-point-km">${odo(x.odometer)} km</div>`:''}</div>`).join('')}</div>`}
function openModal(html){modalPanel.innerHTML=html;modal.hidden=false;document.body.style.overflow='hidden'}
function closeModal(){modal.hidden=true;modalPanel.innerHTML='';document.body.style.overflow=''}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3000)}
function showError(m){toast('Fout: '+m);setTimeout(()=>alert('Fout:\n\n'+m),50)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'&#96;')}

function reportTrips(){return periodTrips()}
function csvText(){const rows=[['Datum','Vertrek','Bestemming','Start km','Eind km','Totaal km','Type','Reden','Zakelijk km','Woon-werk km','Privé km']];for(const t of reportTrips())rows.push([dateTime(t.departureTime),labelLoc(t.origin),labelLoc(t.destination),t.startOdometer,t.endOdometer,t.actualKm,categoryLabel(t.category),t.reason||'',t.businessKm||0,t.commuteKm||0,t.privateKm||0]);return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n')}
function exportJson(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`kilometerregistratie-backup-${new Date().toISOString().slice(0,10)}.json`)}
async function importJson(file){try{const x=JSON.parse(await file.text());if(!confirm('Bestaande gegevens vervangen door deze backup?'))return;data=normalize(x);save();render();toast('Backup geïmporteerd.')}catch(e){showError('Backup kon niet worden gelezen.')}}
function downloadCsv(){download(new Blob([csvText()],{type:'text/csv;charset=utf-8'}),`kilometerregistratie-${periodSlug()}.csv`)}
async function shareCsv(){const f=new File([csvText()],`kilometerregistratie-${periodSlug()}.csv`,{type:'text/csv'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'Kilometerregistratie '+periodLabel()});else downloadCsv()}
function emailReport(){const t=totals(reportTrips()),field=document.querySelector('#settingsForm [name="reportEmail"]'),to=(field?.value||data.settings.reportEmail||''),lines=[`${periodLabel()}`,`Totaal: ${km(t.total)} km`];if(t.business>0)lines.push(`Zakelijk: ${km(t.business)} km`);if(t.commute>0)lines.push(`Woon-werk: ${km(t.commute)} km`);if(t.private>0)lines.push(`Privé: ${km(t.private)} km`);location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Kilometerregistratie '+periodLabel())}&body=${encodeURIComponent(lines.join('\n'))}`}
function printPeriod(){const trips=reportTrips(),t=totals(trips);printReportEl.innerHTML=`<h1>Kilometerregistratie – ${esc(periodLabel())}</h1><p>${esc(data.settings.name||'')}${data.settings.plate?' · '+esc(data.settings.plate):''}</p><p>${esc(periodSubLabel(trips))}</p>${summary(t,'Overzicht',trips.length)}<div style="margin-top:18px">${tripList(trips)}</div>`;window.print();setTimeout(()=>printReportEl.innerHTML='',1000)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
})();
</script>
</body>
</html>

<style>

nt;color:var(--muted);padding:8px 4px;border-radius:12px}.nav button span{display:block;font-size:20px}.nav button small{font-size:10px}.nav button.active{background:var(--card2);color:var(--text)}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);padding:22px 12px calc(22px + env(safe-area-inset-bottom));overflow:auto}.modal[hidden]{display:none}.modal-panel{max-width:620px;margin:4vh auto 0;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 25px 80px rgba(0,0,0,.45)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal-head h2{margin:0}.close{border:0;background:var(--card2);color:var(--text);font-size:24px;width:40px;height:40px;border-radius:50%}.toast{position:fixed;z-index:90;left:50%;bottom:105px;transform:translate(-50%,15px);background:#f4f7fb;color:#111;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;max-width:86vw;text-align:center;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}.week-nav{display:flex;align-items:center;justify-content:space-between}.week-nav .center{text-align:center}.week-nav h2{margin:0}.week-nav small{display:block;margin-top:4px}.nowrap{white-space:nowrap}.divider{height:1px;background:var(--line);margin:16px 0}.route-box{background:#101722;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.route-box strong{display:block}.route-box small{display:block;margin-top:5px}.save-ok{color:var(--good);font-size:12px;margin-top:8px}.print-only{display:none}@media(max-width:460px){.grid2{grid-template-columns:1fr}.hero h2{font-size:24px}.button-row{flex-direction:column}.button-row .btn{width:100%}}@media print{body{background:white;color:black}.top,.nav,.no-print,.modal,.toast{display:none!important}.shell{max-width:none;padding:0}.print-only{display:block}.card,.list-item,.metric{box-shadow:none;border-color:#ccc;background:white;color:black}.card p,.hint,.muted </style>
</head>
<body>
<div class="shell">
  <header class="top"><div><div id="today" class="eyebrow"></div><h1>Kilometerregistratie</h1></div><button class="iconbtn" data-action="settings">⚙︎</button></header>
  <main id="app"></main>
</div>
<nav class="nav"><div class="nav-inner">
  <button data-view="ride" class="active"><span>↗</span><small>Rit</small></button>
  <button data-view="week"><span>◫</span><small>Week</small></button>
  <button data-view="locations"><span>⌖</span><small>Locaties</small></button>
  <button data-view="report"><span>↥</span><small>Rapport</small></button>
  <button data-view="more"><span>•••</span><small>Meer</small></button>
</div></nav>
<div id="modal" class="modal" hidden><div class="modal-panel" id="modalPanel"></div></div>
<div id="toast" class="toast"></div>
<script>
(() => {
'use strict';

const KEY='kmreg-v4-data';

const DEFAULT={
  settings:{
    name:'',
    vehicleBrand:'',
    vehicleModel:'',
    plate:'',
    initialOdometer:'',
    registrationStart:new Date().toISOString().slice(0,10),
    reportEmail:'',
    recognitionRadius:500
  },
  locations:[],
  trips:[],
  events:[],
  trackPoints:[],
  activeTrip:null,
  lastEndpoint:null
};

let data=load();
let view='ride';
let selectedWeek=startOfWeek(new Date());
let gpsWatch=null,gpsTimer=null,gpsLatest=null;

const app=document.getElementById('app'),
      modal=document.getElementById('modal'),
      modalPanel=document.getElementById('modalPanel'),
      toastEl=document.getElementById('toast');

document.getElementById('today').textContent=
  new Intl.DateTimeFormat('nl-NL',{
    weekday:'long',
    day:'numeric',
    month:'long'
  }).format(new Date())+' · v7';

cleanupOldApp().finally(()=>{
  attemptLegacyMigration().finally(()=>{
    render();
    if(data.activeTrip) startTracking();
  });
});

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const x=JSON.parse(raw);
      return normalize(x);
    }
  }catch(e){}
  return structuredCloneSafe(DEFAULT);
}

function normalize(x){
  return {
    settings:{...DEFAULT.settings,...(x.settings||{})},
    locations:Array.isArray(x.locations)?x.locations:[],
    trips:Array.isArray(x.trips)?x.trips:[],
    events:Array.isArray(x.events)?x.events:[],
    trackPoints:Array.isArray(x.trackPoints)?x.trackPoints:[],
    activeTrip:x.activeTrip||null,
    lastEndpoint:x.lastEndpoint||null
  };
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    const check=localStorage.getItem(KEY);
    if(!check)throw new Error('Opslagcontrole mislukt');
    return true;
  }catch(e){
    console.error(e);
    throw new Error('Opslaan op deze iPhone is mislukt. Controleer of Safari lokale websitegegevens mag bewaren.');
  }
}

function uid(){
  return (crypto&&crypto.randomUUID)
    ?crypto.randomUUID()
    :'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
}

function structuredCloneSafe(x){
  return JSON.parse(JSON.stringify(x));
}

async function cleanupOldApp(){
  try{
    if('serviceWorker'in navigator){
      const r=await navigator.serviceWorker.getRegistration();
      if(r)await r.unregister();
    }

    if('caches'in window){
      for(const k of await caches.keys()){
        if(k.startsWith('kmreg-'))await caches.delete(k);
      }
    }
  }catch(e){}
}

async function attemptLegacyMigration(){
  if(localStorage.getItem(KEY))return;
  if(!('indexedDB'in window))return;

  try{
    const req=indexedDB.open('kmreg-db');

    const db=await new Promise((res,rej)=>{
      req.onsuccess=()=>res(req.result);
      req.onerror=()=>rej(req.error);
      req.onupgradeneeded=()=>{};
    });

    const names=[...db.objectStoreNames];

    if(!names.length){
      db.close();
      return;
    }

    const getAll=s=>new Promise((res)=>{
      if(!names.includes(s))return res([]);

      const tx=db.transaction(s,'readonly'),
            r=tx.objectStore(s).getAll();

      r.onsuccess=()=>res(r.result||[]);
      r.onerror=()=>res([]);
    });

    const getOne=(s,id)=>new Promise((res)=>{
      if(!names.includes(s))return res(null);

      const tx=db.transaction(s,'readonly'),
            r=tx.objectStore(s).get(id);

      r.onsuccess=()=>res(r.result||null);
      r.onerror=()=>res(null);
    });

    const [
      settings,
      locations,
      trips,
      events,
      trackPoints,
      activeTrip,
      lastEndpoint
    ]=await Promise.all([
      getOne('settings','main'),
      getAll('locations'),
      getAll('trips'),
      getAll('events'),
      getAll('trackPoints'),
      getOne('appState','activeTrip'),
      getOne('appState','lastEndpoint')
    ]);

    if(settings||locations.length||trips.length||events.length){
      data=normalize({
        settings,
        locations,
        trips,
        events,
        trackPoints,
        activeTrip,
        lastEndpoint
      });

      save();
      toast('Bestaande gegevens zijn overgenomen.');
    }

    db.close();

  }catch(e){
    console.warn('Legacy migration',e);
  }
}

document.addEventListener('click',async e=>{
  const vb=e.target.closest('[data-view]');

  if(vb){
    view=vb.dataset.view;
    render();
    return;
  }

  const el=e.target.closest('[data-action]');

  if(!el)return;

  const a=el.dataset.action;

  try{
    if(a==='settings'){
      view='settings';
      render();
    }
    else if(a==='close'){
      closeModal();
    }
    else if(a==='start'){
      await openStart();
    }
    else if(a==='arrive'){
      await openArrival();
    }
    else if(a==='apple-active'){
      openApple(
        data.activeTrip?.origin,
        data.activeTrip?.expectedDestination
      );
    }
    else if(a==='apple-form'){
      openAppleFromForm();
    }
    else if(a==='add-location'){
      openLocation();
    }
    else if(a==='current-location'){
      await openLocation(null,true);
    }
    else if(a==='gps-location'){
      await fillGps();
    }
    else if(a==='save-location'){
      const f=document.getElementById('locationForm');

      if(!f){
        throw new Error('Locatieformulier niet gevonden.');
      }

      saveLocation(new FormData(f));
    }
    else if(a==='edit-location'){
      openLocation(
        el.closest('[data-id]').dataset.id
      );
    }
    else if(a==='delete-location'){
      deleteLocation(
        el.closest('[data-id]').dataset.id
      );
    }
    else if(a==='tank'){
      await openTank();
    }
    else if(a==='manual'){
      openManual();
    }
    else if(a==='private'){
      openPrivate();
    }
    else if(a==='week-prev'){
      selectedWeek=addDays(selectedWeek,-7);
      render();
    }
    else if(a==='week-next'){
      selectedWeek=addDays(selectedWeek,7);
      render();
    }
    else if(a==='week-now'){
      selectedWeek=startOfWeek(new Date());
      render();
    }
    else if(a==='edit-trip'){
      openTripEdit(
        el.closest('[data-id]').dataset.id
      );
    }
    else if(a==='delete-trip'){
      deleteTrip(
        el.dataset.id||
        el.closest('[data-id]')?.dataset.id
      );
    }
    else if(a==='export'){
      exportJson();
    }
    else if(a==='import'){
      document.getElementById('importFile')?.click();
    }
    else if(a==='csv'){
      downloadCsv();
    }
    else if(a==='email'){
      emailReport();
    }
    else if(a==='share'){
      await shareCsv();
    }
    else if(a==='print'){
      window.print();
    }

  }catch(err){
    console.error(err);

    toast(
      err.message||
      'Er ging iets mis'
    );

    if(a==='save-location'){
      setTimeout(
        ()=>alert(err.message||'Opslaan mislukt'),
        50
      );
    }
  }
});

document.addEventListener('submit',async e=>{
  if(!(e.target instanceof HTMLFormElement))return;

  e.preventDefault();

  const f=e.target,
        fd=new FormData(f);

  try{
    if(f.id==='locationForm'){
      saveLocation(fd);
    }
    else if(f.id==='settingsForm'){
      saveSettings(fd);
    }
    else if(f.id==='startForm'){
      await saveStart(fd);
    }
    else if(f.id==='arrivalForm'){
      saveArrival(fd);
    }
    else if(f.id==='tankForm'){
      saveTank(fd);
    }
    else if(f.id==='manualForm'){
      saveManual(fd);
    }
    else if(f.id==='privateForm'){
      savePrivate(fd);
    }
    else if(f.id==='tripEditForm'){
      saveTripEdit(fd);
    }

  }catch(err){
    console.error(err);
    toast(err.message||'Opslaan mislukt');
  }
});

document.addEventListener('change',async e=>{
  if(
    e.target.id==='importFile'&&
    e.target.files?.[0]
  ){
    await importJson(e.target.files[0]);
  }

  if(e.target.id==='arrivalCategory'){
    updatePrivateHint();
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='arrivalEnd'){
    updateArrivalPreview();
  }
});

function render(){
  document.querySelectorAll('[data-view]').forEach(
    b=>b.classList.toggle(
      'active',
      b.dataset.view===view
    )
  );

  if(view==='ride')renderRide();
  else if(view==='week')renderWeek();
  else if(view==='locations')renderLocations();
  else if(view==='report')renderReport();
  else if(view==='more')renderMore();
  else if(view==='settings')renderSettings();
}

function renderRide(){
  const active=data.activeTrip,
        last=data.lastEndpoint||inferLast(),
        week=tripsRange(
          startOfWeek(new Date()),
          addDays(startOfWeek(new Date()),7)
        ),
        total=sum(week,'actualKm');

  app.innerHTML=`
    <section class="hero">
      <div class="kicker">${active?'Actieve rit':'Huidige stand'}</div>

      ${
        active
        ?`
          <h2>
            ${esc(labelLoc(active.origin))}
            →
            ${esc(labelLoc(active.expectedDestination))}
          </h2>

          <p>
            Startstand ${odo(active.startOdometer)} km
            ${
              active.proposedRouteKm!=null
              ?` · routevoorstel ${km(active.proposedRouteKm)} km`
              :''
            }
          </p>

          <span class="status">
            <span class="dot"></span>
            Gestart ${time(active.departureTime)}
          </span>

          <div class="button-row primary">
            <button
              class="btn secondary"
              data-action="apple-active"
            >
              Open Apple Kaarten
            </button>

            <button
              class="btn"
              data-action="arrive"
            >
              Aankomst registreren
            </button>
          </div>
        `
        :`
          <h2>
            ${
              last
              ?odo(last.odometer)+' km'
              :'Nog geen beginstand'
            }
          </h2>

          <p>
            ${
              last
              ?`Laatste bestemming: ${esc(labelLoc(last.location))}`
              :'Vul bij Instellingen je auto en beginstand in.'
            }
          </p>

          <div class="primary">
            <button
              class="btn full"
              data-action="start"
            >
              Vertrek registreren
            </button>
          </div>
        `
      }
    </section>

    <div class="grid2">
      ${metric('Deze week',km(total)+' km')}
      ${metric('Ritten',String(week.length))}
    </div>

    <div class="section">
      <div class="section-title">
        <h2>Laatste ritten</h2>
      </div>

      ${tripList(sortedTrips().slice(0,4))}
    </div>
  `;
}

function renderMore(){
  app.innerHTML=`
    <div class="section-title">
      <div>
        <div class="kicker">
          Losse registraties
        </div>
        <h2>Meer</h2>
      </div>
    </div>

    <div class="action-grid">
      <button
        class="action"
        data-action="tank"
      >
        <div class="ico">⛽︎</div>

        <div>
          <strong>Tanken</strong>
          <small>
            Kilometerstand en locatie, zonder de A→B-rit te onderbreken.
          </small>
        </div>
      </button>

      <button
        class="action"
        data-action="manual"
      >
        <div class="ico">＋</div>

        <div>
          <strong>Rit toevoegen</strong>
          <small>
            Een rit achteraf handmatig registreren.
          </small>
        </div>
      </button>

      <button
        class="action"
        data-action="private"
      >
        <div class="ico">⌁</div>

        <div>
          <strong>
            Privékilometers aanpassen
          </strong>

          <small>
            Ken een privédeel toe aan een bestaande rit.
          </small>
        </div>
      </button>
    </div>
  `;
}

function renderWeek(){
  const start=selectedWeek,
        end=addDays(start,7),
        trips=tripsRange(start,end),
        tanks=data.events.filter(
          x=>
            x.type==='tank'&&
            inRange(new Date(x.time),start,end)
        ),
        t=totals(trips);

  app.innerHTML=`
    <div class="week-nav">
      <button
        class="mini"
        data-action="week-prev"
      >
        ‹
      </button>

      <div class="center">
        <h2>
          Week ${isoWeek(start)}
        </h2>

        <small>
          ${date(start)} – ${date(addDays(end,-1))}
        </small>
      </div>

      <button
        class="mini"
        data-action="week-next"
      >
        ›
      </button>
    </div>

    <div class="button-row section">
      <button
        class="btn ghost"
        data-action="week-now"
      >
        Huidige week
      </button>
    </div>

    <div class="section grid2">
      ${metric('Totaal',km(t.total)+' km')}
      ${metric('Zakelijk',km(t.business)+' km')}
      ${metric('Woon-werk',km(t.commute)+' km')}
      ${metric('Privé',km(t.private)+' km')}
    </div>

    <div class="section">
      <div class="section-title">
        <h2>Ritten</h2>
        <span class="muted">
          ${trips.length}
        </span>
      </div>

      ${tripList(trips)}
    </div>

    <div class="section">
      <div class="section-title">
        <h2>Tankmomenten</h2>

        <span class="muted">
          ${tanks.length}
        </span>
      </div>

      ${
        tanks.length
        ?`
          <div class="list">
            ${
              tanks.map(
                x=>`
                  <div class="list-item">
                    <div class="list-main">
                      <strong>
                        ${esc(labelLoc(x.location)||'Tanklocatie')}
                      </strong>

                      <small>
                        ${dateTime(x.time)}
                      </small>
                    </div>

                    <strong>
                      ${odo(x.odometer)} km
                    </strong>
                  </div>
                `
              ).join('')
            }
          </div>
        `
        :`
          <div class="empty">
            Geen tankmomenten.
          </div>
        `
      }
    </div>
  `;
}

function renderLocations(){
  const list=[...data.locations].sort(
    (a,b)=>
      (b.useCount||0)-
      (a.useCount||0)||
      a.name.localeCompare(b.name)
  );

  app.innerHTML=`
    <div class="section-title">
      <div>
        <div class="kicker">
          Herkenning binnen
          ${Number(data.settings.recognitionRadius)||500} m
        </div>

        <h2>
          Bekende locaties
        </h2>
      </div>
    </div>

    <div class="button-row">
      <button
        class="btn"
        data-action="current-location"
      >
        Huidige locatie toevoegen
      </button>

      <button
        class="btn secondary"
        data-action="add-location"

function saveLocation(fd){
  const status=document.getElementById('locationSaveStatus');

  if(status){
    status.textContent='Bezig met opslaan…';
  }

  const id=String(fd.get('id')||uid()),
        old=data.locations.find(x=>x.id===id),
        rawName=String(fd.get('name')||'').trim(),
        address=String(fd.get('address')||'').trim(),
        lat=parseCoord(fd.get('lat')),
        lng=parseCoord(fd.get('lng'));

  if((lat==null)!==(lng==null)){
    throw new Error(
      'Vul beide GPS-coördinaten in, of laat beide leeg.'
    );
  }

  if(lat!=null&&Math.abs(lat)>90){
    throw new Error(
      'Latitude is ongeldig.'
    );
  }

  if(lng!=null&&Math.abs(lng)>180){
    throw new Error(
      'Longitude is ongeldig.'
    );
  }

  if(!rawName&&!address&&lat==null){
    throw new Error(
      'Vul minimaal een adres in of gebruik huidige GPS.'
    );
  }

  const name=
    rawName||
    address||
    (
      lat!=null
      ?`Locatie ${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`
      :'Locatie'
    );

  const loc={
    id,
    name,
    address,
    lat,
    lng,
    type:String(fd.get('type')||'other'),
    useCount:old?.useCount||0,
    createdAt:old?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  const i=data.locations.findIndex(
    x=>x.id===id
  );

  if(i>=0){
    data.locations[i]=loc;
  }else{
    data.locations.push(loc);
  }

  save();

  const stored=JSON.parse(
    localStorage.getItem(KEY)||'{}'
  );

  const verified=
    Array.isArray(stored.locations)&&
    stored.locations.some(
      x=>
        x.id===id&&
        x.address===address
    );

  if(!verified){
    throw new Error(
      'De locatie is niet teruggevonden in de lokale opslag.'
    );
  }

  closeModal();
  render();

  toast(
    `Locatie opgeslagen: ${name}`
  );
}

function saveArrival(fd){
  const a=data.activeTrip;

  if(!a){
    throw new Error(
      'Actieve rit ontbreekt.'
    );
  }

  const end=num(
    fd.get('endOdometer')
  );

  if(
    end==null||
    end<a.startOdometer
  ){
    throw new Error(
      'Controleer de eindkilometerstand.'
    );
  }

  const actual=
          end-a.startOdometer,

        choice=
          String(
            fd.get('destinationChoice')
          ),

        current=
          JSON.parse(
            String(
              fd.get('currentJson')||
              'null'
            )
          );

  let dest;

  if(choice.startsWith('known:')){
    dest=data.locations.find(
      x=>x.id===choice.slice(6)
    );
  }else{
    dest=current;
  }

  if(!dest){
    throw new Error(
      'Kies een bestemming.'
    );
  }

  const cat=
          String(fd.get('category')),

        privateKm=
          cat==='private'
          ?actual
          :(num(fd.get('privateKm'))||0);

  if(
    privateKm<0||
    privateKm>actual
  ){
    throw new Error(
      'Privékilometers moeten tussen 0 en het totaal liggen.'
    );
  }

  const z=split(
    actual,
    cat,
    privateKm
  );

  const trip={
    id:a.id,
    origin:a.origin,
    destination:snap(dest),
    departureTime:a.departureTime,
    arrivalTime:new Date(
      String(fd.get('arrivalTime'))
    ).toISOString(),
    startOdometer:a.startOdometer,
    endOdometer:end,
    actualKm:actual,
    proposedRouteKm:a.proposedRouteKm??null,
    category:cat,
    reason:String(fd.get('reason')||'').trim(),
    privateKm:z.private,
    businessKm:z.business,
    commuteKm:z.commute
  };

  data.trips.push(trip);

  data.lastEndpoint={
    location:snap(dest),
    odometer:end,
    time:trip.arrivalTime
  };

  data.activeTrip=null;

  if(dest.id){
    incrementUse(dest.id);
  }

  save();
  stopTracking();
  closeModal();
  render();

  toast(
    `Rit opgeslagen: ${km(actual)} km.`
  );
}

async function getPosition(){
  return new Promise(
    (res,rej)=>{
      if(!navigator.geolocation){
        return rej(
          new Error(
            'GPS wordt niet ondersteund.'
          )
        );
      }

      navigator.geolocation.getCurrentPosition(
        p=>res({
          lat:p.coords.latitude,
          lng:p.coords.longitude,
          accuracy:p.coords.accuracy
        }),

        e=>rej(
          new Error(
            e.code===1
            ?'Geen locatietoestemming. Controleer Safari > Locatie.'
            :e.code===3
            ?'GPS ophalen duurde te lang.'
            :'GPS-locatie niet beschikbaar.'
          )
        ),

        {
          enableHighAccuracy:true,
          timeout:12000,
          maximumAge:15000
        }
      );
    }
  );
}

async function startTracking(){
  if(
    !data.activeTrip||
    !navigator.geolocation||
    gpsWatch!=null
  ){
    return;
  }

  gpsWatch=navigator.geolocation.watchPosition(
    p=>{
      gpsLatest={
        lat:p.coords.latitude,
        lng:p.coords.longitude,
        accuracy:p.coords.accuracy
      };
    },

    ()=>{},

    {
      enableHighAccuracy:true,
      maximumAge:15000,
      timeout:20000
    }
  );

  try{
    gpsLatest=await getPosition();
    persistTrack();
  }catch(e){}

  gpsTimer=setInterval(
    persistTrack,
    60000
  );
}

function stopTracking(){
  if(gpsWatch!=null){
    navigator.geolocation.clearWatch(
      gpsWatch
    );
  }

  if(gpsTimer){
    clearInterval(
      gpsTimer
    );
  }

  gpsWatch=null;
  gpsTimer=null;
  gpsLatest=null;
}

function persistTrack(){
  if(
    !data.activeTrip||
    !gpsLatest
  ){
    return;
  }

  const minute=
          new Date()
          .toISOString()
          .slice(0,16),

        id=
          data.activeTrip.id+
          '_'+
          minute;

  if(
    data.trackPoints.some(
      x=>x.id===id
    )
  ){
    return;
  }

  data.trackPoints.push({
    id,
    tripId:data.activeTrip.id,
    time:new Date().toISOString(),
    lat:gpsLatest.lat,
    lng:gpsLatest.lng,
    accuracy:gpsLatest.accuracy??null
  });

  if(data.trackPoints.length>20000){
    data.trackPoints=
      data.trackPoints.slice(-20000);
  }

  try{
    save();
  }catch(e){}
}

function matches(g){
  const r=
    Number(
      data.settings.recognitionRadius
    )||
    500;

  return data.locations
    .filter(
      l=>
        l.lat!=null&&
        l.lng!=null
    )
    .map(
      location=>({
        location,
        distance:distance(g,location)
      })
    )
    .filter(
      x=>x.distance<=r
    )
    .sort(
      (a,b)=>a.distance-b.distance
    );
}

function distance(a,b){
  const R=6371000,
        rad=x=>x*Math.PI/180,
        dLat=rad(Number(b.lat)-Number(a.lat)),
        dLon=rad(Number(b.lng)-Number(a.lng)),
        la1=rad(Number(a.lat)),
        la2=rad(Number(b.lat)),
        h=
          Math.sin(dLat/2)**2+
          Math.cos(la1)*
          Math.cos(la2)*
          Math.sin(dLon/2)**2;

  return 2*R*Math.asin(
    Math.sqrt(h)
  );
}

function historyDistance(o,d){
  const arr=data.trips
    .filter(
      t=>
        sameLoc(t.origin,o)&&
        sameLoc(t.destination,d)
    )
    .slice(-5);

  if(!arr.length){
    return null;
  }

  return arr.reduce(
    (s,t)=>
      s+
      Number(t.actualKm||0),
    0
  )/arr.length;
}

function sameLoc(a,b){
  if(a?.id&&b?.id){
    return a.id===b.id;
  }

  if(
    a?.lat!=null&&
    b?.lat!=null
  ){
    return distance(a,b)<150;
  }

  return (
    String(
      a?.address||
      ''
    )
    .trim()
    .toLowerCase()
    ===
    String(
      b?.address||
      ''
    )
    .trim()
    .toLowerCase()
    &&
    !!a?.address
  );
}

function inferLast(){
  const t=sortedTripsByArrival()[0];

  if(t){
    return {
      location:t.destination,
      odometer:t.endOdometer,
      time:t.arrivalTime
    };
  }

  if(data.settings.initialOdometer){
    return {
      location:null,
      odometer:num(
        data.settings.initialOdometer
      ),
      time:data.settings.registrationStart
    };
  }

  return null;
}

function split(total,cat,p){
  const priv=
    cat==='private'
    ?total
    :p;

  return {
    private:priv,
    business:
      cat==='business'
      ?total-priv
      :0,
    commute:
      cat==='commute'
      ?total-priv
      :0
  };
}

    `kilometerregistratie-week-${isoWeek(new Date())}.csv`,
    {
      type:'text/csv'
    }
  );

  if(
    navigator.canShare?.({
      files:[file]
    })
  ){
    await navigator.share({
      files:[file],
      title:'Kilometerregistratie'
    });
  }else{
    downloadCsv();
  }
}

function emailReport(){
  const t=totals(
          reportTrips()
        ),

        to=
          data.settings.reportEmail||
          '',

        subject=
          `Kilometerregistratie week ${isoWeek(new Date())}`,

        body=
`Totaal: ${km(t.total)} km
Zakelijk: ${km(t.business)} km
Woon-werk: ${km(t.commute)} km
Privé: ${km(t.private)} km

Open de webapp voor ritdetails.`;

  location.href=
    `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function download(blob,name){
  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download=name;

  document.body.appendChild(a);
  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(a.href);
      a.remove();
    },
    1000
  );
}

function field(
  label,
  name,
  value='',
  type='text',
  hint=''
){
  return `
    <div class="form-group">
      <label>
        ${esc(label)}
      </label>

      <input
        name="${name}"
        type="${type}"
        value="${attr(value??'')}"
        ${
          type==='number'
          ?'inputmode="numeric"'
          :''
        }
      >

      ${
        hint
        ?`
          <div class="hint">
            ${esc(hint)}
          </div>
        `
        :''
      }
    </div>
  `;
}

function coordField(
  label,
  name,
  value=''
){
  return `
    <div class="form-group">
      <label>
        ${label}
      </label>

      <input
        name="${name}"
        type="text"
        inputmode="decimal"
        value="${attr(value??'')}"
        placeholder="52.12345"
      >
    </div>
  `;
}

function locationOptions(selected=''){
  return [...data.locations]
    .sort(
      (a,b)=>
        (b.useCount||0)-
        (a.useCount||0)||
        a.name.localeCompare(b.name)
    )
    .map(
      l=>`
        <option
          value="${l.id}"
          ${l.id===selected?'selected':''}
        >
          ${esc(l.name)}
          ${
            l.address
            ?' · '+esc(l.address)
            :''
          }
        </option>
      `
    )
    .join('');
}

function parseCoord(v){
  if(
    v==null||
    String(v).trim()===''
  ){
    return null;
  }

  const n=Number(
    String(v).replace(',','.')
  );

  return Number.isFinite(n)
    ?n
    :null;
}

function parseNum(v){
  if(
    v==null||
    String(v).trim()===''
  ){
    return null;
  }

  const n=Number(
    String(v).replace(',','.')
  );

  return Number.isFinite(n)
    ?n
    :null;
}

function num(v){
  const n=Number(v);

  return (
    v===''||
    v==null||
    !Number.isFinite(n)
  )
    ?null
    :n;
}

function snap(l){
  return l
    ?{
      id:l.id||null,
      name:l.name||'',
      address:l.address||'',
      lat:
        l.lat==null
        ?null
        :Number(l.lat),
      lng:
        l.lng==null
        ?null
        :Number(l.lng),
      type:l.type||'other'
    }
    :null;
}

function labelLoc(l){
  return (
    l?.name||
    l?.address||
    coords(l)||
    ''
  );
}

function coords(l){
  return (
    l?.lat!=null&&
    l?.lng!=null
  )
    ?`${Number(l.lat).toFixed(5)}, ${Number(l.lng).toFixed(5)}`
    :'';
}

function sortedTrips(){
  return [...data.trips].sort(
    (a,b)=>
      new Date(b.departureTime)-
      new Date(a.departureTime)
  );
}

function sortedTripsByArrival(){
  return [...data.trips].sort(
    (a,b)=>
      new Date(
        b.arrivalTime||
        b.departureTime
      )
      -
      new Date(
        a.arrivalTime||
        a.departureTime
      )
  );
}

function tripsRange(s,e){
  return sortedTrips().filter(
    t=>
      inRange(
        new Date(t.departureTime),
        s,
        e
      )
  );
}

function totals(arr){
  return {
    total:sum(arr,'actualKm'),
    business:sum(arr,'businessKm'),
    commute:sum(arr,'commuteKm'),
    private:sum(arr,'privateKm')
  };
}

function sum(arr,k){
  return arr.reduce(
    (s,x)=>
      s+
      Number(x[k]||0),
    0
  );
}

function inRange(d,s,e){
  return d>=s&&d<e;
}

function startOfWeek(d){
  const x=new Date(d);

  x.setHours(0,0,0,0);

  const day=x.getDay()||7;

  x.setDate(
    x.getDate()-day+1
  );

  return x;
}

function addDays(d,n){
  const x=new Date(d);

  x.setDate(
    x.getDate()+n
  );

  return x;
}

function isoWeek(d){
  const x=new Date(
    Date.UTC(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    )
  );

  const day=x.getUTCDay()||7;

  x.setUTCDate(
    x.getUTCDate()+4-day
  );

  const y=new Date(
    Date.UTC(
      x.getUTCFullYear(),
      0,
      1
    )
  );

  return Math.ceil(
    (
      ((x-y)/86400000)+1
    )/7
  );
}

function date(d){
  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  ).format(
    new Date(d)
  );
}

function shortDate(d){
  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      weekday:'short',
      day:'2-digit',
      month:'2-digit'
    }
  ).format(
    new Date(d)
  );
}

function dateTime(d){
  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  ).format(
    new Date(d)
  );
}

function time(d){
  return new Intl.DateTimeFormat(
    'nl-NL',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  ).format(
    new Date(d)
  );
}

function localInput(d){
  const x=new Date(d),
        p=n=>
          String(n).padStart(2,'0');

  return (
    `${x.getFullYear()}-`+
    `${p(x.getMonth()+1)}-`+
    `${p(x.getDate())}T`+
    `${p(x.getHours())}:`+
    `${p(x.getMinutes())}`
  );
}

function km(v){
  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:1
    }
  ).format(
    Number(v||0)
  );
}

function odo(v){
  return new Intl.NumberFormat(
    'nl-NL',
    {
      maximumFractionDigits:0
    }
  ).format(
    Number(v||0)
  );
}

function categoryLabel(v){
  return v==='business'
    ?'Zakelijk'
    :v==='commute'
    ?'Woon-werk'
    :v==='private'
    ?'Privé'
    :'Overig';
}

function typeLabel(v){
  return v==='home'
    ?'Thuis'
    :v==='work'
    ?'Werk'
    :v==='business'
    ?'Zakelijk'
    :v==='private'
    ?'Privé'
    :'Overig';
}

function esc(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function attr(v){
  return esc(v).replace(
    /`/g,
    '&#96;'
  );
}

})();
</script>

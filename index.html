.trip-group{margin-top:18px}.trip-group:first-child{margin-top:0}.trip-group-title{padding:0 2px 7px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.backup-reminder{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.backup-reminder button{border:0;background:transparent;color:var(--accent);font-weight:750;padding:6px 0}.backup-status{padding-top:13px}.backup-status strong,.backup-status small{display:block}.backup-status small{margin-top:4px}.active-dock{position:fixed;z-index:25;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),620px);display:flex;gap:6px;padding:7px;background:rgba(18,22,28,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.active-dock button{flex:1;min-height:43px;border:0;border-radius:11px;background:transparent;color:var(--text);font-weight:750}.active-dock .dock-arrive{background:var(--accent);color:#fff;flex:1.25}.has-active-trip .shell{padding-bottom:calc(105px + env(safe-area-inset-bottom))}.period-gesture-hint{display:none!important}

.settings-autosave{margin:-2px 0 14px;color:var(--muted);font-size:12px}.range-setting{padding:14px 0 4px;border-top:1px solid var(--line)}.range-setting-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.range-setting-head strong,.range-setting-head small{display:block}.range-setting-head small{margin-top:3px;line-height:1.35}.range-value{flex:0 0 auto;color:var(--accent);font-size:12px;font-weight:800;white-space:nowrap}.range-setting input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--accent)}.range-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.toggle-list{display:grid;gap:2px;margin-top:10px}.toggle-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.toggle-row:last-child{border-bottom:0}.toggle-copy{flex:1}.toggle-copy strong,.toggle-copy small{display:block}.toggle-copy small{margin-top:3px;line-height:1.35}.toggle{position:relative;display:inline-block;flex:0 0 50px;width:50px;height:30px}.toggle input{position:absolute;opacity:0;pointer-events:none}.toggle-slider{position:absolute;inset:0;border-radius:999px;background:#343d49;transition:.18s;cursor:pointer}.toggle-slider::after{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:.18s}.toggle input:checked+.toggle-slider{background:var(--accent)}.toggle input:checked+.toggle-slider::after{transform:translateX(20px)}

<body>
<div class="shell">
<header class="top">
<div><div id="today" class="eyebrow"></div><h1>Kilometerregistratie</h1></div>
<button id="topAction" class="iconbtn" data-action="settings" aria-label="Instellingen">⚙︎</button>
</header>
<main id="app"></main>
</div>
<div id="modal" class="modal" hidden><div id="modalPanel" class="modal-panel"></div></div>
<div id="toast" class="toast"></div>
<div id="printReport" class="print-only"></div>
<script>
(()=>{
'use strict';
const KEY='kmreg-v4-data';
const DEFAULT={settings:{name:'',vehicleBrand:'',vehicleModel:'',plate:'',initialOdometer:'',registrationStart:new Date().toISOString().slice(0,10),reportEmail:'',recognitionRadius:500,privateDays:[],privateTimeStart:'',privateTimeEnd:'',navigationMode:'system',lastBackupAt:null,swipeDeleteEnabled:true,destinationTimeWindowHours:2},locations:[],trips:[],events:[],trackPoints:[],activeTrip:null,lastEndpoint:null};
let data=load(),view='ride',selectedWeek=new Date(),periodMode='week',gpsWatch=null,gpsTimer=null,gpsLatest=null,odoSwipe=null,periodGesture=null,periodLastTap=0,expandedTripId=null,tripSwipe=null,trackStoreReady=false,trackDbPromise=null;
const app=document.getElementById('app'),modal=document.getElementById('modal'),modalPanel=document.getElementById('modalPanel'),toastEl=document.getElementById('toast'),topAction=document.getElementById('topAction'),printReportEl=document.getElementById('printReport');
document.getElementById('today').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date())+' · 0.27.3';
render();initTrackStore().finally(()=>{if(data.activeTrip)startTracking()});registerServiceWorker();

function clone(v){return JSON.parse(JSON.stringify(v))}
function normalize(x){return{settings:{...DEFAULT.settings,...(x.settings||{})},locations:Array.isArray(x.locations)?x.locations:[],trips:Array.isArray(x.trips)?x.trips:[],events:Array.isArray(x.events)?x.events:[],trackPoints:Array.isArray(x.trackPoints)?x.trackPoints:[],activeTrip:x.activeTrip||null,lastEndpoint:x.lastEndpoint||null}}
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalize(JSON.parse(raw)):clone(DEFAULT)}catch(e){console.error(e);return clone(DEFAULT)}}
function save(){const local=trackStoreReady?{...data,trackPoints:[]}:data;localStorage.setItem(KEY,JSON.stringify(local));const raw=localStorage.getItem(KEY);if(!raw)throw new Error('Lokale opslag is mislukt.');JSON.parse(raw)}
function uid(){return window.crypto?.randomUUID?window.crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}

function render(){document.body.classList.toggle('has-active-trip',view!=='settings'&&!!data.activeTrip);if(view==='settings'){topAction.dataset.action='home';topAction.textContent='←';topAction.setAttribute('aria-label','Terug');renderSettings()}else{view='ride';topAction.dataset.action='settings';topAction.textContent='⚙︎';topAction.setAttribute('aria-label','Instellingen');renderHome()}}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;try{
if(a==='settings'){view='settings';render()}else if(a==='home'){view='ride';render()}else if(a==='close')closeModal();else if(a==='start')await openStart();else if(a==='arrive')await openArrival();else if(a==='navigate-active')await startNavigation(data.activeTrip?.expectedDestination);else if(a==='share-active')await shareActiveRide();else if(a==='trip-toggle'){if(el.dataset.suppressClick==='1'){delete el.dataset.suppressClick}else{const id=el.dataset.id||el.closest('[data-id]')?.dataset.id;expandedTripId=expandedTripId===id?null:id;render()}}else if(a==='edit-trip')openTripEdit(el.dataset.id);else if(a==='back-detail')returnFromTripEdit(el.dataset.id);else if(a==='save-trip-edit')saveTripEdit();else if(a==='delete-trip')deleteTrip(el.dataset.id);else if(a==='event-detail')openEventDetail(el.dataset.id||el.closest('[data-event-id]')?.dataset.eventId);else if(a==='edit-event')openEventEdit(el.dataset.id);else if(a==='back-event-detail')openEventDetail(el.dataset.id);else if(a==='save-event')saveEventEdit();else if(a==='delete-event')deleteEvent(el.dataset.id);else if(a==='select-odometer')selectOdometerProposal(el);else if(a==='toggle-odometer-edit')toggleOdometerEdit();else if(a==='period-choose')openPeriodChooser();else if(a==='period-set'){closeModal();setPeriodMode(el.dataset.mode)}else if(a==='period-mode')setPeriodMode(el.dataset.mode);else if(a==='period-prev'){shiftPeriod(-1);render()}else if(a==='period-next'){shiftPeriod(1);render()}else if(a==='period-now'){selectedWeek=new Date();render()}else if(a==='add-location')openLocation();else if(a==='current-location')await openLocation(null,true);else if(a==='gps-location')await fillGps();else if(a==='save-location')saveLocation();else if(a==='edit-location')openLocation(el.closest('[data-id]').dataset.id);else if(a==='delete-location')deleteLocation(el.closest('[data-id]').dataset.id);else if(a==='tank')await openTank();else if(a==='detour')await openDetour();else if(a==='manual')openManual();else if(a==='private')openPrivate();else if(a==='export'||a==='backup-now')exportJson();else if(a==='import')document.getElementById('importFile')?.click();else if(a==='csv')downloadCsv();else if(a==='share')await shareCsv();else if(a==='email')emailReport();else if(a==='print')printPeriod();
}catch(err){console.error(err);showError(err.message||'Er ging iets mis.')}});

document.addEventListener('submit',async e=>{if(!(e.target instanceof HTMLFormElement))return;e.preventDefault();const f=e.target,fd=new FormData(f);try{if(f.id==='settingsForm')saveSettings(fd);else if(f.id==='startForm')await saveStart(fd);else if(f.id==='arrivalForm')saveArrival(fd);else if(f.id==='tankForm')saveTank(fd);else if(f.id==='detourForm')saveDetour(fd);else if(f.id==='manualForm')saveManual(fd);else if(f.id==='privateForm')savePrivate(fd)}catch(err){console.error(err);showError(err.message||'Opslaan mislukt.')}});
document.addEventListener('change',async e=>{if(e.target.closest?.('#settingsForm'))autosaveSettings();const categorySelect=e.target.matches?.('#tripEditForm select[name="category"],#manualForm select[name="category"]')?e.target:null;if(categorySelect){const wrap=categorySelect.form?.querySelector('[data-private-km-field]');if(wrap)wrap.hidden=categorySelect.value==='private'}if(e.target.id==='importFile'&&e.target.files?.[0])await importJson(e.target.files[0]);if(e.target.id==='arrivalDestination')refreshArrivalEstimates()});
document.addEventListener('input',e=>{if(e.target.closest?.('#settingsForm'))autosaveSettings();if(e.target.id==='destinationTimeWindowHours'){const out=document.getElementById('destinationTimeWindowValue');if(out)out.textContent=formatDestinationTimeWindow(e.target.value)}if(e.target.id==='arrivalCustomEnd'){const n=num(e.target.value);if(n!=null){document.querySelectorAll('.estimate-choice').forEach(x=>x.classList.remove('active'));updateOdometerVisual(n,'Handmatig aangepast')}}});
document.addEventListener('pointerdown',e=>{const d=e.target.closest('.odo-digit.swipeable');if(!d)return;odoSwipe={pointerId:e.pointerId,startY:e.clientY,place:+d.dataset.place,el:d};try{d.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointerup',e=>{if(!odoSwipe||odoSwipe.pointerId!==e.pointerId)return;const swipe=odoSwipe;odoSwipe=null;const dy=e.clientY-swipe.startY;if(Math.abs(dy)<16)return;adjustOdometerDigit(swipe.place,dy<0?1:-1,swipe.el)});
document.addEventListener('pointercancel',()=>{odoSwipe=null});
document.addEventListener('pointerdown',tripSwipeStart);
document.addEventListener('pointermove',tripSwipeMove);
document.addEventListener('pointerup',tripSwipeEnd);
document.addEventListener('pointercancel',tripSwipeCancel);
document.addEventListener('touchstart',periodTouchStart,{passive:true});
document.addEventListener('touchmove',periodTouchMove,{passive:false});
document.addEventListener('touchend',periodTouchEnd,{passive:true});

function summary(t,title,count){const p=[];if(+t.business>0)p.push(['business','Zakelijk',t.business]);if(+t.commute>0)p.push(['commute','Woon-werk',t.commute]);if(+t.private>0)p.push(['private','Privé',t.private]);return`<div class="summary"><div class="summary-head"><div class="summary-label">${esc(title)}</div><div class="summary-total"><strong>${km(t.total)} km</strong><small>${count} ${count===1?'rit':'ritten'}</small></div></div>${p.length?`<div class="summary-parts">${p.map(x=>`<div class="summary-part ${categoryClass(x[0])}"><span>${x[1]}</span><strong>${km(x[2])} km</strong></div>`).join('')}</div>`:''}</div>`}
function activeRouteInsight(a){if(!a?.expectedDestination)return'';const pattern=routePatternAnalysis(a.origin,a.expectedDestination);if(!pattern?.shifted||pattern.recentMedian==null||pattern.baselineMedian==null)return'';const diff=pattern.recentMedian-pattern.baselineMedian,dir=diff>=0?'langer':'korter';return`<div class="smart-insight">Recente route is gemiddeld <strong>${km(Math.abs(diff))} km ${dir}</strong> dan normaal.${pattern.detourCount>0?' Waarschijnlijk door een omleiding.':''}</div>`}
function backupAgeDays(){if(!data.settings.lastBackupAt)return null;return Math.max(0,Math.floor((Date.now()-new Date(data.settings.lastBackupAt).getTime())/86400000))}
function backupStatusText(){const age=backupAgeDays();if(age==null)return'Nog geen back-up gemaakt';if(age===0)return'Laatste back-up: vandaag';if(age===1)return'Laatste back-up: gisteren';return`Laatste back-up: ${age} dagen geleden`}
function backupDue(){const age=backupAgeDays();return age==null?data.trips.length>=10:age>=30}
function backupReminderHtml(){if(!backupDue())return'';return`<div class="backup-reminder"><span>${esc(backupStatusText())}</span><button type="button" data-action="backup-now">Maak back-up</button></div>`}
function activeDock(a){if(!a)return'';const nav=a.expectedDestination&&(data.settings.navigationMode||'system')!=='off',share=a.expectedDestination&&rideSharePreference(a.expectedDestination)!=='never';return`<nav class="active-dock" aria-label="Actieve rit acties">${nav?'<button data-action="navigate-active">Navigatie</button>':''}${share?'<button data-action="share-active">Delen</button>':''}<button class="dock-arrive" data-action="arrive">Aankomst</button></nav>`}

<section class="hero ${a?'active-hero':''}"><div class="kicker">${a?'Actieve rit':'Huidige stand'}</div>${a?`<div class="active-route"><strong>${esc(labelLoc(a.origin)||'Onbekend')}</strong><span>↓</span><strong>${esc(labelLoc(a.expectedDestination)||'Bestemming onbekend')}</strong></div><div class="active-meta"><span class="status ${categoryClass(a.category||'business')}"><span class="dot"></span>${categoryLabel(a.category||'business')} · gestart ${time(a.departureTime)}</span><span>Startstand ${odo(a.startOdometer)} km</span></div>${activeRouteInsight(a)}<button class="btn full arrival-main" data-action="arrive">Aankomst</button><div class="ride-tools">${a.expectedDestination&&(data.settings.navigationMode||'system')!=='off'?'<button class="ride-tool" data-action="navigate-active">Navigatie</button>':''}${a.expectedDestination&&rideSharePreference(a.expectedDestination)!=='never'?'<button class="ride-tool" data-action="share-active">Deel rit</button>':''}<button class="ride-tool" data-action="tank">Tanken</button><button class="ride-tool" data-action="detour">Omrijpunt</button></div>${activePoints.length?`<div class="hint active-points">${activePoints.length} tussenpunt${activePoints.length===1?'':'en'} vastgelegd</div>`:''}`:`<h2 class="home-odometer">${last?odo(last.odometer)+' km':'Nog geen beginstand'}</h2><p>${last?.location?'Laatste bestemming: '+esc(labelLoc(last.location)):'Vul bij Instellingen je auto en beginstand in.'}</p><button class="btn full" data-action="start">Vertrek registreren</button>`}</section>

function localDayKey(d){const x=new Date(d),p=n=>String(n).padStart(2,'0');return`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`}
function relativeDayLabel(d){const x=startOfDay(new Date(d)),today=startOfDay(new Date()),delta=Math.round((today-x)/86400000);if(delta===0)return'Vandaag';if(delta===1)return'Gisteren';return new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(x)}
function tripGroup(t){const d=new Date(t.departureTime);if(periodMode==='day')return null;if(periodMode==='week')return{key:localDayKey(d),label:relativeDayLabel(d)};if(periodMode==='month'){const w=startOfWeek(d);return{key:`${w.getFullYear()}-${isoWeek(w)}`,label:`Week ${isoWeek(w)}`}}const m=startOfMonth(d);return{key:`${m.getFullYear()}-${m.getMonth()}`,label:new Intl.DateTimeFormat('nl-NL',{month:'long',year:'numeric'}).format(m)}}
function swipeDeleteEnabled(){return data.settings.swipeDeleteEnabled!==false}
function locationDisplay(loc){const label=labelLoc(loc)||'Onbekend',address=String(loc?.address||'').trim(),xy=coords(loc),extra=address&&address!==label?address:(!address&&xy&&xy!==label?xy:'');return{label,extra}}
function swipeActions(kind,id){const editAction=kind==='trip'?'edit-trip':kind==='event'?'edit-event':'edit-location',deleteAction=kind==='trip'?'delete-trip':kind==='event'?'delete-event':'delete-location';return`<div class="swipe-actions trip-swipe-actions">${swipeDeleteEnabled()?`<button type="button" class="swipe-action trip-swipe-action swipe-delete" data-action="${deleteAction}" data-id="${id}">Verwijder</button>`:''}<button type="button" class="swipe-action trip-swipe-action swipe-edit" data-action="${editAction}" data-id="${id}">Bewerk</button></div>`}
function inlineEventRow(ev,fullDate=false){const loc=locationDisplay(ev.location),meta=[ev.odometer!=null?odo(ev.odometer)+' km':'',ev.note||''].filter(Boolean).join(' · '),day=fullDate?shortDate(ev.time):'';return`<div class="swipe-row inline-event-swipe" data-swipe-kind="event" data-id="${ev.id}">${swipeActions('event',ev.id)}<div class="swipe-surface inline-event-surface" data-action="event-detail" data-id="${ev.id}"><div class="inline-event-time">${day?`<span>${esc(day)}</span>`:''}<strong>${time(ev.time)}</strong></div><div class="inline-event-icon">${ev.type==='tank'?'⛽':'↪'}</div><div class="inline-event-main"><strong>${ev.type==='tank'?'Tankpunt':'Omrijpunt'} · ${esc(loc.label)}</strong>${loc.extra?`<small>${esc(loc.extra)}</small>`:''}${meta?`<small>${esc(meta)}</small>`:''}</div><div class="inline-event-km">›</div></div></div>`}
function tripInlineDetails(t){const gps=data.trackPoints.filter(x=>x.tripId===t.id).length,points=data.events.filter(x=>x.tripId===t.id).sort((a,b)=>new Date(a.time)-new Date(b.time)),arrival=t.arrivalTime?time(t.arrivalTime):'—',o=locationDisplay(t.origin),d=locationDisplay(t.destination);return`<div class="trip-inline-details"><div class="inline-route-stack"><div class="inline-route-stop"><div class="inline-stop-time"><strong>${time(t.departureTime)}</strong></div><div class="stop-icon">●</div><div><strong>${esc(o.label)}</strong>${o.extra?`<small>${esc(o.extra)}</small>`:''}</div></div>${points.length?`<div class="inline-waypoint-title">Onderweg · ${points.length} ${points.length===1?'tussenpunt':'tussenpunten'}</div>${points.map(inlineEventRow).join('')}`:''}<div class="inline-route-stop"><div class="inline-stop-time"><strong>${arrival}</strong></div><div class="stop-icon">◎</div><div><strong>${esc(d.label)}</strong>${d.extra?`<small>${esc(d.extra)}</small>`:''}</div></div></div><div class="trip-inline-grid"><div class="trip-inline-item"><span>Type</span><strong>${categoryLabel(t.category)}</strong></div></div>${t.reason?`<div class="trip-inline-note">${esc(t.reason)}</div>`:''}${gps?`<div class="trip-inline-meta">${gps} GPS-punt${gps===1?'':'en'}</div>`:''}<div class="trip-inline-actions"><button type="button" data-action="edit-trip" data-id="${t.id}">Bewerken</button></div></div>`}
function tripRow(t){const expanded=expandedTripId===t.id,cat=categoryClass(t.category),hasPrivatePart=+t.privateKm>0&&t.category!=='private';return`<div class="trip-entry ${expanded?'expanded':''}" data-id="${t.id}"><div class="swipe-row trip-swipe-row" data-swipe-kind="trip" data-id="${t.id}">${swipeActions('trip',t.id)}<div class="swipe-surface trip-swipe-surface list-item trip ${cat}" data-id="${t.id}" data-action="trip-toggle"><div class="trip-date">${periodMode==='week'?time(t.departureTime):shortDate(t.departureTime)+'<br>'+time(t.departureTime)}</div><div class="trip-main"><strong>${esc(labelLoc(t.origin)||'Onbekend')} → ${esc(labelLoc(t.destination)||'Onbekende bestemming')}</strong><small>${esc(tripOdometerRange(t))}${t.reason?' · '+esc(t.reason):''}</small></div><div class="trip-km trip-km-stack"><span>${km(t.actualKm)} km</span>${hasPrivatePart?`<small class="trip-private-sub">waarvan ${km(t.privateKm)} privé</small>`:''}</div><div class="chev">›</div></div></div>${expanded?tripInlineDetails(t):''}</div>`}
function tripList(arr){if(!arr.length)return'<div class="empty">Nog geen ritten.</div>';if(periodMode==='day')return`<div class="list">${arr.map(tripRow).join('')}</div>`;const groups=[];for(const t of arr){const g=tripGroup(t),last=groups[groups.length-1];if(!last||last.key!==g.key)groups.push({key:g.key,label:g.label,trips:[t]});else last.trips.push(t)}return groups.map(g=>`<div class="trip-group"><div class="trip-group-title">${esc(g.label)}</div><div class="list">${g.trips.map(tripRow).join('')}</div></div>`).join('')}
function resetTripSwipeRow(row){if(!row)return;const surface=row.querySelector('.swipe-surface');if(surface){surface.style.transition='transform .18s ease';surface.style.transform='translateX(0)'}row.classList.remove('swipe-open','delete-armed')}
function closeTripSwipes(except=null){document.querySelectorAll('.swipe-row').forEach(row=>{if(row!==except)resetTripSwipeRow(row)})}
function tripSwipeStart(e){if(e.button!=null&&e.button!==0)return;if(e.target.closest('button'))return;const surface=e.target.closest('.swipe-surface');if(!surface)return;const row=surface.closest('.swipe-row');closeTripSwipes(row);tripSwipe={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,dx:0,row,surface,id:row?.dataset.id||surface.dataset.id,kind:row?.dataset.swipeKind||'trip',horizontal:false,cancelled:false};try{surface.setPointerCapture(e.pointerId)}catch(_){} }
function tripSwipeMove(e){const g=tripSwipe;if(!g||g.pointerId!==e.pointerId||g.cancelled)return;const rawX=e.clientX-g.startX,rawY=e.clientY-g.startY;if(!g.horizontal){if(Math.abs(rawY)>10&&Math.abs(rawY)>Math.abs(rawX)){g.cancelled=true;return}if(Math.abs(rawX)>8&&Math.abs(rawX)>Math.abs(rawY))g.horizontal=true;else return}if(rawX>8){g.dx=0;resetTripSwipeRow(g.row);return}e.preventDefault();const canDelete=swipeDeleteEnabled(),max=canDelete?168:84,dx=Math.max(-max,Math.min(0,rawX));g.dx=dx;g.surface.style.transition='none';g.surface.style.transform=`translateX(${dx}px)`;g.row.classList.toggle('delete-armed',canDelete&&dx<=-132)}
function swipeEdit(kind,id){if(kind==='trip')openTripEdit(id);else if(kind==='event')openEventEdit(id);else if(kind==='location')openLocation(id)}
function swipeDelete(kind,id){if(kind==='trip')deleteTrip(id);else if(kind==='event')deleteEvent(id);else if(kind==='location')deleteLocation(id)}
function tripSwipeEnd(e){const g=tripSwipe;if(!g||g.pointerId!==e.pointerId)return;tripSwipe=null;if(g.cancelled||!g.horizontal){resetTripSwipeRow(g.row);return}g.surface.dataset.suppressClick='1';setTimeout(()=>{if(g.surface)delete g.surface.dataset.suppressClick},450);const canDelete=swipeDeleteEnabled();if(canDelete&&g.dx<=-132){resetTripSwipeRow(g.row);setTimeout(()=>swipeDelete(g.kind,g.id),20);return}if(g.dx<=-36){resetTripSwipeRow(g.row);setTimeout(()=>swipeEdit(g.kind,g.id),60);return}resetTripSwipeRow(g.row)}
function tripSwipeCancel(){if(tripSwipe)resetTripSwipeRow(tripSwipe.row);tripSwipe=null}


function openTripDetail(id){const t=data.trips.find(x=>x.id===id);if(!t)throw new Error('Rit niet gevonden.');const gps=data.trackPoints.filter(x=>x.tripId===id).length,points=data.events.filter(x=>x.tripId===id).sort((a,b)=>new Date(a.time)-new Date(b.time));openModal(`<div class="modal-head"><div><div class="kicker">Ritdetails</div><h2>Rit bekijken</h2></div><button class="close" data-action="close">×</button></div><div class="detail-hero"><div class="detail-date">${dateTime(t.departureTime)} → ${time(t.arrivalTime||t.departureTime)}</div><div class="detail-route">${esc(labelLoc(t.origin)||'Onbekend')}<span class="arrow">→</span>${esc(labelLoc(t.destination)||'Onbekende bestemming')}</div>${t.origin?.address||t.destination?.address?`<div class="detail-address">${t.origin?.address?'Vertrek: '+esc(t.origin.address)+'<br>':''}${t.destination?.address?'Bestemming: '+esc(t.destination.address):''}</div>`:''}</div><div class="row"><span class="pill">${categoryLabel(t.category)}</span>${t.privateKm&&t.category!=='private'?`<span class="pill">${km(t.privateKm)} km privé</span>`:''}</div><div class="detail-grid"><div class="detail-item"><span>Gereden</span><strong>${km(t.actualKm)} km</strong></div><div class="detail-item"><span>Kilometerstand</span><strong>${odo(t.startOdometer)} → ${odo(t.endOdometer)}</strong></div><div class="detail-item"><span>Routevoorstel</span><strong>${t.proposedRouteKm!=null?km(t.proposedRouteKm)+' km':'—'}</strong></div><div class="detail-item"><span>GPS-punten</span><strong>${gps}</strong></div></div><div class="detail-note"><div class="kicker" style="margin-bottom:5px">Reden / omschrijving</div>${t.reason?esc(t.reason):'<span class="muted">Geen omschrijving ingevuld.</span>'}</div>${points.length?`<div class="section"><div class="kicker">Onderweg · tik om te bekijken</div>${routePointList(points,true)}</div>`:''}<div class="row" style="margin-top:14px"><button class="btn secondary" data-action="close">Sluiten</button><button class="btn" data-action="edit-trip" data-id="${id}">Aanpassen</button></div>`)}
function editOptions(cur){const id=cur?.id||'';let s='';if(!cur)s+=`<option value="__unknown__" selected>Onbekende bestemming</option>`;else if(!id||!data.locations.some(x=>x.id===id))s+=`<option value="__current__" selected>Huidig: ${esc(labelLoc(cur)||'Onbekend')}</option>`;return s+locationOptions(id)}
function openTripEdit(id){const t=data.trips.find(x=>x.id===id);if(!t)throw new Error('Rit niet gevonden.');openModal(`<div class="modal-head"><div><div class="kicker">Wijzigen</div><h2>Rit aanpassen</h2></div><button class="close" data-action="back-detail" data-id="${id}">×</button></div><form id="tripEditForm" class="quiet-edit-form" onsubmit="return false"><input type="hidden" name="id" value="${id}"><div class="form-group"><label>Vertrek</label><select name="originId">${editOptions(t.origin)}</select></div><div class="form-group"><label>Bestemming</label><select name="destinationId">${editOptions(t.destination)}</select></div>${field('Startstand','startOdometer',t.startOdometer,'number')}${field('Eindstand','endOdometer',t.endOdometer,'number')}<div class="time-pair">${field('Vertrektijd','departureTime',localInput(t.departureTime),'datetime-local')}${field('Aankomsttijd','arrivalTime',localInput(t.arrivalTime||t.departureTime),'datetime-local')}</div><div class="form-group"><label>Type rit</label><select name="category"><option value="commute" ${t.category==='commute'?'selected':''}>Woon-werk</option><option value="business" ${t.category==='business'?'selected':''}>Zakelijk</option><option value="private" ${t.category==='private'?'selected':''}>Privé</option></select></div>${field('Reden / omschrijving','reason',t.reason||'')}<div data-private-km-field ${t.category==='private'?'hidden':''}>${field('Privédeel km','privateKm',t.privateKm||0,'number')}</div><div class="notice warning">Bij een historische wijziging worden aangrenzende ritten niet automatisch aangepast.</div><div id="tripEditStatus" class="hint"></div><button class="btn full" type="button" data-action="save-trip-edit">Wijzigingen opslaan</button><div class="divider"></div><button class="btn danger full" type="button" data-action="delete-trip" data-id="${id}">Rit verwijderen</button></form>`)}
function returnFromTripEdit(id){closeModal();expandedTripId=id||null;render()}
function saveTripEdit(){const f=document.getElementById('tripEditForm');if(!f)throw new Error('Ritformulier niet gevonden.');const fd=new FormData(f),id=String(fd.get('id')),old=data.trips.find(x=>x.id===id);if(!old)throw new Error('Rit niet gevonden.');const s=num(fd.get('startOdometer')),e=num(fd.get('endOdometer'));if(s==null||e==null||e<s)throw new Error('Controleer kilometerstanden.');const dep=new Date(String(fd.get('departureTime'))),arr=new Date(String(fd.get('arrivalTime')));if(Number.isNaN(dep.getTime())||Number.isNaN(arr.getTime())||arr<dep)throw new Error('Controleer vertrek- en aankomsttijd.');const oc=String(fd.get('originId')),dc=String(fd.get('destinationId')),o=oc==='__current__'?old.origin:data.locations.find(x=>x.id===oc),d=dc==='__unknown__'?null:dc==='__current__'?old.destination:data.locations.find(x=>x.id===dc);if(!o)throw new Error('Controleer het vertrekpunt.');const actual=e-s,cat=String(fd.get('category')),p=cat==='private'?actual:(num(fd.get('privateKm'))||0);if(p<0||p>actual)throw new Error('Privédeel is ongeldig.');const z=split(actual,cat,p),updated={...old,origin:snap(o),destination:snap(d),departureTime:dep.toISOString(),arrivalTime:arr.toISOString(),startOdometer:s,endOdometer:e,actualKm:actual,category:cat,reason:String(fd.get('reason')||'').trim(),privateKm:z.private,businessKm:z.business,commuteKm:z.commute,updatedAt:new Date().toISOString()};data.trips[data.trips.findIndex(x=>x.id===id)]=updated;rebuildLast();save();const stored=JSON.parse(localStorage.getItem(KEY)||'{}').trips?.find(x=>x.id===id);if(!stored||+stored.startOdometer!==s||+stored.endOdometer!==e)throw new Error('Wijziging niet teruggevonden in opslag.');expandedTripId=id;toast('Rit bijgewerkt.');closeModal();render()}
function deleteTrip(id){if(!confirm('Deze rit verwijderen? Ook tankpunten en omrijpunten van deze rit worden verwijderd.'))return;if(expandedTripId===id)expandedTripId=null;data.trips=data.trips.filter(x=>x.id!==id);data.events=data.events.filter(x=>x.tripId!==id);data.trackPoints=data.trackPoints.filter(x=>x.tripId!==id);if(trackStoreReady)deleteTrackPointsForTrip(id).catch(e=>console.warn(e));rebuildLast();save();closeModal();render();toast('Rit en gekoppelde toevoegingen verwijderd.')}

function openEventDetail(id){const ev=data.events.find(x=>x.id===id);if(!ev)throw new Error('Rittoevoeging niet gevonden.');const trip=ev.tripId?data.trips.find(x=>x.id===ev.tripId):null;openModal(`<div class="modal-head"><div><div class="kicker">Rittoevoeging</div><h2>${ev.type==='tank'?'Tankpunt':'Omrijpunt'}</h2></div><button class="close" data-action="close">×</button></div><div class="detail-hero"><div class="detail-date">${dateTime(ev.time)}</div><div class="detail-route">${ev.type==='tank'?'⛽':'↪'} ${esc(labelLoc(ev.location)||'Locatie niet vastgelegd')}</div>${ev.location?.address?`<div class="detail-address">${esc(ev.location.address)}</div>`:''}</div><div class="detail-grid"><div class="detail-item"><span>Kilometerstand</span><strong>${ev.odometer!=null?odo(ev.odometer)+' km':'—'}</strong></div><div class="detail-item"><span>Gekoppeld aan rit</span><strong>${trip?esc(labelLoc(trip.origin)||'Onbekend')+' → '+esc(labelLoc(trip.destination)||'Onbekend'):'Nee'}</strong></div></div><div class="detail-note"><div class="kicker" style="margin-bottom:5px">Notitie</div>${ev.note?esc(ev.note):'<span class="muted">Geen notitie.</span>'}</div><div class="event-actions"><button class="btn secondary" data-action="close">Sluiten</button><button class="btn" data-action="edit-event" data-id="${id}">Aanpassen</button></div>`)}

async function openStart(){

let origin=data.lastEndpoint?.location||inferLast()?.location||null;
const start=data.lastEndpoint?.odometer??inferLast()?.odometer??num(data.settings.initialOdometer);
if(start==null){view='settings';render();throw new Error('Vul eerst de huidige kilometerstand in bij Bestuurder & auto.');}

const suggestedDestination=destinationSuggestion.location;
const categorySuggestion=suggestTripCategory(origin,suggestedDestination,new Date());
openModal(`<div class="modal-head"><div><div class="kicker">Vertrek</div><h2>Rit starten</h2></div><button class="close" data-action="close">×</button></div><form id="startForm"><input type="hidden" name="origin" value='${attr(JSON.stringify(origin))}'><div class="route"><small>Vertrek automatisch vanaf</small><strong>${esc(labelLoc(origin))}</strong><small>${odo(start)} km</small></div><div class="form-group"><label>Eindbestemming</label><select name="destinationId" id="startDestination"><option value="__unknown__" ${suggestedDestination?'':'selected'}>Nog onbekend</option>${locationNameOptions(suggestedDestination?.id||'')}</select>${suggestedDestination?`<div class="suggestion-note">Voorstel: ${esc(labelLoc(suggestedDestination))} · ${esc(destinationSuggestion.reason)}</div>`:`<div class="suggestion-note">Nog geen duidelijke bestemming uit je historie. Je kunt gewoon vertrekken zonder bestemming.</div>`}</div><div class="form-group"><label>Type rit</label><div class="trip-type-grid">${startCategoryOption('commute','Woon-werk',categorySuggestion.value)}${startCategoryOption('business','Zakelijk',categorySuggestion.value)}${startCategoryOption('private','Privé',categorySuggestion.value)}</div><div class="trip-type-hint">Voorstel: ${esc(categoryLabel(categorySuggestion.value))} · ${esc(categorySuggestion.reason)}</div></div><button class="btn full" type="submit">Rit starten</button></form>`);
}

function openModal(html){modalPanel.innerHTML=html;modal.hidden=false;document.body.style.overflow='hidden'}
function closeModal(){modal.hidden=true;modalPanel.innerHTML='';document.body.style.overflow=''}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),3000)}
function showError(m){toast('Fout: '+m);setTimeout(()=>alert('Fout:\n\n'+m),50)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'&#96;')}

function reportTrips(){return periodTrips()}
function csvText(){const rows=[['Datum','Vertrek','Bestemming','Start km','Eind km','Totaal km','Type','Reden','Zakelijk km','Woon-werk km','Privé km']];for(const t of reportTrips())rows.push([dateTime(t.departureTime),labelLoc(t.origin),labelLoc(t.destination),t.startOdometer,t.endOdometer,t.actualKm,categoryLabel(t.category),t.reason||'',t.businessKm||0,t.commuteKm||0,t.privateKm||0]);return rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n')}
function exportJson(){data.settings.lastBackupAt=new Date().toISOString();save();const payload={...data,trackPoints:[...data.trackPoints]};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`kilometerregistratie-backup-${new Date().toISOString().slice(0,10)}.json`);render();toast('Back-up gemaakt.')}
async function importJson(file){try{const x=JSON.parse(await file.text());if(!confirm('Bestaande gegevens vervangen door deze back-up?'))return;data=normalize(x);if('indexedDB' in window){try{await replaceTrackStore(data.trackPoints);trackStoreReady=true}catch(e){console.warn('GPS-import gebruikt lokale fallback',e);trackStoreReady=false}}save();render();toast('Back-up geïmporteerd.')}catch(e){showError('Back-up kon niet worden gelezen.')}}
function downloadCsv(){download(new Blob([csvText()],{type:'text/csv;charset=utf-8'}),`kilometerregistratie-${periodSlug()}.csv`)}
async function shareCsv(){const f=new File([csvText()],`kilometerregistratie-${periodSlug()}.csv`,{type:'text/csv'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'Kilometerregistratie '+periodLabel()});else downloadCsv()}
function emailReport(){const t=totals(reportTrips()),field=document.querySelector('#settingsForm [name="reportEmail"]'),to=(field?.value||data.settings.reportEmail||''),lines=[`${periodLabel()}`,`Totaal: ${km(t.total)} km`];if(t.business>0)lines.push(`Zakelijk: ${km(t.business)} km`);if(t.commute>0)lines.push(`Woon-werk: ${km(t.commute)} km`);if(t.private>0)lines.push(`Privé: ${km(t.private)} km`);location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Kilometerregistratie '+periodLabel())}&body=${encodeURIComponent(lines.join('\n'))}`}
function printPeriod(){const trips=reportTrips(),t=totals(trips);printReportEl.innerHTML=`<h1>Kilometerregistratie – ${esc(periodLabel())}</h1><p>${esc(data.settings.name||'')}${data.settings.plate?' · '+esc(data.settings.plate):''}</p><p>${esc(periodSubLabel(trips))}</p>${summary(t,'Overzicht',trips.length)}<div style="margin-top:18px">${tripList(trips)}</div>`;window.print();setTimeout(()=>printReportEl.innerHTML='',1000)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
})();
</script>
</body>
</html>

name: Apply share icon and no-zoom refinements

on:
  push:
    branches:
      - feature/0.28.14-share-icons-no-zoom

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.14-share-icons-no-zoom
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-share-icons-no-zoom.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.14" index.html
          grep -q "kmreg-shell-0.28.14" service-worker.js
          grep -q "location-share-status.filled" index.html
          grep -q "font-size:16px!important" index.html
          grep -q "share-symbol" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.14: verduidelijk delen en voorkom iOS-zoom"
          git push origin HEAD:feature/0.28.14-share-icons-no-zoom

name: Apply location color update

on:
  push:
    branches:
      - feature/0.27.8-location-colors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.27.8-location-colors
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-location-colors.py
          node --check /tmp/kmreg-app.js
          grep -q "0.27.8" index.html
          grep -q "kmreg-shell-0.27.8" service-worker.js
          grep -q "location-type-home" index.html
          grep -q "location-share-status" index.html
          if grep -q "Delen:" index.html; then
            echo "Short share status text still present" >&2
            exit 1
          fi
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.27.8: kleurmarkering voor locaties"
          git push origin HEAD:feature/0.27.8-location-colors

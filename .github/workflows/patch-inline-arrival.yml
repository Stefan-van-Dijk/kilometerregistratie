name: Apply inline arrival refinement

on:
  push:
    branches:
      - feature/0.28.8-inline-arrival

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.8-inline-arrival
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-inline-arrival.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.8" index.html
          grep -q "kmreg-shell-0.28.8" service-worker.js
          grep -q "function arrivalInlinePanel" index.html
          grep -q "arrivalDraft={gps,arrivalChoice" index.html
          grep -q "cancel-arrival" index.html
          ! grep -q '\${activeDock(a)}' index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.8: toon aankomst inline"
          git push origin HEAD:feature/0.28.8-inline-arrival

name: Apply editor icon layout refinements

on:
  push:
    branches:
      - feature/0.28.13-editor-icon-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.13-editor-icon-layout
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-editor-icon-layout.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.13" index.html
          grep -q "kmreg-shell-0.28.13" service-worker.js
          grep -q "edit-trip-type.category-commute" index.html
          grep -q "location-type-status" index.html
          grep -q "share-box-fill" index.html
          grep -q "min-height:58px" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.13: verfijn type- en deeliconen"
          git push origin HEAD:feature/0.28.13-editor-icon-layout

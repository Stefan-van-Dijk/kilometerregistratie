name: Apply location UX update

on:
  push:
    branches:
      - feature/0.28.0-location-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.0-location-ux
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-location-ux.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.0" index.html
          grep -q "kmreg-shell-0.28.0" service-worker.js
          grep -q "A–Z Naam" index.html
          grep -q "location-toggle" index.html
          grep -q "location-choice-grid type" index.html
          grep -q "location-choice-grid share" index.html
          grep -q "settingsLocationsOpen" index.html
          grep -q "locationMomentScore" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.0: verbeter locatiebeheer"
          git push origin HEAD:feature/0.28.0-location-ux

name: Apply waypoint count and edit styling

on:
  push:
    branches:
      - feature/0.28.3-waypoints-edit-style

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.3-waypoints-edit-style
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-waypoints-edit-style.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.3" index.html
          grep -q "kmreg-shell-0.28.3" service-worker.js
          grep -q "function locationRegisteredTripCount" index.html
          grep -q "completed.has(ev.tripId)" index.html
          grep -q "edit-trip-type-grid" index.html
          grep -q "class=\"edit-form\"" index.html
          grep -q "Locatie aanpassen" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.3: tel tussenstops mee en verfijn bewerken"
          git push origin HEAD:feature/0.28.3-waypoints-edit-style

name: Apply light edit UI fix

on:
  push:
    branches:
      - feature/0.28.4-light-edit-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.4-light-edit-ui
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-light-edit-ui.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.4" index.html
          grep -q "kmreg-shell-0.28.4" service-worker.js
          grep -q "function coordinateInputValue" index.html
          grep -q "background:var(--card)" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.4: herstel lichte bewerkvelden"
          git push origin HEAD:feature/0.28.4-light-edit-ui

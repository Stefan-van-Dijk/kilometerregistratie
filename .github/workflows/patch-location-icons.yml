name: Apply location icon refinements

on:
  push:
    branches:
      - feature/0.28.12-location-icons

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.12-location-icons
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-location-icons.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.12" index.html
          grep -q "kmreg-shell-0.28.12" service-worker.js
          grep -q "location-type-glyph" index.html
          grep -q "locationShareGlyph" index.html
          grep -q "location-link-status{display:none" index.html
          grep -q "locationStatusIcons(l){const share=" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.12: verfijn locatie- en deeliconen"
          git push origin HEAD:feature/0.28.12-location-icons

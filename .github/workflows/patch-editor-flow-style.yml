name: Apply editor flow style

on:
  push:
    branches:
      - feature/0.28.10-editor-flow-style

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.10-editor-flow-style
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-editor-flow-style.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.10" index.html
          grep -q "kmreg-shell-0.28.10" service-worker.js
          grep -q "bewerkpagina's in dezelfde flow-stijl" index.html
          grep -q "position:static;width:100%;max-width:620px" index.html
          grep -q "prefers-reduced-motion:reduce" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.10: trek bewerkpagina's gelijk met ritflow"
          git push origin HEAD:feature/0.28.10-editor-flow-style

name: Apply inline start refinement

on:
  push:
    branches:
      - feature/0.28.7-inline-start

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.7-inline-start
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-inline-start.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.7" index.html
          grep -q "kmreg-shell-0.28.7" service-worker.js
          grep -q "start-inline-panel" index.html
          grep -q "function refreshStartCategorySuggestion" index.html
          grep -q "homePeriodOrStartPanel" index.html
          ! grep -q "openModal(.*Vertrek" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.7: toon vertrekkeuzes inline"
          git push origin HEAD:feature/0.28.7-inline-start

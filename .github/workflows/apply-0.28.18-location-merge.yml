name: Apply 0.28.18 location merge

on:
  push:
    branches:
      - feature/0.28.18-location-merge

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply location merge patch
        run: python .github/patches/patch_0_28_18_location_merge.py
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
              if 'src=' not in attrs.lower(): blocks.append(body)
          Path('/tmp/index.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/index.js
      - name: Verify narrow scope
        run: |
          git diff --check
          grep -q "0.28.18" index.html
          grep -q "kmreg-shell-0.28.18" service-worker.js
          grep -q "function openLocationMerge" index.html
          grep -q "function confirmLocationMerge" index.html
          grep -q "function uid(){return window.crypto?.randomUUID" index.html
          ! grep -q "CORE_ID_ALPHABET" index.html
          ! grep -q "migrateCoreIds" index.html
      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m '0.28.18: restore safe location merge only'
          git push

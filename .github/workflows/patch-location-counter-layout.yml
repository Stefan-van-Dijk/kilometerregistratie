name: Apply location counter layout

on:
  push:
    branches:
      - feature/0.28.2-location-counter-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.2-location-counter-layout
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-location-counter-layout.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.2" index.html
          grep -q "kmreg-shell-0.28.2" service-worker.js
          grep -q "function locationRegisteredTripCount" index.html
          grep -q "Geregistreerde ritten" index.html
          grep -q "GPS-locatie" index.html
          grep -q "location-inline-pair" index.html
          ! grep -q "incrementUse(d.id)" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.2: corrigeer locatieteller en details"
          git push origin HEAD:feature/0.28.2-location-counter-layout

name: Temporary 0.25.1 build
on:
  push:
    branches: [fix/0.25.1-swipe-settings]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'build: 0.25.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.25.1-swipe-settings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch_0251.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>\s*\(\(\)=>\{(.*)\}\)\(\);\s*</script>',s,re.S)
          assert m, 'inline script not found'
          Path('/tmp/app.js').write_text("(()=>{"+m.group(1)+"})();")
          PY
          node --check /tmp/app.js
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Commit implementation
        run: |
          git config user.name "Stefan-van-Dijk"
          git config user.email "stefanvandijk@me.com"
          git add index.html service-worker.js
          git commit -m "build: 0.25.1 swipebeveiliging en onderweg-lijst"
          git push origin HEAD:fix/0.25.1-swipe-settings

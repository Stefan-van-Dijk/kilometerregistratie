name: Apply glass editor style

on:
  push:
    branches:
      - feature/0.28.11-glass-editors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.11-glass-editors
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-glass-editors.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.11" index.html
          grep -q "kmreg-shell-0.28.11" service-worker.js
          grep -q "editor-glass-button" index.html
          grep -q "editor-more-menu" index.html
          grep -q "input:checked+span::before" index.html
          grep -q "editor-savebar{display:none" index.html
          grep -q "editorNav('Rit aanpassen','save-trip-edit'" index.html
          grep -q "editorNav(title,'save-location'" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.11: vereenvoudig bewerkpagina's met glasnavigatie"
          git push origin HEAD:feature/0.28.11-glass-editors

name: Apply 0.28.20 quickbar and swipe

on:
  push:
    branches:
      - feature/0.28.20-sticky-quickbar-swipe

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patches/patch_0_28_20_quickbar.py
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          blocks=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I):
              if 'src=' not in attrs.lower(): blocks.append(body)
          Path('/tmp/index.js').write_text('\n'.join(blocks))
          PY
          node --check /tmp/index.js
      - name: Verify UI-only scope
        run: |
          git diff --check
          grep -q "0.28.20" index.html
          grep -q "kmreg-shell-0.28.20" service-worker.js
          grep -q "function renderQuickBar" index.html
          grep -q "function screenSwipePreviewHtml" index.html
          grep -q "SCREEN_EDGE_SWIPE_ZONE=64" index.html
          grep -q "Vertrek</strong><small>registreren" index.html
          grep -q "quick-settings-label"> /dev/null 2>&1 || true
          grep -q "const ID_ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';" index.html
          ! grep -q "migrateCoreIds" index.html
      - name: Check no storage schema changes
        run: |
          git diff 6169093520942b43cd1210f78273a478e90f6af2 -- index.html | grep -v '^[-+].*quick' | grep -v '^[-+].*screen' | grep -v '^[-+].*0.28.2' > /tmp/review.diff || true
          grep -q "const KEY='kmreg-v4-data'" index.html
          grep -q "function save(){" index.html
      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m '0.28.20: prioritize quick actions and improve page swipe'
          git push

name: Apply tokenless geocoding update

on:
  push:
    branches:
      - feature/0.27.9-nominatim-geocoding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.27.9-nominatim-geocoding
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-nominatim-geocoding.py
          node --check /tmp/kmreg-app.js
          grep -q "0.27.9" index.html
          grep -q "kmreg-shell-0.27.9" service-worker.js
          grep -q "nominatim.openstreetmap.org" index.html
          grep -q "GEOCODE_CACHE_KEY" index.html
          grep -q "A↔⌖" index.html
          grep -q "OpenStreetMap-bijdragers" index.html
          if grep -q "MapKit\|Apple Maps-token\|kmreg-mapkit-token" index.html; then
            echo "MapKit/token remnants found" >&2
            exit 1
          fi
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.27.9: tokenloze adres en GPS koppeling"
          git push origin HEAD:feature/0.27.9-nominatim-geocoding

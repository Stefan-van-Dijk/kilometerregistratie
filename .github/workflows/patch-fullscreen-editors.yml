name: Apply fullscreen editors

on:
  push:
    branches:
      - feature/0.28.5-fullscreen-editors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/0.28.5-fullscreen-editors
          fetch-depth: 0
      - name: Apply and verify update
        shell: bash
        run: |
          python3 .github/scripts/patch-fullscreen-editors.py
          node --check /tmp/kmreg-app.js
          grep -q "0.28.5" index.html
          grep -q "kmreg-shell-0.28.5" service-worker.js
          grep -q "function renderTripEditPage" index.html
          grep -q "function renderLocationEditPage" index.html
          grep -q "class=\"editor-nav\"" index.html
          grep -q "class=\"editor-savebar\"" index.html
          grep -q "view==='trip-edit'" index.html
          grep -q "view==='location-edit'" index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "0.28.5: maak bewerken volwaardige pagina's"
          git push origin HEAD:feature/0.28.5-fullscreen-editors

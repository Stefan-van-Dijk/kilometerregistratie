name: Apply smart arrival estimate update

on:
  push:
    branches:
      - feature/smart-arrival-estimate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-arrival-estimate
          fetch-depth: 0
      - name: Apply update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch-smart-arrival.py')
          s=p.read_text(encoding='utf-8')
          old="helpers_and_estimates + '\\nfunction routeTripsBetween(origin,destination){'"
          new="helpers_and_estimates + '\\n'"
          if old not in s:
              raise SystemExit('patch correction marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/patch-smart-arrival.py
          node --check /tmp/kmreg-app.js
          grep -q "0.27.7" index.html
          grep -q "kmreg-shell-0.27.7" service-worker.js
          grep -q "Reistijd × routesnelheid" index.html
          grep -q "data-action=\"arrival-info\"" index.html
      - name: Commit update
        run: |
          rm -f .github/workflows/patch-smart-arrival.yml .github/scripts/patch-smart-arrival.py .smart-arrival-trigger .smart-arrival-trigger-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve smart arrival estimates"
          git push origin HEAD:feature/smart-arrival-estimate

name: Apply smart arrival estimate update

on:
  push:
    branches:
      - feature/smart-arrival-estimate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-arrival-estimate
          fetch-depth: 0

      - name: Apply update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def replace_section(start, end, replacement, label):
              global text
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker not found')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label}: end marker not found')
              text = text[:a] + replacement + text[b:]

          replace_once("+' · 0.27.6';", "+' · 0.27.7';", 'version')

          css = r'''
/* 0.27.7 — slimme aankomstschatting en uitlegbaar voorstel */
.odo-source-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.odo-source-row .odo-source{margin-top:0}.estimate-info-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer}.estimate-info-btn:active{color:var(--text);border-color:var(--accent)}.arrival-info-popup{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom));background:rgba(0,0,0,.58)}.arrival-info-popup[hidden]{display:none}.arrival-info-sheet{width:min(100%,560px);max-height:min(78dvh,680px);overflow:auto;padding:16px;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.45)}.arrival-info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.arrival-info-item{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.arrival-info-item span,.arrival-info-item strong{display:block}.arrival-info-item span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.arrival-info-item strong{margin-top:4px;font-size:13px}.estimate-confidence{display:inline-flex;margin-top:5px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800}.estimate-confidence.high{border-color:rgba(73,209,125,.45);color:var(--good)}.estimate-confidence.medium{border-color:rgba(77,163,255,.45);color:var(--accent)}.estimate-confidence.low{border-color:rgba(255,189,74,.45);color:var(--warn)}.arrival-info-reason{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.5}.arrival-info-note{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.45}@media(max-width:480px){.arrival-info-grid{grid-template-columns:1fr}.arrival-info-sheet{max-height:82dvh}}
@media (prefers-color-scheme:light){.arrival-info-popup{background:rgba(0,0,0,.28)}.arrival-info-sheet{box-shadow:0 18px 48px rgba(0,0,0,.18)}}
'''
          replace_once('\n</style>', '\n' + css + '\n</style>', 'arrival css')

          replace_once("else if(a==='toggle-odometer-edit')toggleOdometerEdit();", "else if(a==='toggle-odometer-edit')toggleOdometerEdit();else if(a==='arrival-info')openArrivalInfo();else if(a==='arrival-info-close')closeArrivalInfo();", 'arrival info actions')

          new_open_arrival = r'''async function openArrival(){
const a=data.activeTrip;if(!a)throw new Error('Er is geen actieve rit.');
let gps=null;try{gps=await getPosition()}catch(e){}
const moment=new Date(),arrivalChoice=arrivalDestinationSuggestion(a,gps,moment),suggested=arrivalChoice.location||null;
const proposalActive={...a,plannedDestination:a.expectedDestination||null,expectedDestination:suggested||a.expectedDestination||null};
const proposals=endOdometerProposals(proposalActive,gps,moment),first=proposals[0]||null,initial=first?.value??a.startOdometer;
const radius=recognitionRadius(),planned=a.expectedDestination||null,recognized=arrivalChoice.recognized===true;
const plannedDiff=planned&&suggested&&!sameLoc(planned,suggested);
const locationText=suggested?`Voorstel: ${esc(labelLoc(suggested))}`:'Nog geen opgeslagen locatie herkend';
const locationReason=arrivalChoice.reason||'Controleer de bestemming.';
openModal(`<div class="modal-head"><div><div class="kicker">Aankomst</div><h2>Controleer bestemming en stand</h2></div><button class="close" data-action="close">×</button></div><form id="arrivalForm"><input type="hidden" name="endOdometer" id="arrivalEndOdometer" value="${attr(initial)}"><input type="hidden" name="arrivalGpsJson" id="arrivalGpsJson" value='${attr(JSON.stringify(gps))}'><div class="route"><strong>${esc(labelLoc(a.origin)||'Onbekend')} → ${esc(labelLoc(planned)||'Bestemming niet vastgelegd')}</strong><small>${categoryLabel(a.category||'business')} · start ${odo(a.startOdometer)} km</small></div><div class="arrival-location-card"><strong>${locationText}</strong><small>${esc(locationReason)}</small><span class="recognition-chip ${recognized?'good':'warn'}">Herkenningsstraal ${odo(radius)} m${arrivalChoice.distance!=null?' · '+odo(arrivalChoice.distance)+' m afstand':''}</span>${plannedDiff?`<div class="arrival-location-change">Gepland: ${esc(labelLoc(planned))} · huidige locatie wijst op ${esc(labelLoc(suggested))}</div>`:''}</div><div class="form-group"><label>Eindbestemming</label><select name="destinationChoice" id="arrivalDestination">${arrivalDestinationOptions(arrivalChoice,gps,a)}</select><div class="suggestion-note">Automatische herkenning gebruikt alleen opgeslagen locaties binnen de ingestelde herkenningsstraal. Tijd, routesnelheid en ritgeschiedenis bepalen daarna het kilometerstandvoorstel.</div></div><div class="odo-card"><div class="odo-caption">Geschatte eindstand</div><div class="odo-display" id="odoDigits">${odometerDigits(initial)}</div><div class="odo-unit">KM</div><div class="odo-source-row"><div class="odo-source" id="odoSource">${esc(first?.label||'Nog geen betrouwbare schatting')}</div><button type="button" class="estimate-info-btn" data-action="arrival-info" aria-label="Uitleg over deze schatting">ⓘ</button></div><div class="odo-swipe-hint">Swipe een cijfer omhoog of omlaag voor een snelle correctie</div></div><div id="estimateListWrap">${estimateButtons(proposals)}</div><div class="odo-actions"><button type="submit" class="btn">${proposals.length?'Deze stand goedkeuren':'Stand opslaan'}</button><button type="button" class="btn secondary" data-action="toggle-odometer-edit">Aanpassen</button></div><div class="odo-edit" id="odometerEdit" ${proposals.length?'hidden':''}><div class="form-group" style="margin:0"><label>Werkelijke eindstand</label><input id="arrivalCustomEnd" type="number" inputmode="numeric" value="${attr(initial)}"></div><div class="hint">Vul de kilometerstand van het dashboard in. De grote weergave hierboven verandert direct mee.</div></div><div class="arrival-note">Aankomsttijd wordt automatisch vastgelegd. De dashboardstand blijft altijd leidend.</div><div id="arrivalInfoPopup" class="arrival-info-popup" hidden><div class="arrival-info-sheet"><div class="modal-head"><div><div class="kicker">Uitleg schatting</div><h2>Hoe is dit voorstel bepaald?</h2></div><button type="button" class="close" data-action="arrival-info-close">×</button></div><div id="arrivalInfoContent"></div></div></div></form>`);
}'''
          replace_section('async function openArrival(){', 'function saveArrival(fd){', new_open_arrival + '\n', 'openArrival')

          replace_once("actualKm:actual,proposedRouteKm:a.proposedRouteKm??null,category:cat", "actualKm:actual,proposedRouteKm:a.proposedRouteKm??null,plannedDestination:snap(a.expectedDestination),category:cat", 'save planned destination')
          replace_once('<span>Routevoorstel</span>', '<span>Routevoorstel bij vertrek</span>', 'route proposal label')

          new_refresh = r'''function refreshArrivalEstimates(){
const a=data.activeTrip;if(!a)return;closeArrivalInfo();
const gps=JSON.parse(document.getElementById('arrivalGpsJson')?.value||'null'),destination=selectedArrivalDestination(),proposalActive={...a,plannedDestination:a.expectedDestination||null,expectedDestination:destination},proposals=endOdometerProposals(proposalActive,gps,new Date()),wrap=document.getElementById('estimateListWrap');
if(wrap)wrap.innerHTML=estimateButtons(proposals);const first=proposals[0];if(first){updateOdometerVisual(first.value,first.label);const edit=document.getElementById('odometerEdit');if(edit)edit.hidden=true}else{const tracked=trackedDistanceKm(a.id,a.origin,gps),fallback=tracked!=null?Math.round(+a.startOdometer+tracked):+a.startOdometer;updateOdometerVisual(fallback,tracked!=null?'GPS · gemeten tijdens deze rit':'Handmatige controle nodig');const edit=document.getElementById('odometerEdit');if(edit)edit.hidden=false}
}'''
          replace_section('function refreshArrivalEstimates(){', 'async function openTank()', new_refresh + '\n\n', 'refreshArrivalEstimates')

          helpers_and_estimates = r'''function routeTravelStats(origin,destination){
if(!origin||!destination)return{count:0,avgDistance:null,avgDuration:null,avgSpeed:null};
const rows=routeTripsBetween(origin,destination).slice(0,20).map(t=>{const dep=new Date(t.departureTime),arr=new Date(t.arrivalTime||t.departureTime),minutes=(arr-dep)/60000,distanceKm=+t.actualKm||0,speed=minutes>0?distanceKm/(minutes/60):null;return{minutes,distanceKm,speed}}).filter(x=>x.distanceKm>=.2&&x.minutes>=2&&Number.isFinite(x.speed)&&x.speed>=5&&x.speed<=180).slice(0,12);
if(!rows.length)return{count:0,avgDistance:null,avgDuration:null,avgSpeed:null};
const totalDistance=rows.reduce((s,x)=>s+x.distanceKm,0),totalMinutes=rows.reduce((s,x)=>s+x.minutes,0);return{count:rows.length,avgDistance:totalDistance/rows.length,avgDuration:totalMinutes/rows.length,avgSpeed:totalMinutes>0?totalDistance/(totalMinutes/60):null};
}
function arrivalEstimateContext(active,destination,arrivalGps,moment=new Date()){
const dep=new Date(active.departureTime||moment),now=new Date(moment),elapsedMinutes=Math.max(0,(now-dep)/60000),gpsKm=trackedDistanceKm(active.id,active.origin,arrivalGps),planned=active.plannedDestination||active.expectedDestination||null,samePlace=!!destination&&sameLoc(active.origin,destination),destinationChanged=!!(planned&&destination&&!sameLoc(planned,destination)),stats=destination?routeTravelStats(active.origin,destination):{count:0,avgDistance:null,avgDuration:null,avgSpeed:null};
const zeroLikely=samePlace&&((gpsKm!=null&&gpsKm<.3)||(gpsKm==null&&elapsedMinutes<=10));
let confidence='low',confidenceLabel='Controle nodig',reason='Er is nog te weinig betrouwbare informatie om de stand automatisch te bepalen.';
if(zeroLikely){confidence=gpsKm!=null?'high':'medium';confidenceLabel=gpsKm!=null?'Hoog':'Redelijk';reason=gpsKm!=null?'Je bent terug op dezelfde locatie en GPS laat nauwelijks verplaatsing zien.':'Je bent binnen korte tijd terug op dezelfde locatie. Daarom is 0 km het meest logische voorstel.'}
else if(gpsKm!=null&&gpsKm>=.3&&stats.count>=2){confidence='high';confidenceLabel='Hoog';reason='GPS, reistijd en eerdere ritten op deze route ondersteunen het voorstel.'}
else if(gpsKm!=null&&gpsKm>=.3){confidence='medium';confidenceLabel='Redelijk';reason='De gereden afstand is vooral gebaseerd op GPS van deze rit.'}
else if(stats.count>=2){confidence='medium';confidenceLabel='Redelijk';reason='Het voorstel gebruikt reistijd en eerdere ritten op deze route.'}
if(destinationChanged)reason+=' Het routevoorstel van vertrek wordt niet gebruikt omdat de werkelijke bestemming is gewijzigd.';
return{elapsedMinutes,gpsKm,planned,samePlace,destinationChanged,zeroLikely,stats,confidence,confidenceLabel,reason};
}
function formatTravelMinutes(v){if(!Number.isFinite(+v))return'—';const m=Math.max(0,Math.round(+v));if(m<60)return`${m} min`;const h=Math.floor(m/60),rest=m%60;return rest?`${h} u ${rest} min`:`${h} u`}
function closeArrivalInfo(){const popup=document.getElementById('arrivalInfoPopup');if(popup)popup.hidden=true}
function openArrivalInfo(){
const a=data.activeTrip,popup=document.getElementById('arrivalInfoPopup'),content=document.getElementById('arrivalInfoContent');if(!a||!popup||!content)return;
const destination=selectedArrivalDestination(),gps=JSON.parse(document.getElementById('arrivalGpsJson')?.value||'null'),ctx=arrivalEstimateContext({...a,plannedDestination:a.expectedDestination||null},destination,gps,new Date()),end=num(document.getElementById('arrivalEndOdometer')?.value),distanceKm=end==null?null:Math.max(0,end-a.startOdometer),source=document.getElementById('odoSource')?.textContent||'Handmatige controle';
const stats=ctx.stats,plannedDifferent=ctx.destinationChanged&&ctx.planned,plannedLine=plannedDifferent?`<div class="arrival-info-note">Gepland bij vertrek: <strong>${esc(labelLoc(ctx.planned)||'Onbekend')}</strong>${a.proposedRouteKm!=null?` · ${km(a.proposedRouteKm)} km`:''}. Dit vertrekvoorstel wordt nu niet gebruikt, omdat de werkelijke bestemming anders is.</div>`:'';
content.innerHTML=`<div class="arrival-info-grid"><div class="arrival-info-item"><span>Werkelijke bestemming</span><strong>${esc(labelLoc(destination)||'Nog onbekend')}</strong></div><div class="arrival-info-item"><span>Reistijd</span><strong>${formatTravelMinutes(ctx.elapsedMinutes)}</strong></div><div class="arrival-info-item"><span>GPS-afstand</span><strong>${ctx.gpsKm!=null?km(ctx.gpsKm)+' km':'Niet voldoende gemeten'}</strong></div><div class="arrival-info-item"><span>Huidig voorstel</span><strong>${distanceKm!=null?km(distanceKm)+' km · '+odo(end)+' km':'Handmatig controleren'}</strong></div>${stats.count?`<div class="arrival-info-item"><span>Routehistorie</span><strong>${stats.count} vergelijkbare rit${stats.count===1?'':'ten'}</strong></div><div class="arrival-info-item"><span>Gemiddelde afstand</span><strong>${km(stats.avgDistance)} km</strong></div><div class="arrival-info-item"><span>Gemiddelde reistijd</span><strong>${formatTravelMinutes(stats.avgDuration)}</strong></div><div class="arrival-info-item"><span>Gemiddelde snelheid</span><strong>${odo(stats.avgSpeed)} km/u</strong></div>`:''}</div><div><span class="estimate-confidence ${ctx.confidence}">Betrouwbaarheid: ${ctx.confidenceLabel}</span></div><div class="arrival-info-reason"><strong>${esc(source)}</strong><br>${esc(ctx.reason)}</div>${plannedLine}<div class="arrival-info-note">De app geeft alleen een voorstel. De werkelijke kilometerstand van het dashboard blijft leidend.</div>`;
popup.hidden=false;
}
function endOdometerProposals(active,arrivalGps,moment=new Date()){
const destination=active.expectedDestination||null,out=[],start=+active.startOdometer,ctx=arrivalEstimateContext(active,destination,arrivalGps,moment);
const add=(distanceKm,label)=>{if(!Number.isFinite(+distanceKm)||+distanceKm<0)return;const value=Math.round(start+(+distanceKm));if(value<start||out.some(x=>x.value===value))return;out.push({value,label,distance:+distanceKm})};
if(ctx.zeroLikely)add(0,`Zelfde locatie · ${formatTravelMinutes(ctx.elapsedMinutes)} onderweg`);
let pattern=null;if(destination){pattern=routePatternAnalysis(active.origin,destination);if(pattern?.shifted){const label=pattern.detourCount>0?`Recente omleidingsroute · ${pattern.recentCount} ritten`:`Actueel routepatroon · ${pattern.recentCount} recente ritten`;add(pattern.recentMedian,label)}}
if(ctx.gpsKm!=null&&ctx.gpsKm>=.3)add(ctx.gpsKm,'GPS · gemeten tijdens deze rit');
if(destination){
const routeTrips=routeTripsBetween(active.origin,destination),reverseTrips=routeTripsBetween(destination,active.origin),stats=ctx.stats;
if(stats.count>=2&&stats.avgSpeed!=null&&ctx.elapsedMinutes>=3){const speedKm=stats.avgSpeed*(ctx.elapsedMinutes/60),baseline=stats.avgDistance,withinHistory=baseline==null||(speedKm>=baseline*.65&&speedKm<=baseline*1.35);if(withinHistory)add(speedKm,`Reistijd × routesnelheid · ${odo(stats.avgSpeed)} km/u`)}
const timed=timedRouteDistance(routeTrips,active,moment);if(timed!=null)add(timed,'Tijd & historie · vergelijkbare ritten');
if(pattern?.shifted&&pattern.baselineMedian!=null)add(pattern.baselineMedian,'Normale route · historische mediaan');else if(pattern?.overallMedian!=null)add(pattern.overallMedian,'Routehistorie · mediaan');
if(routeTrips.length)add(+routeTrips[0].actualKm,'Laatste keer op deze route');
if(!routeTrips.length&&reverseTrips.length){const vals=reverseTrips.slice(0,7).map(t=>+t.actualKm);add(vals.reduce((a,b)=>a+b,0)/vals.length,'Historie · omgekeerde route')}
}
const planned=active.plannedDestination||active.expectedDestination||null,plannedMatches=!!(destination&&planned&&sameLoc(planned,destination));if(active.proposedRouteKm!=null&&plannedMatches)add(+active.proposedRouteKm,active.routeSource==='recent-detour'?'Voorstel bij vertrek · omleidingspatroon':active.routeSource==='recent-pattern'?'Voorstel bij vertrek · actueel patroon':'Voorstel bij vertrek');
return out.slice(0,4);
}
'''
          replace_section('function endOdometerProposals(active,arrivalGps,moment=new Date()){', 'function routeTripsBetween(origin,destination){', helpers_and_estimates + '\nfunction routeTripsBetween(origin,destination){', 'arrival estimate engine')

          index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          if sw_text.count("kmreg-shell-0.27.6") != 1:
              raise SystemExit('service worker cache version mismatch')
          sw.write_text(sw_text.replace("kmreg-shell-0.27.6", "kmreg-shell-0.27.7", 1), encoding='utf-8')

          import re
          match = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          if not match:
              raise SystemExit('script block not found')
          Path('/tmp/kmreg-app.js').write_text(match.group(1), encoding='utf-8')
          PY

          node --check /tmp/kmreg-app.js
          grep -q "0.27.7" index.html
          grep -q "kmreg-shell-0.27.7" service-worker.js
          grep -q "Reistijd × routesnelheid" index.html
          grep -q "data-action=\"arrival-info\"" index.html

      - name: Commit update
        shell: bash
        run: |
          rm .github/workflows/patch-smart-arrival.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve smart arrival estimates"
          git push origin HEAD:feature/smart-arrival-estimate
